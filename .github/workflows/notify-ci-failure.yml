---
name: CI Failure Notification
# yamllint disable rule:truthy rule:line-length

# Sends a Slack message when a watched workflow fails:
# - CI, on a push to `main`. Pull request runs are not reported here: their
#   authors see the failure on the pull request.
# - Marketplace publish, on a release or a manual run. It runs the full CI suite
#   against the tag as the release gate, and then publishes, so a failure means
#   a release was not published. For this run the Branch line shows the release
#   tag, or the ref chosen for a manual run.
on:
  workflow_run:
    # List the workflows you want to watch
    workflows:
      - CI
      - Marketplace publish
    types:
      - completed

# This job only calls Slack, so it needs no access to the repository.
permissions: {}

jobs:
  notify:
    # Only run this job if the triggering workflow FAILED: CI on a push to
    # main, or Marketplace publish on any trigger
    if: |
      github.event.workflow_run.conclusion == 'failure' && (
        github.event.workflow_run.name == 'Marketplace publish' ||
        (github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >
              :x: *CI Failed*
              Workflow: `${{ github.event.workflow_run.name }}`
              Repository: `${{ github.repository }}`
              Branch: `${{ github.event.workflow_run.head_branch }}`
              <${{ github.event.workflow_run.html_url }}|View run details>
