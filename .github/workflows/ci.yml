---
# yamllint disable rule:line-length
name: "CI"
on:
  pull_request:
  # Pushes are not built here: schema-validate.yml runs on every push, and the
  # heavier checks run on pull requests and on the release gate below.
  #
  # The release gate: marketplace-publish.yml calls this workflow with
  # `full: true`, so every check runs against the tagged commit regardless of
  # which files changed. Checks added here gate releases automatically.
  #
  # Release pull requests (`release/v*`) also run everything: they only touch
  # the version and the changelog, so the path filter would otherwise skip the
  # schema load on exactly the pull request whose merge publishes a release.
  workflow_call:
    inputs:
      full:
        description: "Run every check, ignoring the changed-files filter"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs elevate only what they need.
permissions:
  contents: read

env:
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
  VALE_VERSION: "3.13.0"

jobs:
  files-changed:
    name: Detect which file has changed
    # A full run checks everything, so there is nothing to filter — and a
    # `release` event has no base to diff against.
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter reads changed files via the API on pull_request
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
      python: ${{ steps.changes.outputs.python_all }}
      schema: ${{ steps.changes.outputs.schema_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  python-lint:
    if: |
      always() && !cancelled() &&
      (inputs.full || needs.files-changed.outputs.python == 'true' || startsWith(github.head_ref, 'release/v'))
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dependencies"
        # The integration group provides the imports that mypy and pylint resolve in tests/integration.
        run: "uv sync --group dev --group integration"
      - name: "Linting: ruff check"
        run: "uv run ruff check ."
      - name: "Linting: ruff format"
        run: "uv run ruff format --check --diff ."
      - name: "Mypy Tests"
        run: "uv run mypy --show-error-codes ."
      - name: "Pylint Tests"
        run: "uv run pylint --ignore .venv ."
      - name: "Unit Tests"
        run: "uv run pytest tests/unit"

  yaml-lint:
    name: Run yaml lint
    if: |
      always() && !cancelled() &&
      (inputs.full || needs.files-changed.outputs.yaml == 'true' || startsWith(github.head_ref, 'release/v'))
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: Install dependencies
        run: uv sync --group dev
      - name: "Linting: yamllint"
        run: "uv run yamllint -s ."

  markdown-lint:
    name: Run markdown lint
    if: |
      always() && !cancelled() &&
      (inputs.full || needs.files-changed.outputs.markdown == 'true' || startsWith(github.head_ref, 'release/v'))
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dependencies"
        run: "uv sync --group dev"
      # Rules and exclusions live in [tool.rumdl] in pyproject.toml.
      - name: "Linting: rumdl"
        run: "uv run rumdl check ."

  schema-validate:
    name: Validate all schema files
    needs: ["files-changed"]
    if: |
      always() && !cancelled() &&
      (inputs.full || needs.files-changed.outputs.schema == 'true' || startsWith(github.head_ref, 'release/v'))
    uses: ./.github/workflows/schema-validate.yml
    permissions:
      contents: read

  schema-test:
    name: Test all schema files
    needs:
      - files-changed
      - yaml-lint
      - schema-validate
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (inputs.full || needs.files-changed.outputs.schema == 'true' || startsWith(github.head_ref, 'release/v'))
    runs-on:
      group: huge-runners
    timeout-minutes: 60
    strategy:
      matrix:
        # Infrahub version the schemas are loaded into. Keep it equal to the
        # `infrahub-testcontainers` pin in pyproject.toml: the bump workflow
        # (update-infrahub.yml) updates both.
        infrahub-version: ["1.12.1"]
    env:
      INFRAHUB_TESTING_IMAGE_VER: ${{ matrix.infrahub-version }}
      INFRAHUB_TIMEOUT: 600
      INFRAHUB_TESTING_LOG_LEVEL: INFO
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install tini
        run: apt-get update && apt-get install -y tini
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: Install dependencies
        run: uv sync --group dev --group integration
      - name: Set the pytest temporary directory for the runner
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "PYTEST_DEBUG_TEMPROOT=/var/lib/github/${RUNNER_NAME}/_temp" >> $GITHUB_ENV
      - name: Load all schemas into Infrahub
        run: exec tini -s -g -- uv run pytest tests/integration -v

  check-documentation:
    name: Check generated documentation is up to date
    defaults:
      run:
        working-directory: ./docs
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'pull_request'
    needs:
      [
        "files-changed",
        "yaml-lint",
        "python-lint",
        "markdown-lint",
        "schema-test",
      ]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          submodules: true
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 22  # pnpm 11 requires Node >= 22.13
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install Python dependencies"
        run: "uv sync"
        working-directory: ./
      - name: "Install dependencies"
        run: "uv run invoke docs.install"
        working-directory: ./
      - name: "Generate reference documentation"
        run: "uv run invoke docs.generate"
        working-directory: ./
      - name: "Check for outdated documentation"
        run: |
          if ! git diff --exit-code -- docs/docs/reference/; then
            echo "::error::Generated documentation is out of date. Please run 'invoke docs.generate' locally and commit the changes."
            exit 1
          fi
        working-directory: ./

  validate-documentation:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'pull_request'
    needs: ["check-documentation"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          submodules: true
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 22  # pnpm 11 requires Node >= 22.13
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install Python dependencies"
        run: "uv sync"
        working-directory: ./
      - name: "Install dependencies"
        run: "uv run invoke docs.install"
        working-directory: ./
      - name: "Build docs website"
        run: "uv run invoke docs.build"
        working-directory: ./
      # The official GitHub Action for Vale doesn't work, installing manually instead:
      # https://github.com/errata-ai/vale-action/issues/103
      - name: Download Vale
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz
        env:
          VALE_VERSION: ${{ env.VALE_VERSION }}
      - name: "Validate documentation style"
        run: ./vale --config=.vale.ini $(find ./docs -type f \( -name "*.mdx" -o -name "*.md" \) -not -path "./docs/node_modules/*" -not -path "./docs/docs/reference/*")
