---
# yamllint disable rule:line-length
name: "Schema validate"

# Validates every schema in `base/` and `extensions/` offline with
# `infrahubctl validate schema`, without starting Infrahub. It runs on every
# push to every branch, with no path filter. ci.yml also calls it, so the
# schema load waits for it and the release gate includes it.
#
# The command checks one file per call and exits non-zero on an error. It
# prints warnings (read-only fields set in a file) without failing.
on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  schema-validate:
    name: Validate all schema files
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dependencies"
        run: "uv sync"
      # Checks every file before failing, so one run reports every broken schema.
      - name: "Validate schemas"
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! uv run --no-sync infrahubctl validate schema "${file}"; then
              echo "::error file=${file}::Schema validation failed for ${file}"
              status=1
            fi
          done < <(find base extensions -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z)
          exit "${status}"
