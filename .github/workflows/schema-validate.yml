---
# yamllint disable rule:line-length
name: "Schema validate"

# Validates every schema in `base/` and `extensions/` offline, without starting
# Infrahub. It runs on every push to every branch, with no path filter. ci.yml
# also calls it, so the schema load waits for it and the release gate includes it.
on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  schema-validate:
    name: Validate all schema files
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dependencies"
        run: "uv sync"
      - name: "Validate schemas"
        run: "uv run invoke schemas.validate"
