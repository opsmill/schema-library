---
# yamllint disable rule:line-length
name: Marketplace publish

# Publishes a release to the Infrahub Marketplace: `base/`, `extensions/` and
# their `.metadata.yml` entries, never `experimental/`. Every schema whose
# content changed is published at the release version, approved directly
# (no review queue); a schema removed or renamed in Git is deprecated.
#
# Runs when release-publish.yml publishes the GitHub Release for `vX.Y.Z`:
# first the full CI suite against the tag (the gate), then the publish.
#
# Manual runs, e.g. to retry after a Marketplace outage or to dry-run:
#   gh workflow run marketplace-publish.yml --ref v1.5.0 -f preview=false  # publish a tag
#   gh workflow run marketplace-publish.yml --ref main -f version=1.5.0    # plan only, any ref
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      preview:
        description: "Plan only: show what would change, write nothing"
        type: boolean
        default: true
      version:
        description: "Version to plan for (preview only; defaults to pyproject.toml)"
        type: string
        required: false

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

# The called CI workflow declares `pull-requests: read` on its change filter,
# so the caller has to allow it even though a full run skips that job.
permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Gate
    if: github.event_name == 'release' || !inputs.preview
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  publish:
    name: Publish to the Marketplace
    needs: gate
    # The environment holds the admin token and only deploys `v*` tags, so
    # nothing but a release tag can write to the Marketplace.
    environment: marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dependencies"
        run: "uv sync"

      - name: Resolve the release
        id: release
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Publishing needs a release tag, not '${GITHUB_REF_NAME}'. Dispatch with --ref vX.Y.Z."
            exit 1
          fi
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${VERSION}."
            exit 1
          fi
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "Publishing v${VERSION} (previous release: ${PREVIOUS:-none})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"

      # Plans first and writes nothing unless the whole plan is clean; the
      # report lands in the job summary either way. Re-running for the same
      # tag is safe: what already landed reports as unchanged.
      - name: Publish
        env:
          MARKETPLACE_URL: ${{ vars.MARKETPLACE_URL }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          set -euo pipefail
          ARGS=(--version "${VERSION}" --diff)
          if [ -n "${PREVIOUS}" ]; then
            ARGS+=(--previous-tag "${PREVIOUS}")
          fi
          uv run invoke marketplace.publish "${ARGS[@]}"

  preview:
    name: Plan the Marketplace publish
    if: github.event_name == 'workflow_dispatch' && inputs.preview
    # No environment and no token: planning reads public data only, so it can
    # run from any ref and cannot write.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dependencies"
        run: "uv sync"

      - name: Plan
        env:
          MARKETPLACE_URL: ${{ vars.MARKETPLACE_URL }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')}"
          ARGS=(--version "${VERSION}" --preview --diff)
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          fi
          if [ -n "${PREVIOUS}" ]; then
            ARGS+=(--previous-tag "${PREVIOUS}")
          fi
          uv run invoke marketplace.publish "${ARGS[@]}"
