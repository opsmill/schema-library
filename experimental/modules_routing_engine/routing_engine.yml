---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: RoutingEngineType
    namespace: Device
    description: "Routing Engine Type information, detailing specifications such as part number and manufacturer."
    label: "Routing Engine Type"
    inherit_from:
      - DcimGenericModuleType
    relationships:
      - name: routing_engines
        peer: DeviceRoutingEngine
        cardinality: many
        kind: Generic
        description: "Routing engines of this type."

  - name: RoutingEngine
    namespace: Device
    description: "A Routing Engine (RE) installed in a device, responsible for routing functionalities."
    label: "Routing Engine"
    icon: "mdi:cpu-64-bit"
    inherit_from:
      - DcimGenericModule
    # human_friendly_id, order_by, and display_label are inherited from DcimGenericModule
    # (computed_name__value, derived from module_bay + module_type), which is already unique.
    attributes:
      - name: slot
        kind: Number
        description: "The slot number where the Routing Engine is installed within the device"
        order_weight: 1100
      - name: version
        kind: Text
        label: Version
        description: "Firmware version of the Routing Engine."
        optional: true
        order_weight: 1200
    relationships:
      - name: routing_engine_type
        label: RE Type
        peer: DeviceRoutingEngineType
        optional: false
        cardinality: one
        kind: Attribute
        order_weight: 1150
