version: "1.0"

nodes:
  - name: Tenant
    namespace: Tenancy
    description: A tenant is owning the corresponding entity
    icon: mdi:domain
    include_in_menu: true
    inherit_from:
      - OrganizationGeneric
    relationships:
      - name: tags
        peer: BuiltinTag
        cardinality: many
        kind: Attribute
        optional: true
        order_weight: 3000
      - name: location
        peer: LocationBuilding
        cardinality: many
        optional: true
      - name: circuit
        peer: DcimCircuit
        cardinality: many
        optional: true
