      - name: status
        kind: Dropdown
        optional: false
        default_value: "planned"
        choices:
          - name: planned
            label: "Planned"
            description: "Service planned but not provisioned"
            color: "#95a5a6"
          - name: provisioned
            label: "Provisioned"
            description: "Service configured but not active"
            color: "#f5a623"
          - name: active
            label: "Active"
            description: "Service in production"
            color: "#00cc00"
          - name: maintenance
            label: "Maintenance"
            description: "Service under maintenance"
            color: "#ff9800"
          - name: failed
            label: "Failed"
            description: "Service down"
            color: "#cc0000"
        description: "Service operational status"
      - name: customer_circuit_id
        kind: Text
        optional: true
        description: "Customer's circuit ID (e.g., '99/OKFS/000029//SYG')"
      - name: provision_date
        kind: DateTime
        optional: true
        description: "Date service was provisioned"
      - name: description
        kind: Text
        optional: true
        description: "Additional service details"
    relationships:
      - name: transponders
        peer: DcimTransponderModule
        cardinality: many
        min_count: 2
        max_count: 2
        kind: Attribute
        optional: false
        identifier: "transponder_module__optical_services"
        description: "Two transponders (endpoints) for this service (bidirectional)"
      - name: channel
        peer: DcimDWDMChannel
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "dwdm_channel__services"
        description: "DWDM channel used for this service"
      # Kept as two singular relationships rather than one `paths` collection: that is
      # what enforces "exactly one primary, at most one backup" in the schema instead
      # of in a check. kind: Component is reserved for cardinality: many, so these use
      # on_delete: cascade to keep the same ownership semantics.
      - name: primary_path
        peer: DcimOpticalPath
        cardinality: one
        kind: Attribute
        optional: false
        on_delete: cascade
        identifier: "optical_service__primary_path"
        description: "Primary optical path for this service"
      - name: backup_path
        peer: DcimOpticalPath
        cardinality: one
        kind: Attribute
        optional: true
        on_delete: cascade
        identifier: "optical_service__backup_path"
        description: "Backup/protection path for this service"

  # ============================================================================
  # OpticalPath - Network Path Through Multiple Sites
  # ============================================================================
  - name: OpticalPath # DcimOpticalPath
    namespace: Dcim
    include_in_menu: true
    label: "Optical Path"
    description: "Ordered sequence of segments forming an optical path through the network"
    icon: mdi:map-marker-path
    display_label: name__value
    human_friendly_id:
      - name__value
    attributes:
      - name: name
        kind: Text
        optional: false
        unique: true
        description: "Path name (e.g., MS-W17D5-primary)"
      - name: path_type
        kind: Dropdown
        optional: false
        choices:
          - name: primary
            label: "Primary"
            description: "Primary working path"
            color: "#2196f3"
          - name: backup
            label: "Backup"
            description: "Backup/protection path"
            color: "#ff9800"
          - name: express
            label: "Express"
            description: "Express bypass path"
            color: "#9c27b0"
        description: "Type of path (primary, backup, express)"
      # Metres and tenths of a dB as integers, so paths can be ordered by length or
      # by loss.
      #
      # These three are roll-ups of `segments` and cannot be computed attributes,
      # measured on Infrahub 1.10.6:
      #   - a computed attribute must be Text or URL, so a Number one is rejected
      #     outright ("only ['Text', 'URL'] kinds are supported"), for the Jinja2
      #     and the TransformPython kind alike;
      #   - a Jinja2 template cannot see a cardinality-many relationship at all
      #     ("the 'segments' variable is not found within the schema path"), and its
      #     filter sandbox blocks `map`, so summing is out of reach even as Text.
      # A Python transform could do the arithmetic, but only over a Text attribute
      # and only from a git repository, which this library does not ship. Populate
      # these from a generator or an external script instead.
      - name: total_distance_m
        label: "Total Distance (m)"
        kind: Number
        optional: true
        description: "Total path distance in metres (920500 for 920.5 km)"
      - name: total_loss_ddb
        label: "Total Loss (0.1 dB)"
        kind: Number
        optional: true
        description: "Total optical loss in tenths of a dB (184 for 18.4 dB)"
      - name: hop_count
        kind: Number
        optional: true
        description: "Number of ROADM hops in path"
      # TODO: Replace with a status
      - name: is_active
        kind: Boolean
        optional: false
        default_value: true
        description: "Whether this path is currently active"
    relationships:
      - name: segments
        peer: DcimPathSegment
        identifier: optical_path__segments
        cardinality: many
        kind: Component
        optional: true
        description: "Ordered segments forming this path"
      - name: is_primary_of_service
        peer: DcimOpticalService
        identifier: optical_service__primary_path
        cardinality: one
        kind: Attribute
        optional: true
        description: "Optical service using this path"
      - name: is_backup_of_service
        peer: DcimOpticalService
        identifier: optical_service__backup_path
        cardinality: one
        kind: Attribute
        optional: true
        description: "Optical service using this path as backup"

  # ============================================================================
  # PathSegment - One Hop in the Optical Path
  # ============================================================================
  - name: PathSegment # DcimPathSegment
    namespace: Dcim
    include_in_menu: true
    label: "Path Segment"
    description: "One hop in optical path - references channel mapping (fiber, cable, or cross-connect)"
    icon: mdi:ray-start-arrow
    display_label: computed_name__value
    human_friendly_id:
      - computed_name__value
    uniqueness_constraints:
      - [path, segment_order__value]
    attributes:
      - name: computed_name
        kind: Text
        read_only: true
        optional: false
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ path__name__value }}-SEG{{ segment_order__value }}"
        description: "Computed segment name (e.g., MS-W17D5-primary-SEG1)"
      - name: segment_order
        kind: Number
        optional: false
        description: "Order of this segment in the path (1, 2, 3...)"
      - name: segment_type
        kind: Dropdown
        optional: false
        choices:
          - name: fiber
            label: "Fiber"
            description: "Segment traverses a long-haul fiber link"
            color: "#2196f3"
          - name: cross_connect
            label: "Cross-Connect"
            description: "Segment crosses through ROADM degrees (internal WSS)"
            color: "#9c27b0"
          - name: cable
            label: "Cable"
            description: "Segment traverses a local patch cable"
            color: "#ff9800"
          - name: add
            label: "Add"
            description: "Service added at this point (A-end)"
            color: "#4caf50"
          - name: drop
            label: "Drop"
            description: "Service dropped at this point (Z-end)"
            color: "#ff5722"
        description: "Type of segment"
      - name: loss_ddb
        label: "Loss (0.1 dB)"
        kind: Number
        optional: true
        description: "Optical loss for this segment in tenths of a dB (25 for 2.5 dB)"
    relationships:
      - name: path
        peer: DcimOpticalPath
        cardinality: one
        kind: Parent
        optional: false
        identifier: optical_path__segments
        description: "Parent path containing this segment"
      # No cascade. It used to be safe because the mapping's side was a mandatory
      # Parent with cardinality one, i.e. exclusive ownership. Now that a mapping can
      # be referenced by several segments (a backup path over the same fibre), a
      # cascade here would delete a mapping that other segments still point at.
      - name: channel_mapping
        peer: DcimChannelMapping
        cardinality: one
        kind: Attribute
        optional: true
        identifier: "channel_mapping__path_segments"
        description: "Channel mapping (WSS Connect, Cable Mapping, or Fiber Mapping)"

extensions:
  nodes:
    - kind: DcimPhysicalDevice
      relationships:
        - name: optical_node
          peer: DcimOpticalNode
          kind: Generic
          optional: true
          cardinality: many
          identifier: optical_nodes__physical_device
    # Inverse of DcimCableMapping.cable: "which channels cross this patch cable".
    - kind: DcimCable
      relationships:
        - name: channel_mappings
          label: "Channel Mappings"
          peer: DcimCableMapping
          kind: Attribute
          optional: true
          cardinality: many
          identifier: "cable__channel_mappings"
