# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

# Optical Transport Network Schemas for DWDM/WDM systems
#
# Depends on:
#   - base/dcim.yml                  (DcimGenericDevice, DcimPhysicalDevice, DcimEndpoint, DcimConnector)
#   - extensions/modules/modules.yml (DeviceGenericModule, DeviceGenericModuleType)
#   - extensions/cable/cable.yml     (DcimCable)
#
# Four layers:
#   1. Wavelength - ITU-T G.694.1 grid, optical bands, DWDM channels
#   2. Topology   - Logical optical nodes, passive multiplexers, fiber links
#   3. Equipment  - Transponder/amplifier/ROADM modules, degrees, cross-connects
#   4. Service    - End-to-end optical services, paths, segments

generics:
  # ============================================================================
  # ChannelMapping - Generic for any channel allocation/routing
  # ============================================================================
  - name: ChannelMapping  # DcimChannelMapping
    namespace: Dcim
    description: "Generic base for any channel allocation/routing (fiber, cable, or internal cross-connect)"
    label: "Channel Mapping"
    include_in_menu: false
    attributes:
      # TODO: Replace with a proper status
      - name: is_active
        kind: Boolean
        optional: false
        default_value: true
        description: "Whether this mapping is currently active"
      - name: configured_date
        kind: DateTime
        optional: true
        description: "Date this mapping was configured"
    relationships:
      # The path segment link lives on DcimPathSegment.channel_mapping only. It used
      # to be a mandatory Parent here, which meant recording a channel on a fibre or
      # a cable first required inventing an optical path and a path segment.
      - name: channel
        peer: DcimDWDMChannel
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "dwdm_channel__mappings"
        description: "DWDM channel being mapped/routed"
      # Inverse of DcimPathSegment.channel_mapping. Optional and not a Parent, which
      # is the point: a mapping can exist before, or without, any optical path.
      - name: path_segments
        label: "Path Segments"
        peer: DcimPathSegment
        cardinality: many
        kind: Attribute
        optional: true
        identifier: "channel_mapping__path_segments"
        description: "Optical path segments that traverse this mapping"
      # Optional: only a ROADM cross-connect has degrees. A passive fibre or cable
      # mapping has none, and making this mandatory made those unrecordable.
      - name: degrees
        peer: DcimRoadmDegree
        cardinality: many
        max_count: 2
        kind: Attribute
        optional: true
        identifier: "roadm_degree__channel_mappings"
        description: "ROADM degrees involved in this mapping (two, when bidirectional)"

  # ============================================================================
  # OpticalDevice - Generic for any device that can multiplex channels
  # ============================================================================
  - name: OpticalDevice # DcimOpticalDevice
    namespace: Dcim
    description: "Generic interface for any device that can multiplex DWDM channels (active or passive)"
    label: "Optical Multiplexer Device"
    include_in_menu: false
    uniqueness_constraints:
      - [computed_name__value]
    attributes:
      # Every implementation carries a `name`, so the template lives here once
      # rather than being re-declared identically on each child node. A mandatory
      # attribute with no computed_attribute would otherwise have to be written by
      # hand on every object.
      - name: computed_name
        kind: Text
        optional: false
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ name__value }}"
    relationships:
      # Inverse of DcimMuxChannelAssignment.optical_device, so a multiplexer can be
      # asked what is on its ports.
      - name: mux_assignments
        label: "Mux Channel Assignments"
        peer: DcimMuxChannelAssignment
        cardinality: many
        kind: Component
        optional: true
        identifier: "mux_channel_assignments"
        description: "Channel assignments on this device's ports"

# ==============================================================================
# NODES
# ==============================================================================
nodes:
  # ============================================================================
  # Wavelength Layer - ITU-T G.694.1 Grid and Channels
  # ============================================================================

  # ============================================================================
  # ITUGrid - ITU-T G.694.1 DWDM Grid Standards
  # ============================================================================
  - name: ITUGrid # DcimITUGrid
    namespace: Dcim
    include_in_menu: true
    label: "ITU-T DWDM Grid"
    description: "ITU-T G.694.1 frequency grid standards for DWDM"
    icon: mdi:grid
    display_label: name__value
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        optional: false
        description: "Grid name (e.g., 50GHz, 100GHz)"
      - name: channel_spacing_ghz
        kind: Number
        optional: false
        description: "Channel spacing in GHz (50, 100, etc.)"
      # GHz, as an integer: the Number kind is integer only, and GHz is exact on
      # every ITU grid. Text was not filterable or sortable.
      - name: reference_frequency_ghz
        label: "Reference Frequency (GHz)"
        kind: Number
        optional: false
        description: "Reference frequency in GHz (193100 for the C-band anchor at 193.1 THz)"
      - name: description
        kind: Text
        optional: true
        description: "Grid description and use cases"
    relationships:
      - name: bands
        peer: DcimOpticalBand
        cardinality: many
        kind: Component
        optional: true
        identifier: itu_grid__bands
        description: "Optical bands using this grid"

  # ============================================================================
  # OpticalBand - C-Band, L-Band, etc.
  # ============================================================================
  - name: OpticalBand # DcimOpticalBand
    namespace: Dcim
    include_in_menu: true
    label: "Optical Band"
    description: "Optical frequency band (C-Band, L-Band, S-Band)"
    icon: mdi:sine-wave
    display_label: computed_name__value
    human_friendly_id: [grid__name__value, band_name__value]
    uniqueness_constraints:
      - [grid, band_name__value]
    attributes:
      - name: band_name
        kind: Dropdown
        optional: false
        choices:
          - name: c_band
            label: "C-Band"
            description: "Conventional Band (1530-1565 nm)"
            color: "#ff6b6b"
          - name: l_band
            label: "L-Band"
            description: "Long Band (1565-1625 nm)"
            color: "#4ecdc4"
          - name: s_band
            label: "S-Band"
            description: "Short Band (1460-1530 nm)"
            color: "#95e1d3"
          - name: o_band
            label: "O-Band"
            description: "Original Band (1260-1360 nm)"
            color: "#f38181"
        description: "Optical band designation"
      # Integer GHz and picometres, so band edges can be compared numerically
      # against a channel's own frequency_ghz / wavelength_pm.
      - name: start_frequency_ghz
        label: "Start Frequency (GHz)"
        kind: Number
        optional: false
        description: "Band start frequency in GHz (191000 for 191.0 THz)"
      - name: end_frequency_ghz
        label: "End Frequency (GHz)"
        kind: Number
        optional: false
        description: "Band end frequency in GHz (196100 for 196.1 THz)"
      - name: start_wavelength_pm
        label: "Start Wavelength (pm)"
        kind: Number
        optional: true
        description: "Band start wavelength in picometres, nm x 1000 (1530000 for 1530.0 nm)"
      - name: end_wavelength_pm
        label: "End Wavelength (pm)"
        kind: Number
        optional: true
        description: "Band end wavelength in picometres, nm x 1000 (1565000 for 1565.0 nm)"
      - name: computed_name
        kind: Text
        read_only: true
        optional: false
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ grid__name__value }}-{{ band_name__value|upper }}"
        description: "Auto-generated band identifier (e.g., 50GHz-C_BAND)"
    relationships:
      - name: grid
        peer: DcimITUGrid
        cardinality: one
        kind: Parent
        optional: false
        identifier: itu_grid__bands
        description: "Parent ITU grid"
      - name: channels
        peer: DcimDWDMChannel
        cardinality: many
        kind: Component
        optional: true
        identifier: optical_band__channels
        description: "DWDM channels in this band"

  # ============================================================================
  # DWDMChannel - Individual Wavelength/Channel
  # ============================================================================
  - name: DWDMChannel # DcimDWDMChannel
    namespace: Dcim
    include_in_menu: true
    label: "DWDM Channel"
    description: "Individual DWDM wavelength/channel (CH20, CH21, etc.)"
    icon: mdi:wave
    display_label: channel_name__value
    human_friendly_id:
      - channel_name__value
    order_by:
      - band__computed_name__value
      - channel_number__value
    uniqueness_constraints:
      - [band, channel_number__value]
      - [channel_name__value]
    attributes:
      - name: channel_name
        kind: Text
        read_only: true
        optional: false
        computed_attribute:
          kind: Jinja2
          jinja2_template: "CH{{ channel_number__value }}"
        description: "ITU DWDM Channel identifier (computed as CH + channel number, e.g., CH20, CH21, CH40)"
      - name: adva_channel_name
        kind: Text
        optional: true
        description: "ADVA-specific channel name (e.g., D02, DC1, D32)"
      - name: channel_number
        kind: Number
        optional: false
        description: "ITU channel number (e.g., 20, 21, 60)"
      # One fact in two notations, both integers so both stay filterable and
      # sortable. GHz is exact on every ITU grid; picometres keep 1560.61 nm exact
      # (the Number kind is integer only).
      - name: frequency_ghz
        label: "Frequency (GHz)"
        kind: Number
        optional: false
        description: "Centre frequency in GHz (192100 for 192.1 THz)"
      - name: wavelength_pm
        label: "Wavelength (pm)"
        kind: Number
        optional: false
        description: "Centre wavelength in picometres, nm x 1000 (1560610 for 1560.61 nm)"
      - name: description
        kind: Text
        optional: true
        description: "Channel notes and usage"
    relationships:
      - name: band
        peer: DcimOpticalBand
        cardinality: one
        kind: Parent
        optional: false
        identifier: optical_band__channels
        description: "Parent optical band"
      # Attribute, not Component: the assignment belongs to the multiplexer (its
      # Parent is optical_device), not to the channel. As a Component here, deleting
      # a channel would cascade-delete port assignments on devices, and the node
      # would have two owners.
      - name: mux_assignments
        peer: DcimMuxChannelAssignment
        cardinality: many
        kind: Attribute
        optional: true
        identifier: dwdm_channel__mux_assignments
        description: "Mux port assignments for this channel"
      - name: mappings
        peer: DcimChannelMapping
        cardinality: many
        kind: Generic
        optional: true
        identifier: dwdm_channel__mappings
        description: "Fiber allocations for this channel"
      # Inverses, so "what is using this channel" is a query rather than a scan of
      # every service and transponder.
      - name: services
        label: "Optical Services"
        peer: DcimOpticalService
        cardinality: many
        kind: Attribute
        optional: true
        identifier: dwdm_channel__services
        description: "Optical services carried on this channel"
      - name: transponder_modules
        label: "Transponder Modules"
        peer: DcimTransponderModule
        cardinality: many
        kind: Attribute
        optional: true
        identifier: dwdm_channel__transponder_modules
        description: "Transponder modules tuned to this channel"

  # ============================================================================
  # MuxChannelAssignment - Channel to Mux Port Mapping
  # ============================================================================
  - name: MuxChannelAssignment # DcimMuxChannelAssignment
    namespace: Dcim
    include_in_menu: true
    label: "Mux Channel Assignment"
    description: "Maps DWDM channel to multiplexer port (equipment configuration)"
    icon: mdi:cable-data
    display_label: computed_name__value
    human_friendly_id:
      - optical_device__computed_name__value
      - port_number__value
    uniqueness_constraints:
      - [optical_device, port_number__value]
      - [optical_device, channel]
    attributes:
      - name: port_number
        kind: Number
        optional: false
        description: "Physical port number on multiplexer (e.g., 1-96)"
      # Tenths of a dBm as an integer (the Number kind is integer only), so power
      # can be compared and sorted. -3.5 dBm is stored as -35.
      - name: tx_power_ddbm
        label: "TX Power (0.1 dBm)"
        kind: Number
        optional: true
        description: "Configured transmit power in tenths of a dBm (-35 for -3.5 dBm)"
      - name: status
        kind: Dropdown
        optional: false
        default_value: "configured"
        choices:
          - name: configured
            label: "Configured"
            description: "Channel is configured on port"
            color: "#f5a623"
          - name: active
            label: "Active"
            description: "Channel is actively transmitting"
            color: "#00cc00"
          - name: disabled
            label: "Disabled"
            description: "Channel is disabled"
            color: "#cccccc"
          - name: failed
            label: "Failed"
            description: "Channel has failed"
            color: "#cc0000"
        description: "Channel assignment status"
      - name: computed_name
        kind: Text
        read_only: true
        optional: false
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {{ optical_device__computed_name__value
            }}-P{{ '{:02d}'.format(port_number__value)
            }}-{{ channel__channel_name__value }}
        description: "Auto-generated assignment identifier"
    relationships:
      - name: channel
        peer: DcimDWDMChannel
        cardinality: one
        kind: Attribute
        optional: false
        identifier: dwdm_channel__mux_assignments
        description: "DWDM channel assigned to this port"
      - name: optical_device
        peer: DcimOpticalDevice
        cardinality: one
        kind: Parent
        optional: false
        identifier: "mux_channel_assignments"
        description: "Multiplexer device (OpticalNode or PassiveMultiplexer)"

  # ============================================================================
  # FiberMapping - Channel Allocation on Long-Haul Fiber
  # ============================================================================
  - name: FiberMapping # DcimFiberMapping
    namespace: Dcim
    inherit_from:
      - DcimChannelMapping
    include_in_menu: true
    label: "Fiber Mapping"
    description: "Long-haul fiber link between degrees on DIFFERENT ROADMs/sites (kilometers distance)"
    icon: mdi:fiber-optic
    display_label: computed_name__value
    human_friendly_id:
      - fiber_link__link_id__value
      - channel__channel_name__value
    uniqueness_constraints:
      - [fiber_link, channel]
    attributes:
      - name: allocation_status
        kind: Dropdown
        optional: false
        default_value: "reserved"
        choices:
          - name: reserved
            label: "Reserved"
            description: "Channel reserved but not in use"
            color: "#f5a623"
          - name: allocated
            label: "Allocated"
            description: "Channel allocated to service"
            color: "#0099cc"
          - name: in_use
            label: "In Use"
            description: "Channel actively carrying traffic"
            color: "#00cc00"
          - name: maintenance
            label: "Maintenance"
            description: "Channel under maintenance"
            color: "#ff9800"
          - name: failed
            label: "Failed"
            description: "Channel has failed"
            color: "#cc0000"
        description: "Allocation status"
      # Tenths of a dB / dBm as integers, so measurements can be compared, sorted
      # and thresholded (the Number kind is integer only).
      - name: tx_power_ddbm
        label: "TX Power (0.1 dBm)"
        kind: Number
        optional: true
        description: "Measured transmit power in tenths of a dBm (5 for 0.5 dBm)"
      - name: rx_power_ddbm
        label: "RX Power (0.1 dBm)"
        kind: Number
        optional: true
        description: "Measured receive power in tenths of a dBm (-23 for -2.3 dBm)"
      - name: osnr_ddb
        label: "OSNR (0.1 dB)"
        kind: Number
        optional: true
        description: "Optical Signal-to-Noise Ratio in tenths of a dB (255 for 25.5 dB)"
      - name: allocated_date
        kind: DateTime
        optional: true
        description: "Date channel was allocated"
      - name: computed_name
        kind: Text
        read_only: true
        optional: false
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ fiber_link__link_id__value }}-{{ channel__channel_name__value }}"
        description: "Auto-generated mapping identifier"
      - name: description
        kind: Text
        optional: true
        description: "Additional fiber mapping details"
    relationships:
      # Parent, to pair with DcimFiberLink.mappings which is a Component: a mapping
      # only exists as part of its link, and deleting the link should take it along.
      - name: fiber_link
        peer: DcimFiberLink
        cardinality: one
        kind: Parent
        optional: false
        identifier: "fiber_channel_mappings"
        description: "Long-haul fiber link connecting the degrees"

  # ============================================================================
  # Topology Layer - Optical Nodes and Fiber Links
  # ============================================================================

  # ============================================================================
  # OpticalNode - Logical Network Topology Element
  # ============================================================================
  - name: OpticalNode # DcimOpticalNode
    namespace: Dcim
    include_in_menu: true
    label: "Optical Node"
    description: "Logical network endpoint in optical topology (graph node, not physical device)"
    icon: mdi:lan
    inherit_from:
      - DcimOpticalDevice
    display_label: computed_name__value
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      # computed_name is inherited from DcimOpticalDevice, which already templates
      # it from name__value.
      - name: name
        kind: Text
        optional: false
        description: "Logical node name (e.g., GENESIS-OL-10, SKYLINE-OL-1)"
      - name: node_type
        kind: Dropdown
        optional: false
        choices:
          - name: endpoint
            label: "Endpoint"
            description: "Edge node (traffic originates/terminates)"
            color: "#2196f3"
          - name: intermediate
            label: "Intermediate"
            description: "Pass-through node (ROADM only)"
            color: "#9c27b0"
          - name: branching
            label: "Branching"
            description: "Multiple fiber paths meet (hub)"
            color: "#ff9800"
        description: "Topology role of this node"
      - name: description
        kind: Text
        optional: true
        description: "Node notes and function"
    relationships:
      - name: device
        peer: DcimPhysicalDevice
        cardinality: one
        kind: Attribute
        optional: true
        identifier: optical_nodes__physical_device
        description: "Physical chassis that implements this logical node"
      - name: transponder_modules
        peer: DcimTransponderModule
        cardinality: many
        kind: Attribute
        optional: true
        identifier: optical_node__transponder_modules
        description: "Transponder modules connected to this optical node (for cross-connects)"
      # Inverses of DcimFiberLink.a_end / .z_end. Not Components: a link is shared
      # by the two nodes it joins, so neither node owns it.
      - name: links_a
        label: "Fiber Links (A-End)"
        peer: DcimFiberLink
        cardinality: many
        kind: Attribute
        optional: true
        identifier: fiberlink__a_end
        description: "Fiber links that start at this node"
      - name: links_z
        label: "Fiber Links (Z-End)"
        peer: DcimFiberLink
        cardinality: many
        kind: Attribute
        optional: true
        identifier: fiberlink__z_end
        description: "Fiber links that end at this node"

  # ============================================================================
  # PassiveMultiplexer - Standalone Passive Mux/Demux
  # ============================================================================
  - name: PassiveMultiplexer # DcimPassiveMultiplexer
    namespace: Dcim
    include_in_menu: true
    label: "Passive Multiplexer"
    description: "Passive CWDM/DWDM multiplexer (fixed port count, no modules)"
    icon: mdi:resistor-nodes
    # DcimOpticalDevice is what DcimMuxChannelAssignment.optical_device peers, so
    # without it a passive mux could not hold the port-to-channel assignments that
    # are its entire purpose.
    inherit_from:
      - DcimPhysicalDevice
      - DcimOpticalDevice
    display_label: computed_name__value
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      # computed_name is inherited from DcimOpticalDevice.
      - name: name
        kind: Text
        optional: false
        description: "Passive mux name (e.g., CHI-PMUX-01)"
      - name: port_count
        kind: Number
        optional: false
        description: "Number of fixed ports (e.g., 8, 16, 32, 40)"
      - name: mux_type
        kind: Dropdown
        optional: false
        choices:
          - name: cwdm
            label: "CWDM"
            description: "Coarse Wavelength Division Multiplexing"
            color: "#4a90e2"
          - name: dwdm
            label: "DWDM"
            description: "Dense Wavelength Division Multiplexing"
            color: "#9933cc"
        description: "Type of passive multiplexer"
      - name: description
        kind: Text
        optional: true
        description: "Device notes"

  # ============================================================================
  # FiberLink - Network Graph Edge
  # ============================================================================
  - name: FiberLink # DcimFiberLink
    namespace: Dcim
    include_in_menu: true
    label: "Fiber Link"
    description: "Fiber connecting two optical nodes (graph edge)"
    icon: mdi:cable-data
    display_label: link_id__value
    human_friendly_id:
      - link_id__value
    uniqueness_constraints:
      - [link_id__value]
    attributes:
      - name: link_id
        kind: Text
        optional: false
        description: "Unique link identifier (e.g., LINK-001)"
      # Metres and tenths of a dB as integers. The Number kind is integer only, so
      # the unit is scaled rather than the type widened, which keeps both values
      # filterable ("links longer than 40 km") and sortable.
      - name: distance_m
        label: "Distance (m)"
        kind: Number
        optional: true
        description: "Physical distance in metres (920500 for 920.5 km)"
      - name: attenuation_ddb
        label: "Attenuation (0.1 dB)"
        kind: Number
        optional: true
        description: "Total fiber attenuation in tenths of a dB (184 for 18.4 dB)"
      - name: status
        kind: Dropdown
        optional: false
        default_value: "planned"
        choices:
          - name: planned
            label: "Planned"
            description: "Link is planned but not yet installed"
            color: "#95a5a6"
          - name: active
            label: "Active"
            description: "Link is in service"
            color: "#00cc00"
          - name: standby
            label: "Standby"
            description: "Link is installed but not active"
            color: "#f5a623"
          - name: maintenance
            label: "Maintenance"
            description: "Link is under maintenance"
            color: "#ff9800"
          - name: failed
            label: "Failed"
            description: "Link has failed"
            color: "#cc0000"
        description: "Operational status of fiber link"
      - name: commissioned_date
        kind: DateTime
        optional: true
        description: "Date link was commissioned"
      - name: description
        kind: Text
        optional: true
        description: "Additional link details"
    relationships:
      # A span has exactly two ends, so they are two relationships of cardinality
      # one rather than an open collection capped at two. That also makes each end
      # addressable: "links leaving this node" and "links arriving" are separate
      # queries, and a direction is no longer implied by list order.
      - name: a_end
        peer: DcimOpticalNode
        identifier: fiberlink__a_end
        cardinality: one
        kind: Attribute
        optional: false
        description: "Optical node at the A end of this link"
      - name: z_end
        peer: DcimOpticalNode
        identifier: fiberlink__z_end
        cardinality: one
        kind: Attribute
        optional: false
        description: "Optical node at the Z end of this link"
      - name: mappings
        peer: DcimFiberMapping
        cardinality: many
        kind: Component
        identifier: "fiber_channel_mappings"
        optional: true
        description: "DWDM channels allocated on this link"
      # Inverses, so an impact walk can start from the link.
      - name: amplifier_modules
        label: "Amplifier Modules"
        peer: DcimOpticalAmplifierModule
        cardinality: many
        kind: Attribute
        optional: true
        identifier: "fiber_link__amplifier_modules"
        description: "Inline amplifiers on this link"
      - name: roadm_degrees
        label: "ROADM Degrees"
        peer: DcimRoadmDegree
        cardinality: many
        kind: Attribute
        optional: true
        identifier: "fiber_link__roadm_degree"
        description: "ROADM degrees whose line port faces this link"

  # ============================================================================
  # Equipment Layer - Modules and ROADM Degrees
  # ============================================================================

  # ============================================================================
  # OpticalModuleType - Specific optical module categorization
  # ============================================================================
  - name: OpticalModuleType # DcimOpticalModuleType
    namespace: Dcim
    include_in_menu: true
    label: "Optical Module Type"
    description: "Categorization of optical modules by function"
    icon: mdi:expansion-card
    inherit_from:
      - DeviceGenericModuleType
    attributes:
      - name: name
        kind: Text
        optional: false
        description: "Module type name"
      - name: description
        kind: Text
        optional: true
        description: "Module type description"
      - name: module_category
        kind: Dropdown
        optional: false
        description: "Functional category of the module"
        choices:
          - name: transponder
            label: "Transponder"
            description: "Optical-electrical-optical conversion"
            color: "#2196f3"
          - name: multiplexer
            label: "Multiplexer/ROADM"
            description: "Wavelength multiplexing and switching"
            color: "#9c27b0"
