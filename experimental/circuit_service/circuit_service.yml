# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
---
version: "1.0"
nodes:
  - name: Service
    namespace: Circuit
    description: "Represent the boundary of a provider network, the details of which are unknown or unimportant"
    label: "Circuit Service"
    icon: "mdi:cloud"
    menu_placement: "DcimCircuit"
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
      - name: service_id
        kind: Text
        optional: true
      - name: description
        kind: Text
        optional: true
    relationships:
      - name: provider
        peer: OrganizationProvider
        optional: false
        cardinality: one
        kind: Attribute
      - name: circuit_endpoints
        peer: CircuitEndpoint
        optional: true
        cardinality: many
        kind: Component

extensions:
  nodes:
    - kind: OrganizationProvider
      relationships:
        - name: circuit_services
          peer: CircuitService
          cardinality: many
          optional: true
    - kind: CircuitEndpoint
      relationships:
        - name: circuit_service
          peer: CircuitService
          cardinality: one
          optional: true
