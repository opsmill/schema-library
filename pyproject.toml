[project]
name = "schema-library"
version = "0.1.0"
description = ""
authors = [{name = "OpsMill", email = "info@opsmill.com"}]
requires-python = ">=3.10,<3.13"
dependencies = [
    "infrahub-sdk[all]>=1.23.1",
    "invoke>=2.2.1",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "yamllint>=1.37.1",
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "vale>=3.13.0.0",
    "types-pyyaml>=6.0.12.20250915",
    "towncrier>=24.8,<27",
    # Covers the docs-generation helpers in tasks/, whose escaping rules are
    # subtle enough to regress without being noticed until a docs build fails.
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tasks` is a top-level package in the repo root rather than an installed
# distribution, so the root has to be on the import path for the tests.
pythonpath = ["."]

[tool.pylint.messages_control]
# Line length is enforced by Black, so pylint doesn't need to check it.
# Pylint and Black disagree about how to format multi-line arrays; Black wins.
# Rules already covered by RUFF
# - too-many-statements
# - unused-argument
disable = """,
    line-too-long,
    missing-module-docstring,
    missing-function-docstring,
    missing-class-docstring,
    consider-using-from-import,
    invalid-name,
    too-many-arguments,
    too-many-locals,
    keyword-arg-before-vararg,
    too-few-public-methods,
    too-many-instance-attributes,
    too-many-statements,
    fixme,
    consider-using-f-string,
    protected-access,
    import-self,
    wrong-import-order,
    multiple-statements,
    unused-argument,
    """

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.towncrier]
# `schema-library` is a repository of schema files, not an importable package
# exposing `__version__`, and `[project] version` is unrelated to the published
# tags. `package` is therefore intentionally omitted; pass `--version X.Y.Z` to
# `towncrier build` at release time.
directory = "changelog"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
# Releases are tagged `vX.Y.Z` here, so the tree link carries the `v` while
# `--version` is passed without it.
title_format = "## [Schema Library - v{version}](https://github.com/opsmill/schema-library/tree/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/opsmill/schema-library/issues/{issue})"
orphan_prefix = "+"
template = "changelog/towncrier.md.template"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "housekeeping"
name = "Housekeeping"
showcontent = true
