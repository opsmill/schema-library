  - name: Interface
    namespace: Netbox
    description: >-
      A network interface that exchanges data with connected devices, most commonly Ethernet. Holds IP addresses and
      VLANs.
    icon: mdi:ethernet
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxComponent
      - NetboxModularComponent
      - NetboxCabledObject
      - NetboxIPAddressAssignable
      - NetboxL2VPNAssignable
    human_friendly_id:
      - device__name__value
      - name__value
    display_label: '{{ name__value }}'
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: type
        kind: Text
        optional: false
        description: NetBox interface type slug, for example 1000base-t, 10gbase-x-sfpp, lag or virtual.
        order_weight: 1040
      - name: enabled
        kind: Boolean
        default_value: true
        optional: true
        order_weight: 1080
      - name: mgmt_only
        kind: Boolean
        label: Management Only
        default_value: false
        optional: true
        description: Used only for out-of-band management.
        order_weight: 1120
      - name: mtu
        kind: Number
        label: MTU
        parameters:
          min_value: 1
          max_value: 65536
        optional: true
        order_weight: 1160
      - name: speed
        kind: Number
        label: Speed (Kbps)
        optional: true
        order_weight: 1200
      - name: duplex
        kind: Dropdown
        choices:
          - name: half
            label: Half
          - name: full
            label: Full
          - name: auto
            label: Auto
        optional: true
        order_weight: 1240
      - name: mode
        kind: Dropdown
        label: 802.1Q Mode
        choices:
          - name: access
            label: Access
            description: Untagged traffic for a single VLAN
          - name: tagged
            label: Tagged
            description: One untagged VLAN plus one or more tagged VLANs
          - name: tagged-all
            label: Tagged (All)
            description: Untagged VLAN plus all tagged VLANs
          - name: q-in-q
            label: Q-in-Q (802.1ad)
            description: 802.1ad service VLAN encapsulating customer VLANs
        optional: true
        order_weight: 1280
      - name: wwn
        kind: Text
        label: WWN
        parameters:
          regex: ^([0-9A-Fa-f]{2}[:-]){7}[0-9A-Fa-f]{2}$
        optional: true
        description: 64-bit World Wide Name, for Fibre Channel interfaces.
        order_weight: 1320
      - name: poe_mode
        kind: Dropdown
        label: PoE Mode
        choices:
          - name: pd
            label: PD
            description: Powered device that receives power over Ethernet
          - name: pse
            label: PSE
            description: Power sourcing equipment that supplies power over Ethernet
        optional: true
        order_weight: 1360
      - name: poe_type
        kind: Dropdown
        label: PoE Type
        choices:
          - name: type1-ieee802.3af
            label: 802.3af (Type 1)
            description: IEEE Standard
          - name: type2-ieee802.3at
            label: 802.3at (Type 2)
            description: IEEE Standard
          - name: type3-ieee802.3bt
            label: 802.3bt (Type 3)
            description: IEEE Standard
          - name: type4-ieee802.3bt
            label: 802.3bt (Type 4)
            description: IEEE Standard
          - name: passive-24v-2pair
            label: Passive 24V (2-pair)
            description: Passive
          - name: passive-24v-4pair
            label: Passive 24V (4-pair)
            description: Passive
          - name: passive-48v-2pair
            label: Passive 48V (2-pair)
            description: Passive
          - name: passive-48v-4pair
            label: Passive 48V (4-pair)
            description: Passive
        optional: true
        order_weight: 1400
      - name: channels
        kind: Number
        optional: true
        description: For a channelized (breakout) interface, the number of channels it is divided into.
        order_weight: 1440
      - name: channel_id
        kind: Number
        label: Channel ID
        optional: true
        description: Channel of the parent interface that this channel subinterface is bound to.
        order_weight: 1480
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__interface
        order_weight: 800
      - name: parent
        peer: NetboxInterface
        label: Parent Interface
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_interface__parent
        direction: outbound
        order_weight: 1520
      - name: child_interfaces
        peer: NetboxInterface
        label: Child Interfaces
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_interface__parent
        direction: inbound
        order_weight: 3100
      - name: lag
        peer: NetboxInterface
        label: LAG
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_interface__lag
        direction: outbound
        description: Link aggregation group interface that this interface is a member of.
        order_weight: 1560
      - name: lag_members
        peer: NetboxInterface
        label: LAG Members
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_interface__lag
        direction: inbound
        order_weight: 3200
      - name: bridge
        peer: NetboxInterface
        label: Bridge Interface
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_interface__bridge
        direction: outbound
        order_weight: 1600
      - name: bridged_interfaces
        peer: NetboxInterface
        label: Bridged Interfaces
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_interface__bridge
        direction: inbound
        order_weight: 3300
      - name: virtual_device_contexts
        peer: NetboxVirtualDeviceContext
        label: Virtual Device Contexts
        kind: Attribute
        cardinality: many
        optional: true
        identifier: netbox_interface__virtual_device_context
        order_weight: 1640
      - name: primary_mac_address
        peer: NetboxMACAddress
