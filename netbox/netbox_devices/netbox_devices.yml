        optional: true
        description: 'Color as a hex code, for example #aa1409.'
        order_weight: 1140
      - name: positions
        kind: Number
        default_value: 1
        optional: false
        description: Number of rear port positions this front port maps to.
        order_weight: 1240
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__front_port
        order_weight: 800
      - name: rear_port_mappings
        peer: NetboxPortMapping
        label: Rear Port Mappings
        kind: Component
        cardinality: many
        optional: true
        identifier: netbox_port_mapping__front_port
        order_weight: 3100

  - name: RearPort
    namespace: Netbox
    description: >-
      A pass-through port that continues a cable path. A rear port with several positions maps to several front ports.
    label: Rear Port
    icon: mdi:arrow-left-bold-box-outline
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxComponent
      - NetboxModularComponent
      - NetboxCabledObject
    human_friendly_id:
      - device__name__value
      - name__value
    display_label: '{{ name__value }}'
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: type
        kind: Text
        optional: false
        description: NetBox port type slug, for example 8p8c or mpo.
        order_weight: 1040
      - name: color
        kind: Color
        optional: true
        description: 'Color as a hex code, for example #aa1409.'
        order_weight: 1140
      - name: positions
        kind: Number
        default_value: 1
        optional: false
        order_weight: 1240
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__rear_port
        order_weight: 800
      - name: front_port_mappings
        peer: NetboxPortMapping
        label: Front Port Mappings
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_port_mapping__rear_port
        order_weight: 3100

  - name: PortMapping
    namespace: Netbox
    description: Maps a position of a front port to a position of a rear port on the same device.
    label: Port Mapping
    icon: mdi:swap-horizontal
    include_in_menu: true
    menu_placement: NetboxDevice
    display_label: >-
      {{ front_port__name__value }}:{{ front_port_position__value }} > {{ rear_port__name__value }}:{{
      rear_port_position__value }}
    uniqueness_constraints:
      - [front_port, front_port_position__value]
      - [rear_port, rear_port_position__value]
    attributes:
      - name: front_port_position
        kind: Number
        label: Front Port Position
        default_value: 1
        optional: false
        order_weight: 1000
      - name: rear_port_position
        kind: Number
        label: Rear Port Position
        default_value: 1
        optional: false
        order_weight: 1100
    relationships:
      - name: front_port
        peer: NetboxFrontPort
        label: Front Port
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_port_mapping__front_port
        order_weight: 800
      - name: rear_port
        peer: NetboxRearPort
        label: Rear Port
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_port_mapping__rear_port
        order_weight: 810

  - name: CoolingIntake
    namespace: Netbox
    description: >-
      A device component which consumes coolant, such as a server cold-plate inlet or a coolant distribution unit (CDU)
      intake.
    label: Cooling Intake
    icon: mdi:coolant-temperature
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxComponent
      - NetboxModularComponent
    human_friendly_id:
      - device__name__value
      - name__value
    display_label: '{{ name__value }}'
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: type
        kind: Dropdown
        label: Connector Type
        choices:
          - name: uqd
            label: UQD (Universal Quick Disconnect)
          - name: uqdb
            label: UQDB (Universal Quick Disconnect, Blind-mate)
          - name: qdc
            label: QDC (Quick Disconnect Coupling)
          - name: camlock
            label: Camlock (cam-and-groove)
          - name: npt
            label: NPT (threaded)
          - name: bsp
            label: BSP (threaded)
          - name: proprietary
            label: Proprietary
        optional: true
        order_weight: 1040
      - name: diameter_millimeters
        kind: Number
        label: Diameter (mm)
        optional: true
        description: NetBox stores a decimal diameter in mm, cm or inches. Converted to millimeters here.
        order_weight: 1140
      - name: max_flow_liters_per_minute
        kind: Number
        label: Maximum Flow (L/min)
        optional: true
        description: NetBox stores a decimal flow rate in L/min, m3/h or gal/min. Converted to liters per minute here.
        order_weight: 1240
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__cooling_intake
        order_weight: 800
      - name: cooling_outflow
        peer: NetboxCoolingOutflow
        label: Upstream Cooling Outflow
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_cooling_intake__cooling_outflow
        description: Cooling outflow that supplies this intake.
        order_weight: 1340
      - name: downstream_outflows
        peer: NetboxCoolingOutflow
        label: Downstream Cooling Outflows
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_cooling_outflow__cooling_intake
        order_weight: 3100

  - name: CoolingOutflow
    namespace: Netbox
    description: A device component that delivers coolant to a downstream cooling intake, for example a manifold outlet.
    label: Cooling Outflow
    icon: mdi:water-pump
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxComponent
      - NetboxModularComponent
    human_friendly_id:
      - device__name__value
      - name__value
    display_label: '{{ name__value }}'
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: type
        kind: Dropdown
        label: Connector Type
        choices:
          - name: uqd
            label: UQD (Universal Quick Disconnect)
          - name: uqdb
            label: UQDB (Universal Quick Disconnect, Blind-mate)
          - name: qdc
            label: QDC (Quick Disconnect Coupling)
          - name: camlock
            label: Camlock (cam-and-groove)
          - name: npt
            label: NPT (threaded)
          - name: bsp
            label: BSP (threaded)
          - name: proprietary
            label: Proprietary
        optional: true
        order_weight: 1040
      - name: diameter_millimeters
        kind: Number
        label: Diameter (mm)
        optional: true
        description: NetBox stores a decimal diameter in mm, cm or inches. Converted to millimeters here.
        order_weight: 1140
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__cooling_outflow
        order_weight: 800
      - name: cooling_intake
        peer: NetboxCoolingIntake
        label: Upstream Cooling Intake
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_cooling_outflow__cooling_intake
        description: Cooling intake on the same device that feeds this outflow.
        order_weight: 1240
      - name: downstream_intakes
        peer: NetboxCoolingIntake
        label: Downstream Cooling Intakes
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_cooling_intake__cooling_outflow
        order_weight: 3100

  - name: DeviceBay
    namespace: Netbox
    description: >-
      A slot within a parent device in which a child device can be installed, for example a blade server in a chassis.
    label: Device Bay
    icon: mdi:tray
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxComponent
    human_friendly_id:
      - device__name__value
      - name__value
    display_label: '{{ name__value }}'
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: enabled
        kind: Boolean
        default_value: true
        optional: true
        order_weight: 1040
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__device_bay
        order_weight: 800
      - name: installed_device
        peer: NetboxDevice
        label: Installed Device
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_device_bay__installed_device
        order_weight: 1140

  - name: ModuleBay
    namespace: Netbox
    description: A slot within a device, or within a module, in which a field-replaceable module can be installed.
    label: Module Bay
    icon: mdi:tray-plus
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxComponent
    display_label: '{{ name__value }}'
    attributes:
      - name: position
        kind: Text
        optional: true
        description: Free-form bay position, for example 1, F1 or PSU-1.
        order_weight: 1140
      - name: enabled
        kind: Boolean
        default_value: true
        optional: true
        order_weight: 1240
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__module_bay
        order_weight: 800
      - name: module
        peer: NetboxModule
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_module__module_bay
        description: Module that provides this bay. Empty when the bay belongs to the device itself.
        order_weight: 1040
      - name: module_bay_types
        peer: NetboxModuleBayType
        label: Module Bay Types
        kind: Attribute
        cardinality: many
        optional: true
        identifier: netbox_module_bay__module_bay_type
        order_weight: 1340
      - name: installed_module
        peer: NetboxModule
        label: Installed Module
        kind: Generic
        cardinality: one
        optional: true
        identifier: netbox_module_bay__installed_module
        order_weight: 3100

  - name: InventoryItem
    namespace: Netbox
    description: >-
      A hardware component of a device tracked for inventory, such as a CPU. Deprecated in NetBox 4.3 in favor of
      modules.
    label: Inventory Item
    icon: mdi:clipboard-list-outline
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxComponent
      - NetboxInventoryItemHierarchy
    parent: NetboxInventoryItemHierarchy
    children: NetboxInventoryItemHierarchy
    display_label: '{{ name__value }}'
    attributes:
      - name: part_id
        kind: Text
        label: Part ID
        optional: true
        order_weight: 2100
      - name: serial
        kind: Text
        label: Serial Number
        optional: true
        order_weight: 2190
      - name: asset_tag
        kind: Text
        label: Asset Tag
        optional: true
        description: Unique in NetBox when set.
        order_weight: 2280
      - name: discovered
        kind: Boolean
        default_value: false
        optional: true
        description: Created by automated discovery.
        order_weight: 2370
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: offline
            label: Offline
            description: Installed but not currently in service
            color: '#9e9e9e'
          - name: active
            label: Active
            description: Fully operational and in service
            color: '#4caf50'
          - name: planned
            label: Planned
            description: Planned for future deployment
            color: '#00bcd4'
          - name: staged
            label: Staged
            description: Installed and being prepared for service
            color: '#2196f3'
          - name: failed
            label: Failed
            description: Malfunctioning or out of service
            color: '#f44336'
          - name: decommissioning
            label: Decommissioning
            description: Being removed from service
            color: '#ffeb3b'
        optional: false
        order_weight: 1240
    relationships:
      - name: device
        peer: NetboxDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_device__inventory_item
        order_weight: 800
      - name: role
        peer: NetboxInventoryItemRole
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_inventory_item__role
        order_weight: 1040
      - name: manufacturer
        peer: NetboxManufacturer
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_manufacturer__inventory_item
        order_weight: 1140
      - name: component
        peer: NetboxModularComponent
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_inventory_item__component
        description: Device component associated with this item, for example the interface that holds a transceiver.
        order_weight: 1340

  - name: InventoryItemRole
    namespace: Netbox
    description: A user-defined functional role for inventory items.
    label: Inventory Item Role
    icon: mdi:tag-text-outline
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
      - name: color
        kind: Color
        optional: true
        description: 'Color as a hex code, for example #aa1409.'
        order_weight: 1200
    relationships:
      - name: inventory_items
        peer: NetboxInventoryItem
        label: Inventory Items
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_inventory_item__role
        order_weight: 3100

extensions:
  nodes:
    - kind: NetboxSite
      relationships:
        - name: devices
          peer: NetboxDevice
          kind: Generic
          cardinality: many
          optional: true
          identifier: netbox_device__site
          order_weight: 3300

    - kind: NetboxLocation
      relationships:
        - name: devices
          peer: NetboxDevice
          kind: Generic
          cardinality: many
          optional: true
          identifier: netbox_device__location
          order_weight: 3200
