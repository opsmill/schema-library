---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
# NetBox devices, mapped to Infrahub: the nodes of the Devices section of the NetBox navigation menu,
# which are devices, modules, device roles, platforms, virtual chassis, virtual device contexts, device
# types, module types, manufacturers, device components, inventory items and MAC addresses.
# Source: the NetBox 4.7 database tables dcim_* and the NetBox model documentation.
# Depends on: netbox/netbox_organization.
#
# How the NetBox tables map:
#   - Device component templates (dcim_*template, including dcim_porttemplatemapping) become Infrahub
#     object templates: NetboxDevice sets generate_template, and Infrahub generates a template for the
#     device and for each component kind. Module type component templates have no equivalent.
#   - Power ports, power outlets, cooling intakes and cooling outflows are device components, as in the
#     NetBox Devices menu. Power panels and feeds are in netbox/netbox_power, and cooling sources and
#     feeds are in netbox/netbox_cooling.
#   - The _path, _site, _location, _rack and _name cache columns and the *_count counters are computed
#     by NetBox and are not mapped.
#   - Decimal values are stored as integers in a fixed small unit (weights in grams, diameters in
#     millimeters, flow rates in liters per minute), because Infrahub has no decimal attribute kind.
#     Coordinates are stored as text. Device heights are whole rack units: NetBox half units (for
#     example 0.5U) are not supported.
#   - Type fields with more than 40 NetBox values (interface, power port, power outlet, front and rear
#     port types) are Text holding the NetBox slug, so a new NetBox type never blocks an import.
#     Shorter lists are Dropdowns with the NetBox values, labels and descriptions.
#   - The NetBox field "label" is mapped to physical_label: Infrahub fills an attribute named label
#     from the name when it is empty.
#   - Device names are mandatory and unique, while NetBox makes them optional. In return, devices
#     have a human-friendly ID (their name), and device components and virtual device contexts have
#     [device name, name], for example ["leaf1", "Ethernet1"].
#   - NetboxDevice inherits CoreArtifactTarget, so device configurations can be generated as artifacts.
#   - Device roles, platforms and inventory items are trees: each inherits its own hierarchical generic
#     (for example NetboxPlatformHierarchy), which gives it the parent, children, ancestors and
#     descendants fields. NetBox's path and sort_path are not mapped. The parent and children of each
#     tree are its hierarchical generic, not the node itself: the Infrahub 1.11 web interface stops
#     responding on the list page of a node that is its own parent.
#   - Not mapped: virtualization (Device.cluster), wireless (Interface rf_*, tx_power, wireless_link,
#     wireless_lans), extras (config_template), front_image and rear_image on device types.
#
# Generics that later schemas build on:
#   - NetboxCabledObject holds mark_connected. netbox/netbox_connections adds the cable, cable_end,
#     cable_connector and cable_positions fields.
#   - NetboxIPAddressAssignable and NetboxServiceParent are completed by netbox/netbox_ipam.
#   - NetboxL2VPNAssignable is completed by netbox/netbox_vpn.
# Infrahub cannot add a generic to a node after the node is loaded, so the device nodes declare these
# generics here even when the schema that uses them is not loaded.
#
# netbox/netbox_racks adds the rack, position and rack face fields of devices. This schema adds the
# devices relationship to the sites and locations of netbox/netbox_organization.
version: "1.0"

generics:
  - name: Component
    namespace: Netbox
    description: >-
      Fields every device component shares: a name unique on the device, a physical label, a description and tags.
    label: Device Component
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 1000
      - name: physical_label
        kind: Text
        label: Physical Label
        optional: true
        description: Physical label printed on the component. The NetBox field is called label.
        order_weight: 1010
      - name: description
        kind: Text
        optional: true
        order_weight: 2000
    relationships:
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        order_weight: 3000

  - name: ModularComponent
    namespace: Netbox
    description: >-
      A device component that a module can provide, such as an interface, a port, a power outlet or a cooling connector.
    label: Modular Component
    include_in_menu: false
    relationships:
      - name: module
        peer: NetboxModule
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_module__component
        description: Module that provides this component. Empty when the component belongs to the device itself.
        order_weight: 810
      - name: inventory_items
        peer: NetboxInventoryItem
        label: Inventory Items
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_inventory_item__component
        order_weight: 3950

  - name: CabledObject
    namespace: Netbox
    description: >-
      An object a cable can connect to. netbox/netbox_connections adds the cable, the cable end and the connector
      position.
    label: Cabled Object
    include_in_menu: false
    attributes:
      - name: mark_connected
        kind: Boolean
        label: Mark Connected
        default_value: false
        optional: true
        description: Treat as if a cable is connected.
        order_weight: 2540

  - name: IPAddressAssignable
    namespace: Netbox
    description: Interface or FHRP group that IP addresses can be assigned to. netbox/netbox_ipam adds the relationship.
    label: IP Address Assignable
    include_in_menu: false

  - name: ServiceParent
    namespace: Netbox
    description: Device or FHRP group that application services can run on. netbox/netbox_ipam adds the relationship.
    label: Service Parent
    include_in_menu: false

  - name: L2VPNAssignable
    namespace: Netbox
    description: Interface or VLAN that an L2VPN can terminate on. netbox/netbox_vpn adds the relationship.
    label: L2VPN Assignable
    include_in_menu: false

  - name: DeviceRoleHierarchy
    namespace: Netbox
    description: >-
      Lets a device role have a parent device role, as in NetBox. Adds the parent, children, ancestors and descendants
      fields.
    label: Device Role Hierarchy
    include_in_menu: false
    hierarchical: true

  - name: PlatformHierarchy
    namespace: Netbox
    description: >-
      Lets a platform have a parent platform, as in NetBox. Adds the parent, children, ancestors and descendants fields.
    label: Platform Hierarchy
    include_in_menu: false
    hierarchical: true

  - name: InventoryItemHierarchy
    namespace: Netbox
    description: >-
      Lets an inventory item have a parent inventory item, as in NetBox. Adds the parent, children, ancestors and
      descendants fields.
    label: Inventory Item Hierarchy
    include_in_menu: false
    hierarchical: true

nodes:
  - name: Manufacturer
    namespace: Netbox
    description: >-
      The make of a device, for example Cisco or Dell. Each device type, module type and rack type belongs to a
      manufacturer.
    icon: mdi:factory
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
      - NetboxContactAssignable
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
    relationships:
      - name: device_types
        peer: NetboxDeviceType
        label: Device Types
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_manufacturer__device_type
        order_weight: 3100
      - name: module_types
        peer: NetboxModuleType
        label: Module Types
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_manufacturer__module_type
        order_weight: 3190
      - name: module_bay_types
        peer: NetboxModuleBayType
        label: Module Bay Types
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_manufacturer__module_bay_type
        order_weight: 3370
      - name: platforms
        peer: NetboxPlatform
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_manufacturer__platform
        order_weight: 3460
      - name: inventory_items
        peer: NetboxInventoryItem
        label: Inventory Items
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_manufacturer__inventory_item
        order_weight: 3550

  - name: DeviceType
    namespace: Netbox
    description: >-
      A make and model of hardware, with physical attributes such as rack height. Components are set in device
      templates.
    label: Device Type
    icon: mdi:poll
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
    human_friendly_id:
      - manufacturer__name__value
      - model__value
    display_label: '{{ model__value }}'
    attributes:
      - name: model
        kind: Text
        optional: false
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1090
      - name: part_number
        kind: Text
        label: Part Number
        optional: true
        order_weight: 2100
      - name: u_height
        kind: Number
        label: Height (U)
        default_value: 1
        optional: false
        description: Whole rack units. NetBox also allows half units, which are not supported here.
        order_weight: 1270
      - name: exclude_from_utilization
        kind: Boolean
        label: Exclude From Utilization
        default_value: false
        optional: true
        order_weight: 1360
      - name: is_full_depth
        kind: Boolean
        label: Full Depth
        default_value: true
        optional: true
        order_weight: 1450
      - name: subdevice_role
        kind: Dropdown
        label: Parent/Child Role
        choices:
          - name: parent
            label: Parent
            description: Houses child devices in its bays
          - name: child
            label: Child
            description: Installed within a parent device bay
        optional: true
        description: Parent devices house child devices in device bays.
        order_weight: 1540
      - name: airflow
        kind: Dropdown
        choices:
          - name: front-to-rear
            label: Front to rear
          - name: rear-to-front
            label: Rear to front
          - name: left-to-right
            label: Left to right
          - name: right-to-left
            label: Right to left
          - name: side-to-rear
            label: Side to rear
          - name: rear-to-side
            label: Rear to side
          - name: bottom-to-top
            label: Bottom to top
          - name: top-to-bottom
            label: Top to bottom
          - name: passive
            label: Passive
          - name: mixed
            label: Mixed
        optional: true
        order_weight: 1630
      - name: cooling_method
        kind: Dropdown
        label: Cooling Method
        choices:
          - name: air
            label: Air
            color: '#00bcd4'
          - name: liquid
            label: Liquid
            color: '#2196f3'
          - name: hybrid
            label: Hybrid
            color: '#9c27b0'
          - name: immersion
            label: Immersion
            color: '#3f51b5'
        optional: true
        order_weight: 1720
      - name: weight_grams
        kind: Number
        label: Weight (g)
        optional: true
        description: >-
          NetBox stores a decimal weight with a unit (kg, g, lb or oz). Stored here in grams, as a whole number.
        order_weight: 2200
      - name: end_of_life
        kind: DateTime
        label: End of Life
        optional: true
        order_weight: 2300
    relationships:
      - name: manufacturer
        peer: NetboxManufacturer
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_manufacturer__device_type
        order_weight: 800
      - name: default_platform
        peer: NetboxPlatform
        label: Default Platform
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_platform__device_type
        order_weight: 1180
      - name: devices
        peer: NetboxDevice
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_device__device_type
        order_weight: 3100

  - name: ModuleTypeProfile
    namespace: Netbox
    description: >-
      Classifies module types and defines the attributes their modules carry, for example a power supply's voltage.
    label: Module Type Profile
    icon: mdi:card-bulleted-settings-outline
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: attribute_schema
        kind: JSON
        label: Attribute Schema
        optional: true
        description: >-
          JSON schema for the attributes of module types that use this profile. The NetBox field is called schema.
        order_weight: 1100
    relationships:
      - name: module_types
        peer: NetboxModuleType
        label: Module Types
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_module_type__profile
        order_weight: 3100

  - name: ModuleBayType
    namespace: Netbox
    description: A label on module bays and module types that restricts which modules fit which bays.
    label: Module Bay Type
    icon: mdi:tray-full
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        description: Unique in Infrahub. NetBox makes it unique only per manufacturer.
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
      - name: color
        kind: Color
        optional: true
        description: 'Color as a hex code, for example #aa1409.'
        order_weight: 1200
    relationships:
      - name: manufacturer
        peer: NetboxManufacturer
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_manufacturer__module_bay_type
        order_weight: 1300
      - name: module_bays
        peer: NetboxModuleBay
        label: Module Bays
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_module_bay__module_bay_type
        order_weight: 3100
      - name: module_types
        peer: NetboxModuleType
        label: Module Types
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_module_type__module_bay_type
        order_weight: 3200

  - name: ModuleType
    namespace: Netbox
    description: >-
      A make and model of hardware installed in a module bay, with its own components, for example a line card.
    label: Module Type
    icon: mdi:expansion-card
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
    human_friendly_id:
      - manufacturer__name__value
      - model__value
    display_label: '{{ model__value }}'
    attributes:
      - name: model
        kind: Text
        optional: false
        order_weight: 1000
      - name: part_number
        kind: Text
        label: Part Number
        optional: true
        order_weight: 2100
      - name: airflow
        kind: Dropdown
        choices:
          - name: front-to-rear
            label: Front to rear
          - name: rear-to-front
            label: Rear to front
          - name: left-to-right
            label: Left to right
          - name: right-to-left
            label: Right to left
          - name: side-to-rear
            label: Side to rear
          - name: passive
            label: Passive
        optional: true
        order_weight: 1200
      - name: cooling_method
        kind: Dropdown
        label: Cooling Method
        choices:
          - name: air
            label: Air
            color: '#00bcd4'
          - name: liquid
            label: Liquid
            color: '#2196f3'
          - name: hybrid
            label: Hybrid
            color: '#9c27b0'
          - name: immersion
            label: Immersion
            color: '#3f51b5'
        optional: true
        order_weight: 1300
      - name: weight_grams
        kind: Number
        label: Weight (g)
        optional: true
        description: >-
          NetBox stores a decimal weight with a unit (kg, g, lb or oz). Stored here in grams, as a whole number.
        order_weight: 2190
      - name: end_of_life
        kind: DateTime
        label: End of Life
        optional: true
        order_weight: 2280
      - name: attribute_data
        kind: JSON
        label: Attributes
        optional: true
        description: Values for the attributes that the module type profile defines.
        order_weight: 2370
    relationships:
      - name: manufacturer
        peer: NetboxManufacturer
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_manufacturer__module_type
        order_weight: 800
      - name: profile
        peer: NetboxModuleTypeProfile
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_module_type__profile
        order_weight: 1100
      - name: module_bay_types
        peer: NetboxModuleBayType
        label: Module Bay Types
        kind: Attribute
        cardinality: many
        optional: true
        identifier: netbox_module_type__module_bay_type
        order_weight: 1400
      - name: modules
        peer: NetboxModule
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_module__module_type
        order_weight: 3100

  - name: DeviceRole
    namespace: Netbox
    description: >-
      A user-defined functional role for devices, for example core switch, distribution switch or access switch. Roles
      can be nested.
    label: Device Role
    icon: mdi:tag
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
      - NetboxDeviceRoleHierarchy
    parent: NetboxDeviceRoleHierarchy
    children: NetboxDeviceRoleHierarchy
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        description: Unique in Infrahub. NetBox makes it unique only within the parent role.
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
      - name: color
        kind: Color
        optional: true
        description: 'Color as a hex code, for example #aa1409.'
        order_weight: 1200
      - name: vm_role
        kind: Boolean
        label: VM Role
        default_value: true
        optional: true
        description: Virtual machines can be assigned to this role.
        order_weight: 1300
    relationships:
      - name: devices
        peer: NetboxDevice
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_device__role
        order_weight: 3100

  - name: Platform
    namespace: Netbox
    description: >-
      The software that runs on a device, for example Junos 15. Platforms can be nested, for example Debian under Linux.
    icon: mdi:application-cog-outline
    include_in_menu: true
    menu_placement: NetboxDevice
    inherit_from:
      - NetboxGeneric
      - NetboxPlatformHierarchy
    parent: NetboxPlatformHierarchy
    children: NetboxPlatformHierarchy
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        description: Unique in Infrahub. NetBox makes it unique only per manufacturer.
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
    relationships:
      - name: manufacturer
        peer: NetboxManufacturer
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_manufacturer__platform
        order_weight: 1200
      - name: devices
        peer: NetboxDevice
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_device__platform
        order_weight: 3100
      - name: device_types
        peer: NetboxDeviceType
        label: Device Types
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_platform__device_type
        description: Device types that use this platform as their default.
        order_weight: 3200

  - name: Device
    namespace: Netbox
    description: >-
      A piece of hardware installed in a site or rack. Infrahub device templates replace NetBox component templates.
    icon: clarity:network-switch-solid
    include_in_menu: true
    inherit_from:
      - CoreArtifactTarget
      - NetboxGeneric
      - NetboxTenantAssignable
      - NetboxContactAssignable
      - NetboxServiceParent
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    generate_template: true
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        description: Unique in Infrahub. NetBox makes the name optional and unique only within the site and tenant.
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: offline
            label: Offline
            description: Installed but not currently in service
            color: '#9e9e9e'
          - name: active
            label: Active
            description: Fully operational and in service
            color: '#4caf50'
          - name: planned
            label: Planned
            description: Planned for future deployment
            color: '#00bcd4'
          - name: staged
            label: Staged
            description: Installed and being prepared for service
            color: '#2196f3'
          - name: failed
            label: Failed
            description: Malfunctioning or out of service
            color: '#f44336'
          - name: inventory
            label: Inventory
            description: In inventory but not yet deployed
            color: '#9c27b0'
          - name: decommissioning
            label: Decommissioning
            description: Being removed from service
            color: '#ffeb3b'
        optional: false
        order_weight: 1140
      - name: airflow
        kind: Dropdown
        choices:
          - name: front-to-rear
            label: Front to rear
          - name: rear-to-front
            label: Rear to front
          - name: left-to-right
            label: Left to right
          - name: right-to-left
            label: Right to left
          - name: side-to-rear
            label: Side to rear
          - name: rear-to-side
            label: Rear to side
          - name: bottom-to-top
            label: Bottom to top
          - name: top-to-bottom
            label: Top to bottom
          - name: passive
            label: Passive
          - name: mixed
            label: Mixed
        optional: true
        order_weight: 1490
      - name: cooling_method
        kind: Dropdown
        label: Cooling Method
        choices:
          - name: air
            label: Air
            color: '#00bcd4'
          - name: liquid
            label: Liquid
            color: '#2196f3'
          - name: hybrid
            label: Hybrid
            color: '#9c27b0'
          - name: immersion
            label: Immersion
            color: '#3f51b5'
        optional: true
        order_weight: 1560
      - name: serial
        kind: Text
        label: Serial Number
        optional: true
        order_weight: 2100
      - name: asset_tag
        kind: Text
        label: Asset Tag
        optional: true
        description: Unique in NetBox when set.
        order_weight: 2170
      - name: latitude
        kind: Text
        label: Latitude (decimal degrees)
        parameters:
          regex: ^-?\d{1,3}(\.\d{1,6})?$
        optional: true
        description: >-
          GPS coordinate in decimal degrees (-90 to 90). Stored as text because Infrahub has no decimal attribute kind.
        order_weight: 2240
      - name: longitude
        kind: Text
        label: Longitude (decimal degrees)
        parameters:
          regex: ^-?\d{1,3}(\.\d{1,6})?$
        optional: true
        description: >-
          GPS coordinate in decimal degrees (-180 to 180). Stored as text because Infrahub has no decimal attribute
          kind.
        order_weight: 2310
      - name: vc_position
        kind: Number
        label: Virtual Chassis Position
        optional: true
        order_weight: 1700
      - name: vc_priority
        kind: Number
        label: Virtual Chassis Priority
        optional: true
        description: Priority for election as virtual chassis master.
        order_weight: 1770
      - name: local_context_data
        kind: JSON
        label: Local Config Context Data
        optional: true
        description: Device-specific configuration context data.
        order_weight: 2380
    relationships:
      - name: device_type
        peer: NetboxDeviceType
        label: Device Type
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_device__device_type
        order_weight: 800
      - name: role
        peer: NetboxDeviceRole
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_device__role
        order_weight: 810
      - name: platform
        peer: NetboxPlatform
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_device__platform
        description: Mandatory in Infrahub. NetBox allows a device without a platform.
        order_weight: 830
      - name: tenant
        peer: NetboxTenant
        kind: Attribute
        cardinality: one
        optional: false
