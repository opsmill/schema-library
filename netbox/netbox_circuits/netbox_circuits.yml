---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
# NetBox circuits, mapped to Infrahub.
# Source: the NetBox 4.7 database tables circuits_* and the NetBox model documentation.
# Depends on: netbox/netbox_organization and netbox/netbox_devices. netbox/netbox_ipam is optional:
# when it is loaded, providers get an ASNs relationship through the NetboxASNAssignable generic.
#
# How the NetBox tables map:
#   - A circuit termination is a cabled object (NetboxCabledObject from netbox/netbox_devices). When
#     netbox/netbox_connections is loaded, a cable can connect it to an interface, a front port or a
#     rear port.
#   - The termination point of a circuit termination is a region, site group, site, location or
#     provider network (NetboxCircuitTerminationPoint from netbox/netbox_organization).
#   - circuits_circuit.termination_a and termination_z are computed by NetBox from the terminations and
#     are not mapped. Neither are the _site, _region, _site_group, _location and _provider_network
#     cache columns of circuit terminations.
#   - Circuit distance is converted to meters, because Infrahub has no decimal attribute kind.
version: "1.0"

generics:
  - name: CircuitGroupMember
    namespace: Netbox
    description: 'An object that can be assigned to a circuit group: a circuit or a virtual circuit.'
    label: Circuit Group Member
    include_in_menu: false
    relationships:
      - name: circuit_group_assignments
        peer: NetboxCircuitGroupAssignment
        label: Circuit Group Assignments
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_circuit_group_assignment__member
        order_weight: 3920

nodes:
  - name: Provider
    namespace: Netbox
    description: An organization that provides connectivity, such as a carrier or an Internet exchange point.
    icon: mdi:domain
    include_in_menu: true
    menu_placement: NetboxCircuit
    inherit_from:
      - NetboxGeneric
      - NetboxContactAssignable
      - NetboxASNAssignable
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
    relationships:
      - name: accounts
        peer: NetboxProviderAccount
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_provider__account
        order_weight: 3100
      - name: networks
        peer: NetboxProviderNetwork
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_provider__network
        order_weight: 3200
      - name: circuits
        peer: NetboxCircuit
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_provider__circuit
        order_weight: 3300

  - name: ProviderAccount
    namespace: Netbox
    description: An account held with a provider.
    label: Provider Account
    icon: mdi:card-account-details-outline
    include_in_menu: true
    menu_placement: NetboxCircuit
    inherit_from:
      - NetboxGeneric
      - NetboxContactAssignable
    human_friendly_id:
      - provider__name__value
      - account__value
    display_label: '{{ account__value }}'
    uniqueness_constraints:
      - [provider, account__value]
    attributes:
      - name: account
        kind: Text
        label: Account ID
        optional: false
        order_weight: 1000
      - name: name
        kind: Text
        optional: true
        description: Unique per provider in NetBox when set.
        order_weight: 1100
    relationships:
      - name: provider
        peer: NetboxProvider
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_provider__account
        order_weight: 800
      - name: circuits
        peer: NetboxCircuit
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_provider_account__circuit
        order_weight: 3100
      - name: virtual_circuits
        peer: NetboxVirtualCircuit
        label: Virtual Circuits
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_provider_account__virtual_circuit
        order_weight: 3200

  - name: ProviderNetwork
    namespace: Netbox
    description: The boundary of a provider network whose details are unknown, for example a regional MPLS network.
    label: Provider Network
    icon: mdi:cloud-outline
    include_in_menu: true
    menu_placement: NetboxCircuit
    inherit_from:
      - NetboxGeneric
      - NetboxCircuitTerminationPoint
    human_friendly_id:
      - provider__name__value
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 1000
      - name: service_id
        kind: Text
        label: Service ID
        optional: true
        order_weight: 2100
    relationships:
      - name: provider
        peer: NetboxProvider
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_provider__network
        order_weight: 800
      - name: virtual_circuits
        peer: NetboxVirtualCircuit
        label: Virtual Circuits
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_provider_network__virtual_circuit
        order_weight: 3100

  - name: CircuitType
    namespace: Netbox
    description: >-
      A functional classification of circuits, for example Internet transit, out-of-band connectivity or peering.
    label: Circuit Type
    icon: mdi:shape-outline
    include_in_menu: true
    menu_placement: NetboxCircuit
    inherit_from:
      - NetboxGeneric
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
      - name: color
        kind: Color
        optional: true
        description: 'Color as a hex code, for example #aa1409.'
        order_weight: 1200
    relationships:
      - name: circuits
        peer: NetboxCircuit
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_circuit_type__circuit
        order_weight: 3100

  - name: Circuit
    namespace: Netbox
    description: >-
      A physical point-to-point data connection, typically between distant sites, for example for Internet access.
    icon: mdi:transit-connection-variant
    include_in_menu: true
    inherit_from:
      - NetboxGeneric
      - NetboxTenantAssignable
      - NetboxContactAssignable
      - NetboxCircuitGroupMember
    human_friendly_id:
      - provider__name__value
      - cid__value
    display_label: '{{ cid__value }}'
    uniqueness_constraints:
      - [provider, cid__value]
    attributes:
      - name: cid
        kind: Text
        label: Circuit ID
        optional: false
        description: Circuit ID, unique per provider.
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: planned
            label: Planned
            description: Designated for future use but not yet installed
            color: '#00bcd4'
          - name: provisioning
            label: Provisioning
            description: Being configured for service
            color: '#2196f3'
          - name: active
            label: Active
            description: Fully operational and in service
            color: '#4caf50'
          - name: offline
            label: Offline
            description: Installed but not currently in service
            color: '#f44336'
          - name: deprovisioning
            label: Deprovisioning
            description: Being removed from service
            color: '#ffeb3b'
          - name: decommissioned
            label: Decommissioned
            description: Retired and no longer in service
            color: '#9e9e9e'
        optional: false
        order_weight: 1200
      - name: install_date
        kind: DateTime
        label: Installed
        optional: true
        order_weight: 1300
      - name: termination_date
        kind: DateTime
        label: Terminates
        optional: true
        order_weight: 1400
      - name: commit_rate
        kind: Number
        label: Commit Rate (Kbps)
        optional: true
        order_weight: 1500
      - name: distance_meters
        kind: Number
        label: Distance (m)
        optional: true
        description: NetBox stores a decimal distance in km, m, mi or ft. Converted to meters here.
        order_weight: 1600
    relationships:
      - name: provider
        peer: NetboxProvider
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_provider__circuit
        order_weight: 800
      - name: provider_account
        peer: NetboxProviderAccount
        label: Provider Account
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_provider_account__circuit
        order_weight: 1100
      - name: type
        peer: NetboxCircuitType
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_circuit_type__circuit
        order_weight: 810
      - name: terminations
        peer: NetboxCircuitTermination
        kind: Component
        cardinality: many
        optional: true
        identifier: netbox_circuit__termination
        order_weight: 3100

  - name: CircuitTermination
    namespace: Netbox
    description: >-
      One end of a circuit, A or Z. It ends on a site or provider network, and connects by cable to a device port.
    label: Circuit Termination
    icon: mdi:transit-connection-horizontal
    include_in_menu: true
    menu_placement: NetboxCircuit
    inherit_from:
      - NetboxCabledObject
    display_label: '{{ circuit__cid__value }}: {{ term_side__value }}'
    uniqueness_constraints:
      - [circuit, term_side__value]
    attributes:
      - name: term_side
        kind: Dropdown
        label: Termination Side
        choices:
          - name: A
            label: A
          - name: Z
            label: Z
        optional: false
        order_weight: 1000
      - name: port_speed
        kind: Number
        label: Port Speed (Kbps)
        optional: true
        order_weight: 1200
      - name: upstream_speed
        kind: Number
        label: Upstream Speed (Kbps)
        optional: true
        description: Upstream speed, when it differs from the port speed.
        order_weight: 1300
      - name: xconnect_id
        kind: Text
        label: Cross-Connect ID
        optional: true
        order_weight: 2100
      - name: pp_info
        kind: Text
        label: Patch Panel and Ports
        optional: true
        order_weight: 2200
      - name: description
        kind: Text
        optional: true
        order_weight: 2000
    relationships:
      - name: circuit
        peer: NetboxCircuit
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_circuit__termination
        order_weight: 800
      - name: termination
        peer: NetboxCircuitTerminationPoint
        label: Termination Point
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_circuit_termination__termination
        description: Region, site group, site, location or provider network where the circuit ends.
        order_weight: 1100
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        order_weight: 3000

  - name: CircuitGroup
    namespace: Netbox
    description: >-
      An administrative group of circuits, for example to correlate circuits from different providers that serve the
      same purpose.
    label: Circuit Group
    icon: mdi:group
    include_in_menu: true
    menu_placement: NetboxCircuit
    inherit_from:
      - NetboxGeneric
      - NetboxTenantAssignable
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
    relationships:
      - name: assignments
        peer: NetboxCircuitGroupAssignment
        kind: Component
        cardinality: many
        optional: true
        identifier: netbox_circuit_group__assignment
        order_weight: 3100

  - name: CircuitGroupAssignment
    namespace: Netbox
    description: Assigns a circuit or a virtual circuit to a circuit group, with an optional priority.
    label: Circuit Group Assignment
    icon: mdi:group
    include_in_menu: true
    menu_placement: NetboxCircuit
    display_label: '{{ group__name__value }}'
    uniqueness_constraints:
      - [group, member]
    attributes:
      - name: priority
        kind: Dropdown
        choices:
          - name: primary
            label: Primary
          - name: secondary
            label: Secondary
          - name: tertiary
            label: Tertiary
          - name: inactive
            label: Inactive
        optional: true
        order_weight: 1000
    relationships:
      - name: group
        peer: NetboxCircuitGroup
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_circuit_group__assignment
        order_weight: 800
      - name: member
        peer: NetboxCircuitGroupMember
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_circuit_group_assignment__member
        description: Circuit or virtual circuit.
        order_weight: 810
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        order_weight: 3000

  - name: VirtualCircuitType
    namespace: Netbox
    description: A functional classification of virtual circuits, by function or technology.
    label: Virtual Circuit Type
    icon: mdi:shape-outline
    include_in_menu: true
    menu_placement: NetboxVirtualCircuit
    inherit_from:
      - NetboxGeneric
    human_friendly_id:
      - name__value
    display_label: '{{ name__value }}'
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: slug
        kind: Text
        parameters:
          regex: ^[-a-zA-Z0-9_]+$
        optional: true
        description: URL-friendly identifier that NetBox derives from the name.
        order_weight: 1100
      - name: color
        kind: Color
        optional: true
        description: 'Color as a hex code, for example #aa1409.'
        order_weight: 1200
    relationships:
      - name: virtual_circuits
        peer: NetboxVirtualCircuit
        label: Virtual Circuits
        kind: Generic
        cardinality: many
        optional: true
        identifier: netbox_virtual_circuit_type__virtual_circuit
        order_weight: 3100

  - name: VirtualCircuit
    namespace: Netbox
    description: >-
      A virtual connection between two or more interfaces across a provider network, on top of separate physical
      connections.
    label: Virtual Circuit
    icon: mdi:transit-connection
    include_in_menu: true
    inherit_from:
      - NetboxGeneric
      - NetboxTenantAssignable
      - NetboxContactAssignable
      - NetboxCircuitGroupMember
    display_label: '{{ cid__value }}'
    uniqueness_constraints:
      - [provider_network, cid__value]
    attributes:
      - name: cid
        kind: Text
        label: Circuit ID
        optional: false
        description: Circuit ID, unique per provider network.
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: planned
            label: Planned
            description: Designated for future use but not yet installed
            color: '#00bcd4'
          - name: provisioning
            label: Provisioning
            description: Being configured for service
            color: '#2196f3'
          - name: active
            label: Active
            description: Fully operational and in service
            color: '#4caf50'
          - name: offline
            label: Offline
            description: Installed but not currently in service
            color: '#f44336'
          - name: deprovisioning
            label: Deprovisioning
            description: Being removed from service
            color: '#ffeb3b'
          - name: decommissioned
            label: Decommissioned
            description: Retired and no longer in service
            color: '#9e9e9e'
        optional: false
        order_weight: 1200
    relationships:
      - name: provider_network
        peer: NetboxProviderNetwork
        label: Provider Network
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_provider_network__virtual_circuit
        order_weight: 800
      - name: provider_account
        peer: NetboxProviderAccount
        label: Provider Account
        kind: Attribute
        cardinality: one
        optional: true
        identifier: netbox_provider_account__virtual_circuit
        order_weight: 1100
      - name: type
        peer: NetboxVirtualCircuitType
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_virtual_circuit_type__virtual_circuit
        order_weight: 810
      - name: terminations
        peer: NetboxVirtualCircuitTermination
        kind: Component
        cardinality: many
        optional: true
        identifier: netbox_virtual_circuit__termination
        order_weight: 3100

  - name: VirtualCircuitTermination
    namespace: Netbox
    description: Connects a virtual interface to a virtual circuit, with a role such as peer, hub or spoke.
    label: Virtual Circuit Termination
    icon: mdi:transit-connection-horizontal
    include_in_menu: true
    menu_placement: NetboxVirtualCircuit
    display_label: '{{ virtual_circuit__cid__value }}: {{ interface__name__value }}'
    uniqueness_constraints:
      - [interface]
    attributes:
      - name: role
        kind: Dropdown
        default_value: peer
        choices:
          - name: peer
            label: Peer
            description: Connects to other peers as an equal endpoint
            color: '#4caf50'
          - name: hub
            label: Hub
            description: Central endpoint to which spokes connect
            color: '#2196f3'
          - name: spoke
            label: Spoke
            description: Remote endpoint connecting to a hub
            color: '#ff9800'
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 2000
    relationships:
      - name: virtual_circuit
        peer: NetboxVirtualCircuit
        label: Virtual Circuit
        kind: Parent
        cardinality: one
        optional: false
        identifier: netbox_virtual_circuit__termination
        order_weight: 800
      - name: interface
        peer: NetboxInterface
        kind: Attribute
        cardinality: one
        optional: false
        identifier: netbox_interface__virtual_circuit_termination
        order_weight: 810
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        order_weight: 3000

extensions:
  nodes:
    - kind: NetboxCircuitTerminationPoint
      relationships:
        - name: circuit_terminations
          peer: NetboxCircuitTermination
          label: Circuit Terminations
          kind: Generic
          cardinality: many
          optional: true
          identifier: netbox_circuit_termination__termination
          order_weight: 3750

    - kind: NetboxInterface
      relationships:
        - name: virtual_circuit_termination
          peer: NetboxVirtualCircuitTermination
          label: Virtual Circuit Termination
          kind: Generic
          cardinality: one
          optional: true
          identifier: netbox_interface__virtual_circuit_termination
          order_weight: 3760
