---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: Hosting
    namespace: Cluster
    label: Hosting Cluster
    description: A cluster hosting virtual machines.
    icon: mdi:dots-hexagon
    menu_placement: VirtualizationVirtualMachine
    inherit_from:
      - ClusterGeneric
      - VirtualizationHostVirtualMachine # Means we can get VM running on this one
      - ClusterGenericComputeUnitNodes # Means it's built out of regular compute unit (e.g. server)
    attributes:
      - name: technology
        label: Technology
        kind: Dropdown
        order_weight: 1200
        description: Underlying virtualisation or clustering technology.
        choices:
          - name: vmware
            label: VMware vSphere
            color: "#3d8600"
          - name: kvm
            label: KVM / QEMU
            color: "#0082e2"
          - name: hyper_v
            label: Hyper-V
            color: "#00adef"
          - name: xen
            label: Xen / XenServer
            color: "#f5821f"
          - name: nutanix
            label: Nutanix AHV
            color: "#024da1"
          - name: openstack
            label: OpenStack
            color: "#ed1944"
          - name: kubernetes
            label: Kubernetes
            color: "#326ce5"
          - name: public_cloud
            label: Public Cloud
            color: "#888888"
      - name: status
        kind: Dropdown
        optional: false
        default_value: active
        order_weight: 1300
        choices:
          - name: active
            label: Active
            description: Fully operational and currently in service.
            color: "#00d25b"
          - name: provisioning
            label: Provisioning
            description: In the process of being set up and configured.
            color: "#f0ad4e"
          - name: maintenance
            label: Maintenance
            description: Undergoing routine maintenance or repairs.
            color: "#ff9800"
          - name: drained
            label: Drained
            description: Temporarily taken out of service.
            color: "#9e9e9e"
