---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: Community
    namespace: Snmp
    description: Generic model for SNMP community configurations.
    label: SNMP Community
    icon: iconoir:community
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 1000
      - name: description
        kind: Text
        order_weight: 1100
        optional: true
    relationships:
      - name: clients
        peer: SnmpClient
        cardinality: many
        kind: Component
      - name: devices
        label: Devices
        description: Devices this community is configured on.
        peer: DcimDevice
        cardinality: many
        kind: Attribute
        order_weight: 1200

nodes:
  # --------------------  Snmp Community --------------------
  - name: CommunityV2
    namespace: Snmp
    description: SNMP v1/v2c community configuration.
    label: SNMP v1/v2c
    icon: iconoir:community
    menu_placement: SnmpCommunity
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    inherit_from:
      - SnmpCommunity
    attributes:
      - name: community_string
        kind: Password
        order_weight: 1300
      - name: access
        kind: Dropdown
        choices:
          - name: read_only
            label: Read-Only
            description: Read-only access.
          - name: read_write
            label: Read-Write
            description: Read-write access.
        order_weight: 1200

  - name: CommunityV3
    namespace: Snmp
    description: SNMP version 3 configuration with enhanced security.
    label: SNMP v3
    icon: iconoir:community
    menu_placement: SnmpCommunity
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    inherit_from:
      - SnmpCommunity
    attributes:
      - name: username
        kind: Text
        order_weight: 1300
      - name: auth_protocol
        label: Authentication Protocol
        kind: Dropdown
        choices:
          - name: none
            label: None
            description: No authentication.
          - name: md5
            label: MD5
            description: MD5 authentication.
          - name: sha
            label: SHA
            description: SHA authentication.
        order_weight: 1400
      - name: auth_password
        label: Authentication Password
        kind: Password
        order_weight: 1500
        optional: true
      - name: privacy_protocol
        label: Privacy Protocol
        kind: Dropdown
        choices:
          - name: none
            label: None
            description: No privacy.
          - name: des
            label: DES
            description: DES encryption.
          - name: aes
            label: AES
            description: AES encryption.
        order_weight: 1600
      - name: privacy_password
        label: Privacy Password
        kind: Password
        order_weight: 1700
        optional: true
      - name: security_level
        label: Security Level
        kind: Dropdown
        choices:
          - name: noAuthNoPriv
            label: NoAuthNoPriv
            description: No authentication and no privacy.
          - name: authNoPriv
            label: AuthNoPriv
            description: Authentication but no privacy.
          - name: authPriv
            label: AuthPriv
            description: Both authentication and privacy.
        order_weight: 1200

  - name: Client
    namespace: Snmp
    description: Represents an SNMP client that interacts with SNMP Community.
    label: SNMP Client
    icon: ph:user-list-light
    menu_placement: SnmpCommunity
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        order_weight: 1000
      - name: client_description
        label: Description
        kind: Text
        order_weight: 1100
        optional: true
    relationships:
      - name: ip_address
        label: IP Address
        description: Authorized SNMP client address.
        peer: IpamIPAddress
        cardinality: many
        kind: Attribute
        order_weight: 1150
      - name: community
        peer: SnmpCommunity
        cardinality: many
        order_weight: 1200
