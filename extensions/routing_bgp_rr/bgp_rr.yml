---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: BGPRRCluster
    namespace: Routing
    description: "A Route Reflector (RR) Cluster used for grouping internal peers"
    label: "Route Reflector Cluster"
    icon: "mdi:router-network"
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        description: "Name of the Route Reflector Cluster"
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        description: "Optional description of the Route Reflector Cluster"
        order_weight: 1100
    relationships:
      - name: cluster_id
        peer: IpamIPAddress
        label: "Cluster ID"
        kind: Attribute
        cardinality: one
        optional: false
        description: "Cluster ID represented as a reference to an IP Address"
        order_weight: 1200
      - name: peer_groups
        peer: RoutingBGPPeerGroup
        label: "BGP Peer Groups"
        kind: Generic
        cardinality: many
        optional: true
        order_weight: 1300

extensions:
  nodes:
    - kind: RoutingBGPPeerGroup
      relationships:
        - name: rr_cluster
          peer: RoutingBGPRRCluster
          label: "RR Cluster"
          kind: Attribute
          cardinality: one
          order_weight: 1700
