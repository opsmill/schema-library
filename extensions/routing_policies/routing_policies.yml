---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: Policy
    namespace: Routing
    description: "Policy defining the rules for routing traffic in a network."
    icon: carbon:deployment-policy
    include_in_menu: false
    human_friendly_id:
      - "name__value"
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        description: "The name of the routing policy."
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        description: "An optional description of the routing policy."
        order_weight: 1100
      - name: policy_type
        kind: Dropdown
        label: Type
        choices:
          - name: import_policy
            label: Import
            description: "Policy for incoming routes."
            color: "#E6E6FA" # lavender
          - name: export_policy
            label: Export
            description: "Policy for outgoing routes."
            color: "#E6E6FA" # lavender
          - name: import_export_policy
            label: Import + Export
            description: "Policy for both incoming and outgoing routes."
            color: "#E6E6FA" # lavender
        description: "The type of routing policy which specifies the direction of route advertisement."
        order_weight: 1200
      - name: weight
        kind: Number
        default_value: 1000
        optional: true
        description: "Priority of the routing policy. The higher the number, the higher the priority."
        order_weight: 1400
      - name: address_family
        kind: Dropdown
        default_value: "all"
        choices:
          - name: "ipv4"
            label: IPv4
            description: "Policy applies to IPv4 addresses."
            color: "#E6E6FA" # lavender
          - name: "ipv6"
            label: IPv6
            description: "Policy applies to IPv6 addresses."
            color: "#E6E6FA" # lavender
          - name: "all"
            label: All
            description: "Policy applies to both IPv4 and IPv6 addresses."
            color: "#E6E6FA" # lavender
        description: "The address family for the routing policy indicating the type of IP address."
        order_weight: 1150
