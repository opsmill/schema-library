---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: VRF
    namespace: Ipam
    description: A VRF is an isolated layer three domain.
    label: VRF
    icon: mdi:router
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
      - name: vrf_rd
        kind: Text
        label: Route Distinguisher
        optional: true
      - name: enforce_unique
        kind: Boolean
        label: Enforce Unique
        description: Declares the intent that prefixes and addresses be unique within this VRF.
          Infrahub does not enforce this; consume it from a check or a generator.
        default_value: true
        optional: true
        order_weight: 1100
      - name: description
        kind: Text
        optional: true
        order_weight: 1200
    relationships:
      # Uncomment to pin each VRF to its own IP namespace; the library leaves VRFs
      # namespace-agnostic by default.
      # - name: namespace
      #   peer: BuiltinIPNamespace
      #   identifier: vrf__namespace
      #   optional: true
      #   cardinality: one
      #   kind: Attribute
      - name: import_rt
        peer: IpamRouteTarget
        label: Import Targets
        kind: Attribute
        cardinality: many
        optional: true
        identifier: vrf__import
      - name: export_rt
        peer: IpamRouteTarget
        label: Export Targets
        kind: Attribute
        cardinality: many
        optional: true
        identifier: vrf__export

  - name: RouteTarget
    namespace: Ipam
    description: Route Target (RFC 4360)
    label: Route Target
    icon: mdi:target
    menu_placement: IpamVRF
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      # TODO: regex to comply with RFC 4360 (nautobot doesn't enforce that)
      - name: name
        kind: Text
        unique: true
      - name: description
        kind: Text
        optional: true
    relationships:
      - name: import_vrf
        peer: IpamVRF
        kind: Generic
        label: Imported by VRFs
        cardinality: many
        optional: true
        identifier: vrf__import
      - name: export_vrf
        peer: IpamVRF
        kind: Generic
        label: Exported by VRFs
        cardinality: many
        optional: true
        identifier: vrf__export
extensions:
  nodes:
    - kind: IpamPrefix
      relationships:
        - name: vrf
          peer: IpamVRF
          label: VRF
          kind: Attribute
          cardinality: one
          optional: true
          identifier: prefix__vrf
          order_weight: 1150
    - kind: IpamIPAddress
      relationships:
        - name: vrf
          peer: IpamVRF
          label: VRF
          kind: Attribute
          cardinality: one
          optional: true
          identifier: ip_address__vrf
          order_weight: 1150
