---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

extensions:
  nodes:
    - kind: InterfacePhysical
      attributes:
        - name: breakout_capability
          kind: Boolean
          default_value: false
          optional: false
          description: "Indicates if the port supports breakout capability"
          order_weight: 1800
      relationships:
        - name: breakout_child_interfaces
          peer: InterfacePhysical
          label: "Breakout child interface(s)"
          kind: Attribute
          cardinality: many
          optional: true
          identifier: "physical__breakout"
          direction: outbound
          description: "Interfaces resulting from the breakout"
          order_weight: 1850
        - name: breakout_parent_interface
          peer: InterfacePhysical
          label: "Breakout parent interface"
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "physical__breakout"
          direction: inbound
          description: "Interface from which breakout is created"
          order_weight: 1900
