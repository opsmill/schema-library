# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: SVLAN
    namespace: Ipam
    label: S-VLAN
    description: A VLAN used to encapsulate multiple CVLANs.
    include_in_menu: false
    inherit_from:
      - GenericVLAN
    relationships:
      - name: cvlan
        label: Customer vlan(s)
        peer: IpamCVLAN
        optional: true
        direction: outbound
        identifier: vlan__qinq
        cardinality: many
        kind: Attribute

  - name: CVLAN
    namespace: Ipam
    label: C-VLAN
    description: A VLAN assigned to customer traffic, encapsulated within an S-VLAN.
    include_in_menu: false
    display_label: "{{ svlan__name__value }}-{{ vlan_id__value }}"
    human_friendly_id:
      - svlan__name__value
      - vlan_id__value
    uniqueness_constraints:
      - [vlan_id__value, svlan]
    inherit_from:
      - GenericVLAN
    attributes:
      - name: name
        kind: Text
        optional: true
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ svlan__name__value }}-{{ vlan_id__value }}"
    relationships:
      - name: svlan
        label: Supplier vlan
        peer: IpamSVLAN
        optional: false
        direction: inbound
        identifier: vlan__qinq
        cardinality: one
        kind: Attribute
