---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: Site
    namespace: Location
    label: Site
    inherit_from:
      - LocationGeneric
      - LocationHosting
      - IpamPrefixScope
      - IpamVLANGroupScope
    menu_placement: LocationGeneric
    display_label: name__value
    icon: ri:building-line
    attributes:
      - name: status
        kind: Dropdown
        optional: false
        default_value: active
        order_weight: 1250
        choices:
          - name: active
            label: Active
            color: "#00d25b"
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: staging
            label: Staging
            color: "#f0ad4e"
          - name: decommissioning
            label: Decommissioning
            color: "#ff9800"
          - name: retired
            label: Retired
            color: "#6c757d"
      - name: facility
        kind: Text
        unique: false
        optional: true
        order_weight: 1100
      - name: physical_address
        kind: Text
        unique: false
        optional: true
        order_weight: 1500
      - name: timezone
        kind: Text
        optional: true
        order_weight: 1300
