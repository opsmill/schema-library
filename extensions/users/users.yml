---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: Group
    namespace: User
    description: "User Group"
    label: "User Groups"
    icon: "iconoir:group"
    human_friendly_id:
      - "name__value"
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      - name: idle_timeout
        kind: Number
        label: Idle Timeout (s)
        optional: false
        order_weight: 1300
      - name: permissions
        kind: Dropdown
        choices:
          - name: admin
            label: Admin
            description: "All rights on device."
            color: "#E6E6FA" # lavender
          - name: operator
            label: Operator
            description: "Operator right on configuration."
            color: "#E6E6FA" # lavender
          - name: read_only
            label: Read Only
            description: "Read only right on configuration."
            color: "#E6E6FA" # lavender
        optional: false
        order_weight: 1200

  - name: Account
    namespace: User
    description: "User login and authentication"
    label: "User Account"
    icon: "mdi:account-key"
    human_friendly_id:
      - "name__value"
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        label: Username
        unique: true
        optional: false
        description: "The login username"
        order_weight: 1000
      - name: full_name
        kind: Text
        optional: true
        description: "Full name of the account"
        order_weight: 1100
      - name: ssh_key
        kind: Password
        optional: true
        description: "SSH key for secure access"
        order_weight: 1300
      - name: password
        kind: Password
        optional: true
        description: "Password for login (alternative to SSH key)"
        order_weight: 1400
      - name: mfa_enabled
        kind: Boolean
        default_value: false
        optional: false
        description: "Whether multi-factor authentication is enabled"
        order_weight: 1500
    relationships:
      - name: user_group
        peer: UserGroup
        kind: Attribute
        cardinality: one
        optional: false
        order_weight: 1200
      - name: organization
        peer: OrganizationGeneric
        kind: Parent
        cardinality: one
        optional: false
        order_weight: 900

extensions:
  nodes:
    # Organization Extensions
    - kind: OrganizationGeneric
      relationships:
        - name: accounts
          peer: UserAccount
          kind: Component
          cardinality: many
          optional: true
          description: "List of Accounts under this organization"
          order_weight: 1600
