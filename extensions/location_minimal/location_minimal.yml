---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: Region
    namespace: Location
    label: Region
    icon: carbon:cics-region-target

    menu_placement: LocationGeneric
    inherit_from:
      - LocationGeneric
      - IpamPrefixScope
    parent: ""
    children: LocationCountry
  - name: Country
    namespace: Location
    label: Country
    icon: gis:search-country

    menu_placement: LocationGeneric
    inherit_from:
      - LocationGeneric
    parent: LocationRegion
    children: LocationSite
  - name: Site
    namespace: Location
    label: Site
    icon: ri:building-line
    menu_placement: LocationGeneric
    inherit_from:
      - LocationGeneric
      - LocationHosting
      - IpamPrefixScope
      - IpamVLANGroupScope
    parent: LocationCountry
    display_label: name__value
    attributes:
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: active
            label: Active
            color: "#00d25b"
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: staging
            label: Staging
            color: "#f0ad4e"
          - name: decommissioning
            label: Decommissioning
            color: "#ff9800"
          - name: retired
            label: Retired
            color: "#6c757d"
        optional: false
        order_weight: 1250
      - name: facility
        kind: Text
        unique: false
        optional: true
        order_weight: 1100
      - name: physical_address
        kind: Text
        unique: false
        optional: true
        order_weight: 1500
      - name: timezone
        kind: Text
        optional: true
        order_weight: 1300
