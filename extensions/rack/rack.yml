---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: Rack
    namespace: Location
    description: A physical equipment rack installed at a site.
    label: Rack
    icon: clarity:rack-server-line
    menu_placement: LocationGeneric
    inherit_from:
      - LocationHosting
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: facility_id
        kind: Text
        optional: true
        order_weight: 1100
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: active
            label: Active
            description: Rack is installed and in use.
            color: "#00d25b"
          - name: available
            label: Available
            description: Rack is installed and has capacity for new equipment.
            color: "#00bcd4"
          - name: reserved
            label: Reserved
            description: Rack is allocated but not yet in use.
            color: "#4d90fe"
          - name: planned
            label: Planned
            description: Rack is planned but not yet installed.
            color: "#2196f3"
          - name: decommissioning
            label: Decommissioning
            description: Rack is being phased out and emptied.
            color: "#ff9800"
          - name: deprecated
            label: Retired
            description: Rack has been removed from service.
            color: "#6c757d"
        optional: false
        order_weight: 1200
      - name: height
        kind: Number
        label: Height (U)
        default_value: 42
        optional: false
        order_weight: 1300
      - name: serial_number
        kind: Text
        optional: true
        order_weight: 1400
      - name: asset_tag
        kind: Text
        optional: true
        order_weight: 1500
    relationships:
      - name: site
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: false
        identifier: site__racks
        order_weight: 900
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        order_weight: 3000

extensions:
  nodes:
    - kind: LocationSite
      relationships:
        - name: racks
          peer: LocationRack
          kind: Component
          cardinality: many
          optional: true
          identifier: site__racks
