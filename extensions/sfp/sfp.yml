---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: GenericSFP
    namespace: Dcim
    description: Generic base for all Small Form-factor Pluggable (SFP) transceivers.
    label: SFP
    icon: mdi:gpu
    include_in_menu: true
    display_label: "{{ form_factor__value }} {{ sfp_type__value }}"
    attributes:
      - name: serial_number
        kind: Text
        optional: true
        order_weight: 1400
      - name: sfp_type
        kind: Dropdown
        choices:
          - name: lr
            label: LR (Long Reach)
            description: Long Reach SFP, suitable for long-distance fiber connections.
            color: "#009933"
          - name: sr
            label: SR (Short Reach)
            description: Short Reach SFP, typically used for short-distance fiber.
            color: "#cc66ff"
          - name: lrm
            label: LRM (Long Reach Multimode)
            description: SFP for multimode fiber over longer distances.
            color: "#3366ff"
          - name: t
            label: T (Twisted Pair)
            description: Copper-based SFP, often used for twisted pair Ethernet.
            color: "#ff9900"
          - name: sr4
            label: SR4 (Short Range 4-lane)
            description: Short Range 4-lane SFP, used for parallel optics.
            color: "#6666ff"
          - name: lr4
            label: LR4 (Long Range 4-lane)
            description: Long Range 4-lane SFP, typically used for longer distances over parallel optics.
            color: "#336699"
          - name: zr
            label: ZR (Extended Reach)
            description: Extended Reach SFP, suitable for distances up to 80km.
            color: "#cc3300"
          - name: er
            label: ER (Extended Reach)
            description: Extended Reach SFP, typically used for 40km distances.
            color: "#ff6600"
          - name: dac
            label: DAC (Direct Attach Copper)
            description: Direct Attach Copper, used for short connections over copper.
            color: "#b35900"
          - name: aoc
            label: AOC (Active Optical Cable)
            description: Active Optical Cable, used for short connections over fiber.
            color: "#6699ff"
        optional: false
        description: "Type of SFP, such as LR, SR, T."
        order_weight: 1100
      - name: status
        kind: Dropdown
        default_value: plugged
        choices:
          - name: plugged
            label: Plugged
            description: Plugged into a device's interface.
            color: "#7fbf7f"
          - name: spare
            label: Spare
            description: Stored somewhere as a spare.
            color: "#ffff7f"
          - name: decommissioned
            label: Decommissioned
            description: Decommissioned might be broken or not used anymore.
            color: "#ffd27f"
        optional: false
        order_weight: 1200
      - name: form_factor
        kind: Dropdown
        choices:
          - name: sfp
            label: SFP
            color: "#009933"
          - name: sfp_plus
            label: SFP+
            color: "#cc66ff"
          - name: qsfp
            label: QSFP
            color: "#6666ff"
          - name: qsfp_plus
            label: QSFP+
            color: "#3366ff"
          - name: qsfp28
            label: QSFP28
            color: "#336699"
          - name: qsfp_dd
            label: QSFP-DD
            color: "#ff9900"
          - name: cfp
            label: CFP
            color: "#cc3300"
          - name: cfp2
            label: CFP2
            color: "#ff6600"
          - name: cfp4
            label: CFP4
            color: "#b35900"
          - name: xfp
            label: XFP
            color: "#6699ff"
          - name: sfp56
            label: SFP56
            color: "#9966ff"
          - name: qsfp56
            label: QSFP56
            color: "#9933cc"
          - name: osfp
            label: OSFP
            color: "#0099cc"
        optional: false
        description: "The physical form factor of the SFP module."
        order_weight: 1000
    relationships:
      - name: interface
        peer: InterfacePhysical
        kind: Attribute
        cardinality: one
        optional: true
        identifier: sfp__interface
        order_weight: 1300
      - name: spare_location
        peer: LocationHosting
        kind: Attribute
        cardinality: one
        optional: true
        order_weight: 1500
      - name: manufacturer
        peer: OrganizationManufacturer
        kind: Attribute
        cardinality: one
        optional: true
        order_weight: 1350

nodes:
  - name: StandardSFP
    namespace: Dcim
    description: Standard SFP module for various types (e.g., LR, SR, T).
    label: Standard SFP
    icon: mdi:gpu
    include_in_menu: true
    menu_placement: DcimGenericSFP
    inherit_from:
      - DcimGenericSFP

  - name: BidiSFP
    namespace: Dcim
    description: "Bidirectional SFP supporting two wavelengths for single-fiber operation."
    label: Bidirectional SFP
    icon: lineicons:arrow-both-direction-vertical-1
    include_in_menu: true
    menu_placement: DcimGenericSFP
    inherit_from:
      - DcimGenericSFP
    attributes:
      - name: wavelength_tx
        kind: Number
        label: "Transmit Wavelength (nm)"
        optional: false
        description: "Transmit wavelength in nm."
        order_weight: 1175
      - name: wavelength_rx
        kind: Number
        label: "Receive Wavelength (nm)"
        optional: false
        description: "Receive wavelength in nm."
        order_weight: 1150

extensions:
  nodes:
    - kind: InterfacePhysical
      relationships:
        - name: plugged_sfp
          peer: DcimGenericSFP
          kind: Generic
          cardinality: one
          optional: true
          identifier: sfp__interface
          order_weight: 1700
    - kind: LocationHosting
      relationships:
        - name: spare_sfps
          peer: DcimGenericSFP
          kind: Generic
          cardinality: many
          optional: true
          order_weight: 1750
    - kind: OrganizationManufacturer
      relationships:
        - name: sfps
          peer: DcimGenericSFP
          kind: Generic
          label: SFPs
          cardinality: many
          optional: true
          order_weight: 1500
