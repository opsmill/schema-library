---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: BGPCommunity
    namespace: Routing
    description: "Defines a BGP community."
    label: "BGP Community"
    icon: iconoir:community
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }} ({{ community__value }})"
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        description: "The name of the BGP community."
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        description: "An optional description of the BGP community."
        order_weight: 1100
      - name: community
        kind: Text
        unique: true
        optional: false
        description: "The value of the BGP community (RFC1997, RFC4360, RFC8092)."
        order_weight: 1200
    relationships:
      - name: routing_policy
        peer: RoutingPolicy
        label: Routing Policies
        kind: Generic
        cardinality: many
        optional: true
        description: "The BGP Policies using this BGP Community."
        order_weight: 1300
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        order_weight: 2000
