---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
# Optical transport network. Ported from opsmill/infrahub-demo-otn at e98be9b.
# Devices here are optical roles; OtnGenericDevice.dcim_device links one to its
# DcimPhysicalDevice record. See the reference page for what is out of scope.
# A `cardinality: one` relationship earns an inverse only where the peer's own page
# is what the reverse list is for; otherwise use a server-side filter on the forward
# side. An inverse must reuse the forward identifier, or it reads an empty list.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  # Base generics. Generics cannot inherit generics, so a concrete node lists
  # several rather than stacking them.
  - name: GenericPort
    namespace: Otn
    description: Any port on any OTN device. The connection surface of the network.
    label: Port
    icon: mdi:ethernet
    include_in_menu: false
    human_friendly_id:
      - device__name__value
      - name__value
    order_by:
      - name__value
    display_label: "{{ device__name__value }} {{ name__value }}"
    uniqueness_constraints:
      - ["device", "name__value"]
    attributes:
      - name: name
        kind: Text
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._/-]+$"
        optional: false
        description: Port identifier as the vendor labels it, such as 1/1/1.
        order_weight: 1000
      - name: role
        kind: Dropdown
        default_value: spare
        choices:
          - name: client
            label: Client
            color: "#4caf50"
          - name: line
            label: Line
            color: "#2196f3"
          - name: add_drop
            label: Add/drop
            color: "#9c27b0"
          - name: degree
            label: Degree
            color: "#673ab7"
          - name: booster
            label: Booster
            color: "#ff9800"
          - name: preamp
            label: Pre-amplifier
            color: "#ffc107"
          - name: tributary
            label: Tributary
            color: "#795548"
          - name: spare
            label: Spare
            color: "#9e9e9e"
          - name: monitor
            label: Monitor
            description: A monitoring interface, not a traffic-carrying port.
            color: "#607d8b"
        optional: false
        order_weight: 1100
      - name: enabled
        kind: Boolean
        default_value: true
        optional: false
        order_weight: 1200
      - name: admin_state
        kind: Dropdown
        default_value: up
        choices:
          - name: up
            label: Up
            color: "#4caf50"
          - name: down
            label: Down
            color: "#f44336"
          - name: testing
            label: Testing
            color: "#ff9800"
        optional: false
        description: RFC 2863 ifAdminStatus. What the operator asked for.
        order_weight: 1300
      - name: oper_state
        kind: Dropdown
        default_value: down
        choices:
          - name: up
            label: Up
            color: "#4caf50"
          - name: down
            label: Down
            color: "#f44336"
          - name: testing
            label: Testing
            color: "#ff9800"
          - name: dormant
            label: Dormant
            color: "#2196f3"
          - name: unknown
            label: Unknown
            color: "#9e9e9e"
        optional: false
        description: RFC 2863 ifOperStatus subset. What the port actually does.
        order_weight: 1400
    relationships:
      - name: device
        peer: OtnGenericDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: otn_device__ports
        order_weight: 800
      # Symmetric and self-referencing, so both ends are the same edge. The explicit
      # identifier stops Infrahub splitting it into two one-way links.
      - name: connected_to
        peer: OtnGenericPort
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_port__connected_to
        order_weight: 900

  - name: OpticalElement
    namespace: Otn
    description: Anything light passes through and loses power in.
    label: Optical element
    icon: mdi:blur-linear
    include_in_menu: false
    # No order_by and no human_friendly_id: both resolve against this generic's own
    # attributes, and it declares none. Every member kind carries its own order_by.
    attributes:
      - name: insertion_loss_mdb
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 60000
        optional: false
        description: Insertion loss in millidecibels, 0 to 60 dB. No Float kind exists.
        order_weight: 1500
      - name: insertion_loss_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if insertion_loss_mdb__value is not none %}{{ insertion_loss_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Insertion loss in dB. Read-only, derived from insertion_loss_mdb.
        order_weight: 1510
      - name: vendor
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1600
      - name: model
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1700
      - name: element_class
        kind: Dropdown
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800

  - name: GenericDevice
    namespace: Otn
    description: Anything racked at a site.
    label: Device
    icon: mdi:server
    # Carries the Devices entry in the sidebar. The ten device kinds nest under it.
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: provisioning
            label: Provisioning
            color: "#ff9800"
          - name: active
            label: Active
            color: "#4caf50"
          - name: maintenance
            label: Maintenance
            color: "#ffc107"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
        optional: false
        order_weight: 1100
      - name: role
        kind: Dropdown
        choices:
          - name: core
            label: Core
            color: "#3f51b5"
          - name: edge
            label: Edge
            color: "#2196f3"
          - name: access
            label: Access
            color: "#00bcd4"
          - name: passive
            label: Passive
            color: "#9e9e9e"
        optional: false
        order_weight: 1200
    relationships:
      # Not a Parent: Parent would force optional: false, and a device has to be
      # creatable before its site record exists.
      - name: site
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_site__devices
        order_weight: 800
      # An OTN device names the optical role; DcimPhysicalDevice names the physical
      # asset. This edge joins the two records for one box rather than duplicating
      # it, and it does not merge the two graphs: no OTN port is a DcimEndpoint, so
      # extensions/cable still cannot terminate on optical gear. Optional, because a
      # deployment with no Dcim inventory is equally valid.
      - name: dcim_device
        peer: DcimPhysicalDevice
        label: Physical device record
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_device__dcim_device
        order_weight: 940
      - name: ports
        peer: OtnGenericPort
        kind: Component
        cardinality: many
        optional: true
        identifier: otn_device__ports
        on_delete: cascade
        order_weight: 900

  - name: OpticalPort
    namespace: Otn
    description: Optical-specific port properties.
    label: Optical port
    icon: mdi:lightbulb-on-outline
    include_in_menu: false
    attributes:
      # Optional because a grey router port is not on the C-band grid.
      - name: center_frequency_mhz
        kind: Number
        parameters:
          min_value: 191350000
          max_value: 196100000
        optional: true
        description: ITU-T G.694.1 centre frequency in MHz. No Float kind exists.
        order_weight: 1600
      - name: center_frequency_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_frequency_mhz__value is not none %}{{ center_frequency_mhz__value / 1000000 }} THz{% endif %}
        optional: true
        description: Centre frequency in THz. Empty on a grey port, which has none.
        order_weight: 1610
      - name: tx_power_mdbm
        kind: Number
        parameters:
          min_value: -30000
          max_value: 30000
        optional: true
        description: Transmit power in milli-dBm, -30 to +30 dBm.
        order_weight: 1700
      - name: tx_power_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if tx_power_mdbm__value is not none %}{{ tx_power_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Transmit power in dBm. Read-only, derived from tx_power_mdbm.
        order_weight: 1710
      - name: rx_sensitivity_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 10000
        optional: true
        description: Receiver sensitivity in milli-dBm, -40 to +10 dBm.
        order_weight: 1800
      - name: rx_sensitivity_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if rx_sensitivity_mdbm__value is not none %}{{ rx_sensitivity_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Receiver sensitivity in dBm. Derived from rx_sensitivity_mdbm.
        order_weight: 1810
      # A Dropdown rather than an enum, so a connector carries a label, a colour and
      # a sentence. Every kind inheriting this generic restates the list, and a
      # restatement one choice short is accepted in silence.
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
      # Return loss is a polish property, not a connector property: an LC comes in
      # all three. Optional, so ports loaded before it existed stay valid.
      - name: polish
        kind: Dropdown
        choices:
          - name: UPC
            label: UPC
            description: Ultra physical contact. Blue housing, about 50 dB return loss.
            color: "#2196f3"
          - name: APC
            label: APC
            description: Angled physical contact. Green housing, about 65 dB return loss.
            color: "#4caf50"
          - name: PC
            label: PC
            description: Physical contact. The oldest polish, about 35 dB return loss.
            color: "#ff9800"
          - name: none
            label: None
            description: No polished endface, such as a fusion splice.
            color: "#9e9e9e"
        optional: true
        description: Endface polish. Mating an APC to a UPC costs about 0.5 dB and reflects.
        order_weight: 1910

  - name: CopperPort
    namespace: Otn
    description: Electrical port properties for G.703 tributaries.
    label: Copper port
    icon: mdi:cable-data
    include_in_menu: false
    attributes:
      # kbps, not Mbps: as integer Mbps, E1 at 2.048 and T1 at 1.544 both round to 2.
      - name: speed_kbps
        kind: Number
        default_value: 2048
        parameters:
          min_value: 64
          max_value: 400000000
        optional: false
        description: Line rate in kbps. E1 is 2048, T1 is 1544, STM-1 is 155520.
        order_weight: 1600
      - name: impedance_ohm
        kind: Number
        default_value: 120
        parameters:
          min_value: 50
          max_value: 600
        optional: false
        description: Nominal impedance in ohms. 120 for E1 pair, 75 for coax.
        order_weight: 1700
      - name: connector_type
        kind: Dropdown
        default_value: RJ48
        choices:
          - name: BNC
            label: BNC
            description: Coaxial bayonet connector, used for 75 ohm E1 and STM-1.
            color: "#ff9800"
          - name: RJ48
            label: RJ48
            description: Eight-position jack for 120 ohm balanced E1 and T1 pairs.
            color: "#2196f3"
          - name: RJ45
            label: RJ45
            description: Eight-position jack for Ethernet management and console.
            color: "#4caf50"
        optional: false
        order_weight: 1900

nodes:
  # Ports.
  - name: RouterPort
    namespace: Otn
    description: Grey optics on an IP router. Not on the C-band grid.
    label: Router port
    icon: mdi:ethernet
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      # The module fitted in this port, and the inverse of OtnTransceiver.port. Both
      # ends are cardinality one, so a second module in one port is refused at write
      # time. Declared only on the three concrete kinds that have a cage.
      - name: transceiver
        peer: OtnTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        order_weight: 960

  - name: ClientPort
    namespace: Otn
    description: Transponder client side. Where grey light arrives.
    label: Client port
    icon: mdi:lan-connect
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      - name: transceiver
        peer: OtnTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        order_weight: 960

  - name: LinePort
    namespace: Otn
    description: Transponder DWDM line side. Where coloured light leaves.
    label: Line port
    icon: mdi:transit-connection
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      # The wavelength this port terminates. The deletion boundary stops here: a
      # carrier is a spectrum allocation on a route, terminated at both of its ends,
      # so cascading from one port would delete the containers and the customer
      # services groomed into them.
      - name: carrier
        peer: OtnOpticalCarrier
        label: Wavelength this port terminates
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_carrier__line_ports
        order_weight: 850
      - name: transceiver
        peer: OtnTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        order_weight: 960

  - name: RoadmAddDropPort
    namespace: Otn
    description: Local add and drop on a ROADM.
    label: ROADM add/drop port
    icon: mdi:call-split
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900

  - name: RoadmDegreePort
    namespace: Otn
    description: Line-facing degree on a ROADM. One per direction.
    label: ROADM degree port
    icon: mdi:compass-outline
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900

  - name: AmplifierPort
    namespace: Otn
    description: Amplifier input or output.
    label: Amplifier port
    icon: mdi:amplifier
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900

  # One multiplexer channel and the common side it shares. Neither declares an
  # insertion loss: that belongs to the device, so a per-port figure would double
  # count.
  - name: MuxClientPort
    namespace: Otn
    description: One channel of a multiplexer. The side facing the transponder or router that lights it.
    label: Mux client port
    icon: mdi:import
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    # A channel port should bind exactly one of these two edges. Infrahub has no
    # cross-relationship constraint, so both neither and both are writable.
    # Unenforced here.
    relationships:
      - name: dwdm_channel
        peer: OtnFrequencyGrid
        label: Dense channel this port carries
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_frequency_grid__mux_client_ports
        order_weight: 850
      - name: cwdm_channel
        peer: OtnCwdmChannel
        label: Coarse wavelength this port carries
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_cwdm_channel__mux_client_ports
        order_weight: 860

  - name: MuxLinePort
    namespace: Otn
    description: The common side of a multiplexer, where the whole band leaves.
    label: Mux line port
    icon: mdi:export
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort

  - name: TributaryPort
    namespace: Otn
    description: E1 or T1 G.703 electrical tributary. The only copper port here.
    label: Tributary port
    icon: mdi:cable-data
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnCopperPort

  # The catalog entry and the physical unit. Neither is racked, so neither inherits.
  - name: TransceiverType
    namespace: Otn
    description: A pluggable optic part number and what it can be made to do.
    label: Transceiver type
    icon: mdi:chip
    include_in_menu: true
    human_friendly_id:
      - part_number__value
    order_by:
      - part_number__value
    display_label: part_number__value
    attributes:
      - name: part_number
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._/+-]+$"
        optional: false
        description: Vendor part number, such as QDD-400G-ZRP-S.
        order_weight: 1000
      - name: vendor
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1100
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1200
      - name: form_factor
        kind: Dropdown
        choices:
          - name: QSFP-DD
            label: QSFP-DD
            description: Eight-lane double-density cage. What a coherent 400G pluggable takes.
            color: "#2196f3"
          - name: QSFP28
            label: QSFP28
            description: Four-lane cage, 100G grey optics.
            color: "#4caf50"
          - name: OSFP
            label: OSFP
            description: Eight-lane cage with a larger thermal budget than QSFP-DD.
            color: "#9c27b0"
          - name: CFP2-DCO
            label: CFP2-DCO
            description: Digital coherent optic. The DSP is in the module.
            color: "#ff9800"
          - name: CFP2-ACO
            label: CFP2-ACO
            description: Analogue coherent optic. The DSP is on the host card.
            color: "#ffc107"
          - name: SFP28
            label: SFP28
            description: Single-lane 25G cage.
            color: "#00bcd4"
          - name: SFP+
            label: SFP+
            description: Single-lane 10G cage.
            color: "#9e9e9e"
        optional: false
        description: The cage this part fits. It decides which ports can hold it.
        order_weight: 1300
      # A fixed-wavelength optic can only sit on the channel it was bought for.
      - name: tunable
        kind: Boolean
        default_value: false
        optional: false
        description: Whether the laser can be tuned across the grid or is fixed at one wavelength.
        order_weight: 1400
    relationships:
      # Optional, so a part number can be recorded before the mode catalog is
      # populated. Nothing compares this list against the mode a carrier actually
      # runs, so a module can be fitted to a carrier it cannot support.
      # Unenforced here.
      - name: supported_modes
        peer: OtnOpticalMode
        label: Modes this part can run
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_optical_mode__transceiver_types
        order_weight: 900

  - name: Transceiver
    namespace: Otn
    description: One physical pluggable optic, fitted in a port or sitting on a shelf.
    label: Transceiver
    icon: mdi:memory
    include_in_menu: true
    human_friendly_id:
      - serial__value
    order_by:
      - serial__value
    display_label: "{{ type__part_number__value }} {{ serial__value }}"
    attributes:
      - name: serial
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        description: Vendor serial number. The only thing that identifies this unit.
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: spare
        choices:
          - name: in_service
            label: In service
            color: "#4caf50"
          - name: spare
            label: Spare
            color: "#2196f3"
          - name: rma
            label: Returned to vendor
            color: "#ff9800"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
        optional: false
        order_weight: 1100
    relationships:
      - name: type
        peer: OtnTransceiverType
        label: Part this unit is
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_transceiver_type__units
        order_weight: 900
      # Optional, so a spare, an RMA and a decommissioned unit stay modellable, and
      # therefore carrying no uniqueness constraint: Infrahub refuses one on an
      # optional relationship. The duplicate is refused by the inverse instead, since
      # every `transceiver` on this identifier is cardinality one. This peers the
      # generic, and a relationship to a generic cannot be filtered by peer kind, so
      # a module written into an amplifier port is accepted. Unenforced here.
      - name: port
        peer: OtnOpticalPort
        label: Port this unit is fitted in
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        order_weight: 950

  # Plant.

  - name: FiberType
    namespace: Otn
    description: Single-mode fiber family. Attenuation, dispersion and group index at 1550 nm.
    label: Fiber type
    icon: mdi:cable-data
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 32
          regex: "^[A-Za-z0-9.-]+$"
        optional: false
        description: ITU-T designation, such as G.652.D.
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      # One coefficient per fibre family, measured at 1550 nm. That is right for the
      # dense grid and understates the loss on a coarse wavelength.
      - name: attenuation_coefficient_mdb_per_km
        kind: Number
        parameters:
          min_value: 150
          max_value: 400
        optional: false
        description: Attenuation at 1550 nm in millidecibels per kilometre. 0.20 dB/km is 200. Wrong for CWDM.
        order_weight: 1500
      - name: attenuation_coefficient_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if attenuation_coefficient_mdb_per_km__value is not none %}{{ attenuation_coefficient_mdb_per_km__value
            / 1000 }} dB/km{% endif %}
        optional: true
        description: Attenuation in dB/km. Read-only, derived from attenuation_coefficient_mdb_per_km.
        order_weight: 1510
      - name: dispersion_fs_per_nm_km
        kind: Number
        parameters:
          min_value: 0
          max_value: 30000
        optional: false
        description: Chromatic dispersion at 1550 nm in femtoseconds per nm per km. 17 ps/nm/km is 17000.
        order_weight: 1600
      - name: dispersion_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if dispersion_fs_per_nm_km__value is not none %}{{ dispersion_fs_per_nm_km__value
            / 1000 }} ps/nm/km{% endif %}
        optional: true
        description: Dispersion in ps/nm/km. Read-only, derived from dispersion_fs_per_nm_km.
        order_weight: 1610
      - name: group_index_milli
        kind: Number
        default_value: 1468
        parameters:
          min_value: 1400
          max_value: 1500
        optional: false
        description: Group index at 1550 nm in milli-units. 1.468 is 1468. Sets propagation delay.
        order_weight: 1700
    relationships:
      - name: spans
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_fiber_type__spans
        order_weight: 900

  - name: Conduit
    namespace: Otn
    description: Shared-risk link group. Two routes through one conduit are not diverse.
    label: Conduit
    icon: mdi:pipe
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: owner
        kind: Text
        parameters:
          max_length: 64
        optional: true
        description: Who owns the trench. Often not the network operator.
        order_weight: 1100
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1200
    relationships:
      - name: spans
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_conduit__spans
        order_weight: 900

  - name: FiberSpan
    namespace: Otn
    description: One amplifier-to-amplifier fiber section. Lossy, but not racked and not a device.
    label: Fiber span
    icon: mdi:vector-line
    include_in_menu: true
    inherit_from:
      - OtnOpticalElement
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    # The inherited insertion_loss_mdb stays at 0 on a span. A span's real loss is
    # length x attenuation plus splices, connectors and aging margin.
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      # Not unique: a uniqueness constraint cannot reference an optional relationship,
      # and oms stays optional so a span is creatable before its section exists.
      - name: oms_sequence
        kind: Number
        parameters:
          min_value: 1
          max_value: 50
        optional: true
        description: Position of this span within its optical multiplex section, counting from the A end.
        order_weight: 1200
      - name: length_m
        kind: Number
        parameters:
          min_value: 0
          max_value: 500000
        optional: false
        description: Route length in metres, not straight-line distance. 500 km is the practical ceiling.
        order_weight: 1500
      - name: length_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if length_m__value is not none %}{{ length_m__value / 1000 }} km{% endif %}
        optional: true
        description: Route length in km. Read-only, derived from length_m.
        order_weight: 1510
      - name: splice_count
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 500
        optional: false
        description: Fusion splices along the span. Roughly one per drum of cable.
        order_weight: 1600
      - name: splice_loss_mdb
        kind: Number
        default_value: 50
        parameters:
          min_value: 0
          max_value: 1000
        optional: false
        description: Loss per splice in millidecibels. 0.05 dB is 50.
        order_weight: 1610
      - name: connector_count
        kind: Number
        default_value: 2
        parameters:
          min_value: 0
          max_value: 20
        optional: false
        description: Mated connector pairs on the span, normally one at each end.
        order_weight: 1700
      - name: connector_loss_mdb
        kind: Number
        default_value: 300
        parameters:
          min_value: 0
          max_value: 2000
        optional: false
        description: Loss per mated connector pair in millidecibels. 0.3 dB is 300.
        order_weight: 1710
      - name: aging_margin_mdb
        kind: Number
        default_value: 1500
        parameters:
          min_value: 0
          max_value: 5000
        optional: false
        description: Reserved margin for repairs and ageing, in millidecibels. 1.5 dB is 1500.
        order_weight: 1720
    relationships:
      - name: fiber_type
        peer: OtnFiberType
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_fiber_type__spans
        order_weight: 800
      - name: site_a
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_span__site_a
        order_weight: 810
      - name: site_b
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_span__site_b
        order_weight: 820
      - name: conduit
        peer: OtnConduit
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_conduit__spans
        order_weight: 830
      - name: oms
        peer: OtnOpticalMultiplexSection
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_oms__spans
        order_weight: 840
      # The inverse of OtnRamanPump.span, on the same identifier. A budget walks a
      # section to its spans, so without this side no pump is visible on that walk.
      - name: raman_pumps
        peer: OtnRamanPump
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_span__raman_pumps
        order_weight: 850
      # The ports at each end of the glass. Declared on the span alone: the inverse
      # would put the field on every port kind and most ports terminate no span.
      - name: terminating_ports
        peer: OtnGenericPort
        label: Ports at the ends of this span
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_span__terminating_ports
        order_weight: 950

  - name: OpticalMultiplexSection
    namespace: Otn
    description: ROADM to ROADM. Groups the ordered spans and inline amplifiers between two degrees.
    label: Optical multiplex section
    icon: mdi:ray-start-end
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    # No cached total length, total loss, span_count or hop_count.
    # Every reader sums them over the spans instead.
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
    relationships:
      - name: roadm_a
        peer: OtnRoadm
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_oms__roadm_a
        order_weight: 800
      - name: roadm_b
        peer: OtnRoadm
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_oms__roadm_b
        order_weight: 810
      - name: spans
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__spans
        order_weight: 900
      # One relationship per direction of travel rather than one holding both chains,
      # so which chain an amplifier is in is stored by the graph. Both stay optional.
      - name: amplifiers_a2b
        peer: OtnAmplifier
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__amplifiers_a2b
        order_weight: 910
      - name: amplifiers_b2a
        peer: OtnAmplifier
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__amplifiers_b2a
        order_weight: 920

  # Logical.
  - name: FrequencyGrid
    namespace: Otn
    description: One ITU-T G.694.1 channel. 50 GHz fixed grid, 191.35 to 196.10 THz.
    label: Frequency grid channel
    icon: mdi:sine-wave
    include_in_menu: true
    human_friendly_id:
      - channel_number__value
    order_by:
      - channel_number__value
    display_label: "Ch{{ channel_number__value }}"
    attributes:
      - name: channel_number
        kind: Number
        unique: true
        parameters:
          min_value: 1
          max_value: 96
        optional: false
        description: ITU channel number, 1 to 96. Channel 1 is 191.35 THz.
        order_weight: 1000
      # Stored rather than computed, so "which channel is 193.5 THz" is a range filter.
      - name: center_frequency_mhz
        kind: Number
        unique: true
        parameters:
          min_value: 191350000
          max_value: 196100000
        optional: false
        description: Centre frequency in MHz. Channel n is 191350000 + (n - 1) x 50000.
        order_weight: 1500
      - name: center_frequency_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_frequency_mhz__value is not none %}{{ center_frequency_mhz__value / 1000000 }} THz{% endif %}
        optional: true
        description: Centre frequency in THz. Byte-identical to the optical-port rendering.
        order_weight: 1510
    # The inverse of OtnOpticalCarrier.channel, on the same identifier.
    relationships:
      - name: carriers
        peer: OtnOpticalCarrier
        label: Carriers on this channel
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_carrier__channel
        order_weight: 900

  # The coarse plan is a separate kind so that `OtnOpticalCarrier.channel`, which
  # peers `OtnFrequencyGrid` alone, refuses a mispointed carrier at write time.
  - name: CwdmChannel
    namespace: Otn
    description: One ITU-T G.694.2 coarse wavelength. 20 nm spacing, 1271 to 1611 nm.
    label: CWDM wavelength
    icon: mdi:palette-swatch-variant
    include_in_menu: true
    human_friendly_id:
      - center_wavelength_nm__value
    order_by:
      - center_wavelength_nm__value
    display_label: "{{ center_wavelength_nm__value }} nm"
    attributes:
      - name: center_wavelength_nm
        kind: Number
        unique: true
        parameters:
          min_value: 1271
          max_value: 1611
        optional: false
        description: Nominal central wavelength in nm. Wavelength n is 1271 + (n - 1) x 20.
        order_weight: 1000
      - name: band
        kind: Dropdown
        choices:
          - name: o
            label: O band
            color: "#607d8b"
          - name: e
            label: E band
            color: "#795548"
          - name: s
            label: S band
            color: "#009688"
          - name: c
            label: C band
            color: "#2196f3"
          - name: l
            label: L band
            color: "#9c27b0"
        optional: false
        description: ITU band. Only the two C-band wavelengths sit in the erbium window.
        order_weight: 1100

  - name: OpticalMode
    namespace: Otn
    description: What a transponder or coherent pluggable can do. Reach and required OSNR are data, not assumptions.
    label: Optical mode
    icon: mdi:waveform
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9 .+/_-]+$"
        optional: false
        order_weight: 1000
      - name: mode_class
        kind: Dropdown
        default_value: transponder
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: pluggable
            label: Coherent pluggable
            color: "#4caf50"
        optional: false
        description: Two values, and the pluggable-reach report filters on it.
        order_weight: 1100
      - name: modulation
        kind: Text
        enum:
          - DP-QPSK
          - DP-8QAM
          - DP-16QAM
          - DP-64QAM
        optional: false
        order_weight: 1200
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1300
      - name: line_rate_gbps
        kind: Number
        parameters:
          min_value: 1
          max_value: 1600
        optional: false
        description: Client-side capacity in Gbps. Already a whole number in its natural unit.
        order_weight: 1500
      - name: baud_mbaud
        kind: Number
        parameters:
          min_value: 1000
          max_value: 200000
        optional: false
        description: Symbol rate in megabaud. 59.84 GBd is 59840. Sets the spectral width.
        order_weight: 1600
      - name: required_osnr_mdb
        kind: Number
        parameters:
          min_value: 5000
          max_value: 40000
        optional: false
        description: OSNR needed at the receiver, in millidecibels. 26 dB is 26000.
        order_weight: 1700
      - name: required_osnr_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if required_osnr_mdb__value is not none %}{{ required_osnr_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Required OSNR in dB. Read-only, derived from required_osnr_mdb.
        order_weight: 1710
      - name: cd_tolerance_fs_per_nm
        kind: Number
        parameters:
          min_value: 0
          max_value: 200000000
        optional: false
        description: Chromatic dispersion the receiver compensates, in fs/nm. 100000 ps/nm is 100000000.
        order_weight: 1800
      - name: nominal_reach_m
        kind: Number
        parameters:
          min_value: 0
          max_value: 5000000
        optional: false
        description: Vendor-quoted reach in metres. A starting point for the budget, not a guarantee.
        order_weight: 1900
      - name: nominal_reach_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if nominal_reach_m__value is not none %}{{ nominal_reach_m__value / 1000 }} km{% endif %}
        optional: true
        description: Nominal reach in km. Read-only, derived from nominal_reach_m.
        order_weight: 1910
      - name: fec_type
        kind: Text
        default_value: SD-FEC
        enum:
          - none
          - GFEC
          - SD-FEC
          - cFEC
          - oFEC
        optional: false
        order_weight: 1950
      - name: fec_latency_ns
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 100000
        optional: false
        description: Encoder and decoder latency in nanoseconds. Small next to propagation, but not zero.
        order_weight: 1960
    # The inverse of OtnOpticalCarrier.optical_mode, on the same identifier.
    relationships:
      - name: carriers
        peer: OtnOpticalCarrier
        label: Carriers using this mode
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_carrier__optical_mode
        order_weight: 900

  - name: ClientSignal
    namespace: Otn
    description: What a customer hands over, and the container it maps into.
    label: Client signal
    icon: mdi:import
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 32
          regex: "^[A-Za-z0-9./_-]+$"
        optional: false
        order_weight: 1000
      - name: alias
        kind: Text
        parameters:
          max_length: 32
        optional: true
        description: The SONET name where one exists. STM-16 is OC-48.
        order_weight: 1100
      - name: layer
        kind: Dropdown
        choices:
          - name: ethernet
            label: Ethernet
            color: "#2196f3"
          - name: sdh
            label: SDH / SONET
            color: "#9c27b0"
          - name: pdh
            label: PDH
            color: "#795548"
          - name: fibre_channel
            label: Fibre Channel
            color: "#ff9800"
          - name: infiniband
            label: InfiniBand
            color: "#673ab7"
        optional: false
        description: Grouping the catalog by layer is the first thing a reader does.
        order_weight: 1200
      - name: auto_selectable
        kind: Boolean
        # Fails closed: a row added without a decision is unreachable by the
        # automatic path until somebody writes true.
        default_value: false
        optional: false
        description: May the rate rule pick this signal when a service states none.
        order_weight: 1250
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1300
      - name: bit_rate_kbps
        kind: Number
        parameters:
          min_value: 64
          max_value: 1600000000
        optional: false
        description: Nominal line rate in kbps. E1 is 2048, 100GBASE-LR4 is 103100000.
        order_weight: 1500
      - name: bit_rate_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if bit_rate_kbps__value is none %}{% elif bit_rate_kbps__value
            >= 1000000 %}{{ bit_rate_kbps__value / 1000000 }} Gbps{% else %}{{
            bit_rate_kbps__value / 1000 }} Mbps{% endif %}
        optional: true
        description: Bit rate in Mbps below one gigabit, Gbps at or above it.
        order_weight: 1510
      - name: default_container_type
        kind: Text
        enum:
          - ODU0
          - ODU1
          - ODU2
          - ODU2e
          - ODU3
          - ODU4
          - ODUC1
          - ODUC2
          - ODUC3
          - ODUC4
          - ODUflex
          - VC-12
          - VC-4
          - STM-N
        optional: false
        description: The first step of the mapping chain, not the last. E1 maps into VC-12, not ODU1.
        order_weight: 1600
      - name: default_mapping
        kind: Text
        enum:
          - GMP
          - BMP
          - AMP
        optional: false
        description: ITU-T G.709 mapping procedure. Generic, bit-synchronous or asynchronous.
        order_weight: 1700
    relationships:
      - name: containers
        peer: OtnContainer
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_client_signal__containers
        order_weight: 900
      # The inverse of OtnService.client_signal, on the same identifier.
      - name: services
        peer: OtnService
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_service__client_signal
        order_weight: 910

  - name: Container
    namespace: Otn
    description: ODU or SDH virtual container. The digital adaptation layer between a client and a wavelength.
    label: Container
    icon: mdi:package-variant-closed
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      # OtnClientSignal.default_container_type's fourteen values plus ODUC6 and
      # ODUC8, which are line containers no client maps directly into.
      - name: odu_type
        kind: Text
        enum:
          - ODU0
          - ODU1
          - ODU2
          - ODU2e
          - ODU3
          - ODU4
          - ODUC1
          - ODUC2
          - ODUC3
          - ODUC4
          - ODUC6
          - ODUC8
          - ODUflex
          - VC-12
          - VC-4
          - STM-N
        optional: false
        order_weight: 1100
      - name: mapping_mode
        kind: Text
        default_value: GMP
        enum:
          - GMP
          - BMP
          - AMP
        optional: false
        order_weight: 1200
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1300
      # A circuit is its containers ordered by this, as its wavelengths are its
      # paths ordered by OtnOpticalPath.segment_sequence.
      - name: segment_sequence
        kind: Number
        default_value: 1
        parameters:
          min_value: 1
          max_value: 50
        optional: false
        description: Which segment of its circuit this container rides. 1 for a circuit that spans one wavelength.
        order_weight: 1400
      - name: tributary_slots
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 640
        optional: false
        description: Slots this container occupies in its parent. An ODU2 in an ODU4 takes 8.
        order_weight: 1500
      - name: tributary_slot_capacity
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 640
        optional: false
        description: Slots this container offers to its children. An ODU4 offers 80.
        order_weight: 1600
    # The two `direction` keys are mandatory. Both sides default to bidirectional,
    # which collides on a shared identifier and is rejected at load time.
    relationships:
      # Optional, because a container may be multiplexed into a parent that holds the
      # carrier.
      - name: carrier
        peer: OtnOpticalCarrier
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_carrier__containers
        order_weight: 790
      - name: client_signal
        peer: OtnClientSignal
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_client_signal__containers
        order_weight: 800
      - name: parent_container
        peer: OtnContainer
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_container__children
        direction: outbound
        order_weight: 810
      # Only a client container carries one. A line container leaves it empty on
      # purpose: it belongs to a wavelength that several services may share.
      - name: service
        # Stored, not derived. OtnOpticalCarrier.optical_path is cardinality many
        # since grooming, so walking back through the carrier yields every service on
        # the wavelength rather than the one that owns this container.
        peer: OtnService
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_service__containers
        order_weight: 820
      - name: child_containers
        peer: OtnContainer
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_container__children
        direction: inbound
        order_weight: 900

  # Devices.
  - name: Router
    namespace: Otn
    description: IP router. Light terminates here, so it contributes no insertion loss.
    label: Router
    icon: mdi:router
    include_in_menu: true
    menu_placement: OtnGenericDevice
    inherit_from:
      - OtnGenericDevice

  - name: Transponder
    namespace: Otn
    description: Client to DWDM line adaptation.
    label: Transponder
    icon: mdi:transit-connection-variant
    include_in_menu: true
