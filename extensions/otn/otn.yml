  - name: Amplifier
    namespace: Otn
    description: Inline, booster or pre-amplifier.
    label: Amplifier
    icon: mdi:amplifier
    include_in_menu: false
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    # oms_sequence is stored because Infrahub relationships carry no order, so
    # OtnOpticalMultiplexSection.amplifiers hands back a set. The budget cannot
    # be walked over a set: the loss ahead of an amplifier is the loss of
    # whatever sits immediately before it. OtnFiberSpan carries an explicit
    # position for the same reason.
    attributes:
      - name: element_class
        kind: Dropdown
        default_value: amplifier
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800
      # 3000 is the quantum-limited floor for an EDFA and 10000 is a bad one, so
      # the bounds bracket the whole plausible range rather than this dataset's.
      - name: noise_figure_mdb
        kind: Number
        default_value: 4000
        parameters:
          min_value: 3000
          max_value: 10000
        optional: false
        description: Noise figure in millidecibels. 4.0 dB is 4000. Sets the ASE this stage adds.
        order_weight: 1520
      - name: noise_figure_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if noise_figure_mdb__value is not none %}{{ noise_figure_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Noise figure in dB. Read-only, derived from noise_figure_mdb.
        order_weight: 1530
      - name: gain_mdb
        kind: Number
        default_value: 22000
        parameters:
          min_value: 0
          max_value: 40000
        optional: false
        description: Gain in millidecibels. 22.0 dB is 22000. Must cover the loss ahead of the input.
        order_weight: 1540
      - name: gain_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if gain_mdb__value is not none %}{{ gain_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Gain in dB. Read-only, derived from gain_mdb.
        order_weight: 1550
      # No direction attribute. An amplifier hut is bidirectional and this model
      # gives each direction its own object, but which chain an object is in is
      # the relationship holding it, oms_a2b or oms_b2a, and an attribute
      # restating that would be a second copy that can disagree with the first.
      #
      # It does two jobs and both are its own. It orders a chain that the
      # relationship has already identified, so a sorted chain is in traversal
      # order and the engine never reverses one. And it fixes which member of
      # that chain is which: position 1 is the booster, position N+1 is the
      # pre-amplifier, and amplifier k feeds span k of its own walk.
      - name: oms_sequence
        kind: Number
        parameters:
          min_value: 1
          # 51, not 50: a section with N spans carries N+1 amplifiers per
          # direction, and the span attribute caps N at 50.
          max_value: 51
        # Mandatory, and with no default_value on purpose. A default of 1 would
        # let a new amplifier take a silent position at the head of its chain,
        # collide with the real first amplifier, and sort stably into a wrong
        # answer rather than raising.
        #
        # Not unique, and it cannot be: a uniqueness constraint cannot reference
        # an optional relationship, and the section relationships have to stay
        # optional so an amplifier is creatable before its section exists.
        # Rejecting duplicate positions is a test's job.
        optional: false
        description: Position in this amplifier's own chain, counting along the direction it amplifies.
        order_weight: 1560
    # The two inverses of the section's two amplifier relationships, each on the
    # matching identifier. Exactly one is set on any amplifier, and which one it
    # is answers the direction question the deleted attribute used to answer.
    #
    # Two, not one, because one relationship cannot be the inverse of two
    # identifiers. The alternative was dropping the amplifier's section
    # relationship entirely and reaching the section by server-side filter, and
    # that was rejected: an amplifier page is a page an operator lands on, and
    # "which section and which way" is what it is for. The honest accounting is
    # that this trades one attribute for one relationship and the schema does
    # not get shorter.
    relationships:
      - name: oms_a2b
        peer: OtnOpticalMultiplexSection
        kind: Attribute
        cardinality: one
        # Both optional, because an amplifier is creatable before its section
        # exists.
        optional: true
        identifier: otn_oms__amplifiers_a2b
        on_delete: no-action
        order_weight: 950
      - name: oms_b2a
        peer: OtnOpticalMultiplexSection
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_oms__amplifiers_b2a
        on_delete: no-action
        order_weight: 960

