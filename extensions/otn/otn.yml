    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    # No cached total length, total loss, span_count or hop_count.
    # Every reader sums them over the spans instead.
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: active
            label: Active
            color: "#4caf50"
          - name: standby
            label: Standby
            color: "#00bcd4"
          - name: maintenance
            label: Maintenance
            color: "#ffc107"
          - name: failed
            label: Failed
            color: "#ff5722"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
