        optional: false
        order_weight: 1000
      - name: owner
        kind: Text
        parameters:
          max_length: 64
        optional: true
        description: Who owns the trench. Often not the network operator.
        order_weight: 1100
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1200
      - name: status
        kind: Dropdown
