        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__spans
        order_weight: 900
      # One relationship per direction of travel rather than one holding both chains,
      # so which chain an amplifier is in is stored by the graph. Both stay optional.
      - name: amplifiers_a2b
        peer: OtnAmplifier
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__amplifiers_a2b
        order_weight: 910
      - name: amplifiers_b2a
        peer: OtnAmplifier
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__amplifiers_b2a
        order_weight: 920

  # Logical.
  - name: FrequencyGrid
    namespace: Otn
    description: One ITU-T G.694.1 channel. 50 GHz fixed grid, 191.35 to 196.10 THz.
    label: Frequency grid channel
    icon: mdi:sine-wave
    include_in_menu: true
    menu_placement: OtnOpticalCarrier
    human_friendly_id:
      - center_frequency_mhz__value
    order_by:
      - center_frequency_mhz__value
    display_label: "Ch{{ channel_number__value }}"
    attributes:
      # Derived, not stored. In G.694.1 the frequency is normative and the channel
      # number is a naming convention over it, so storing both invites the two to
      # disagree. Computed attributes are Text or URL only, which is why the
      # frequency stays the stored Number and keeps its range filter.
      - name: channel_number
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_frequency_mhz__value is not none -%}
            {{ ((center_frequency_mhz__value - 191350000) // 50000) + 1 }}
            {%- endif %}
        optional: true
        description: ITU channel number, 1 to 96. Channel 1 is 191.35 THz. Derived from the centre frequency.
        order_weight: 1000
      # Stored rather than computed, so "which channel is 193.5 THz" is a range filter.
      - name: center_frequency_mhz
        kind: Number
        unique: true
        parameters:
          min_value: 191350000
          max_value: 196100000
        optional: false
        description: Centre frequency in MHz. Channel n is 191350000 + (n - 1) x 50000.
        order_weight: 1500
      - name: center_frequency_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_frequency_mhz__value is not none %}{{ center_frequency_mhz__value / 1000000 }} THz{% endif %}
        optional: true
        description: Centre frequency in THz. Byte-identical to the optical-port rendering.
        order_weight: 1510
      # Operators read the dense grid in nm as often as in THz. Derived from the
      # frequency with c = 299792458 m/s, so the two can never disagree.
      - name: center_wavelength_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_frequency_mhz__value is not none -%}
            {{ (299792458000 / center_frequency_mhz__value) | round(2) }} nm
            {%- endif %}
        optional: true
        description: Centre wavelength in nm, derived from the centre frequency.
        order_weight: 1520
    # The inverse of OtnOpticalCarrier.channel, on the same identifier.
    relationships:
      - name: carriers
        peer: OtnOpticalCarrier
        label: Carriers on this channel
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_carrier__channel
        order_weight: 900

  # The coarse plan is a separate kind so that `OtnOpticalCarrier.channel`, which
  # peers `OtnFrequencyGrid` alone, refuses a mispointed carrier at write time.
  - name: CwdmChannel
    namespace: Otn
    description: One ITU-T G.694.2 coarse wavelength. 20 nm spacing, 1271 to 1611 nm.
    label: CWDM wavelength
    icon: mdi:palette-swatch-variant
    include_in_menu: true
    menu_placement: OtnOpticalCarrier
    human_friendly_id:
      - center_wavelength_nm__value
    order_by:
      - center_wavelength_nm__value
    display_label: "{{ center_wavelength_nm__value }} nm"
    attributes:
      - name: center_wavelength_nm
        kind: Number
        unique: true
        parameters:
          min_value: 1271
          max_value: 1611
        optional: false
        description: Nominal central wavelength in nm. Wavelength n is 1271 + (n - 1) x 20.
        order_weight: 1000
      # Derived, not stored. The ITU bands are wavelength ranges, so the band a
      # coarse wavelength sits in follows from the wavelength itself.
      - name: band
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_wavelength_nm__value is not none -%}
            {% if center_wavelength_nm__value < 1360 -%}O
            {%- elif center_wavelength_nm__value < 1460 -%}E
            {%- elif center_wavelength_nm__value < 1530 -%}S
            {%- elif center_wavelength_nm__value < 1565 -%}C
            {%- else -%}L
            {%- endif %}
            {%- endif %}
        optional: true
        description: ITU band, derived from the wavelength. Only the two C-band wavelengths sit in the erbium window.
        order_weight: 1100

  - name: OpticalMode
    namespace: Otn
    description: What a transponder or coherent pluggable can do. Reach and required OSNR are data, not assumptions.
    label: Optical mode
    icon: mdi:waveform
    include_in_menu: true
    menu_placement: OtnOpticalCarrier
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9 .+/_-]+$"
        optional: false
        order_weight: 1000
      - name: mode_class
        kind: Dropdown
        default_value: transponder
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: pluggable
            label: Coherent pluggable
            color: "#4caf50"
        optional: false
        description: Two values, and the pluggable-reach report filters on it.
        order_weight: 1100
      - name: modulation
        kind: Dropdown
        choices:
          - name: DP-QPSK
            label: DP-QPSK
            description: Dual-polarisation QPSK. Four bits per symbol, the longest reach of the four.
            color: "#2196f3"
          - name: DP-8QAM
            label: DP-8QAM
            description: Dual-polarisation 8QAM. Six bits per symbol.
            color: "#4caf50"
          - name: DP-16QAM
            label: DP-16QAM
            description: Dual-polarisation 16QAM. Eight bits per symbol.
            color: "#ff9800"
          - name: DP-64QAM
            label: DP-64QAM
            description: Dual-polarisation 64QAM. Twelve bits per symbol, the shortest reach.
            color: "#e91e63"
        optional: false
        order_weight: 1200
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1300
      - name: line_rate_gbps
        kind: Number
        parameters:
          min_value: 1
          max_value: 1600
        optional: false
        description: Client-side capacity in Gbps. Already a whole number in its natural unit.
        order_weight: 1500
      - name: baud_mbaud
        kind: Number
        parameters:
          min_value: 1000
          max_value: 200000
        optional: false
        description: Symbol rate in megabaud. 59.84 GBd is 59840. Sets the spectral width.
        order_weight: 1600
      - name: required_osnr_mdb
        kind: Number
        parameters:
          min_value: 5000
          max_value: 40000
        optional: false
        description: OSNR needed at the receiver, in millidecibels. 26 dB is 26000.
        order_weight: 1700
      - name: required_osnr_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if required_osnr_mdb__value is not none %}{{ required_osnr_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Required OSNR in dB. Read-only, derived from required_osnr_mdb.
        order_weight: 1710
      - name: cd_tolerance_fs_per_nm
        kind: Number
        parameters:
          min_value: 0
          max_value: 200000000
        optional: false
        description: Chromatic dispersion the receiver compensates, in fs/nm. 100000 ps/nm is 100000000.
        order_weight: 1800
      - name: nominal_reach_m
        kind: Number
        parameters:
          min_value: 0
          max_value: 5000000
        optional: false
        description: Vendor-quoted reach in metres. A starting point for the budget, not a guarantee.
        order_weight: 1900
      - name: nominal_reach_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if nominal_reach_m__value is not none %}{{ nominal_reach_m__value / 1000 }} km{% endif %}
        optional: true
        description: Nominal reach in km. Read-only, derived from nominal_reach_m.
        order_weight: 1910
      - name: fec_type
        kind: Dropdown
        default_value: SD-FEC
        choices:
          - name: none
            label: None
            description: No forward error correction.
            color: "#9e9e9e"
          - name: GFEC
            label: GFEC
            description: The G.709 Reed-Solomon code. Hard decision, about 7 percent overhead.
            color: "#2196f3"
          - name: SD-FEC
            label: SD-FEC
            description: Soft-decision FEC. More coding gain than a hard-decision code, at more latency.
            color: "#4caf50"
          - name: cFEC
            label: cFEC
            description: Concatenated FEC from OIF 400ZR. Less coding gain and less power than oFEC.
            color: "#00bcd4"
          - name: oFEC
            label: oFEC
            description: Open FEC from OpenROADM and OpenZR+. More coding gain, for longer reach.
            color: "#9c27b0"
        optional: false
        order_weight: 1950
      - name: fec_latency_ns
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 100000
        optional: false
        description: Encoder and decoder latency in nanoseconds. Small next to propagation, but not zero.
        order_weight: 1960
    # The inverse of OtnOpticalCarrier.optical_mode, on the same identifier.
    relationships:
      - name: carriers
        peer: OtnOpticalCarrier
        label: Carriers using this mode
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_carrier__optical_mode
        order_weight: 900

  - name: ClientSignal
