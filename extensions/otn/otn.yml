---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
# Optical transport network. Ported from opsmill/infrahub-demo-otn at e98be9b.
# Devices here are optical roles; OtnGenericDevice.dcim_device links one to its
# DcimPhysicalDevice record. See the reference page for what is out of scope.
# A `cardinality: one` relationship earns an inverse only where the peer's own page
# is what the reverse list is for; otherwise use a server-side filter on the forward
# side. An inverse must reuse the forward identifier, or it reads an empty list.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  # Base generics. Generics cannot inherit generics, so a concrete node lists
  # several rather than stacking them.
  - name: GenericPort
    namespace: Otn
    description: Any port on any OTN device. The connection surface of the network.
    label: Port
    icon: mdi:ethernet
    include_in_menu: false
    human_friendly_id:
      - device__name__value
      - name__value
    order_by:
      - name__value
    display_label: "{{ device__name__value }} {{ name__value }}"
    uniqueness_constraints:
      - ["device", "name__value"]
    attributes:
      - name: name
        kind: Text
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._/-]+$"
        optional: false
        description: Port identifier as the vendor labels it, such as 1/1/1.
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      - name: role
        kind: Dropdown
        default_value: spare
        choices:
          - name: client
            label: Client
            color: "#4caf50"
          - name: line
            label: Line
            color: "#2196f3"
          - name: add_drop
            label: Add/drop
            color: "#9c27b0"
          - name: degree
            label: Degree
            color: "#673ab7"
          - name: express
            label: Express
            description: A degree-to-degree pass-through. Wavelengths cross the node without adding or dropping.
            color: "#00bcd4"
          - name: booster
            label: Booster
            color: "#ff9800"
          - name: preamp
            label: Pre-amplifier
            color: "#ffc107"
          - name: tributary
            label: Tributary
            color: "#795548"
          - name: spare
            label: Spare
            color: "#9e9e9e"
          - name: monitor
            label: Monitor
            description: A monitoring interface, not a traffic-carrying port.
            color: "#607d8b"
        optional: false
        order_weight: 1100
      - name: enabled
        kind: Boolean
        default_value: true
        optional: false
        order_weight: 1200
      - name: admin_state
        kind: Dropdown
        default_value: up
        choices:
          - name: up
            label: Up
            color: "#4caf50"
          - name: down
            label: Down
            color: "#f44336"
          - name: testing
            label: Testing
            color: "#ff9800"
        optional: false
        description: RFC 2863 ifAdminStatus. What the operator asked for.
        order_weight: 1300
      - name: oper_state
        kind: Dropdown
        default_value: down
        choices:
          - name: up
            label: Up
            color: "#4caf50"
          - name: down
            label: Down
            color: "#f44336"
          - name: testing
            label: Testing
            color: "#ff9800"
          - name: dormant
            label: Dormant
            color: "#2196f3"
          - name: unknown
            label: Unknown
            color: "#9e9e9e"
        optional: false
        description: RFC 2863 ifOperStatus subset. What the port actually does.
        order_weight: 1400
    relationships:
      - name: device
        peer: OtnGenericDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: otn_device__ports
        order_weight: 800
      # The inverses of OtnPathHop.ingress_port and .egress_port. Together they let a
      # ROADM's switching state be read from its ports, rather than only by walking
      # every service's path.
      - name: hops_ingress
        peer: OtnPathHop
        label: Hops entering here
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_hop__ingress_port
        order_weight: 910
      - name: hops_egress
        peer: OtnPathHop
        label: Hops leaving here
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_hop__egress_port
        order_weight: 920
      # No port-to-port adjacency attribute lives here. In the G.872 layering a
      # section owns its adjacency and a port only terminates it, so intra-site
      # jumpers are a DcimCable across the `connector` every port kind inherits from
      # DcimEndpoint, inter-site plant is OtnFiberSpan.terminating_ports, and where
      # the light goes is OtnOpticalPath. A `connected_to` edge here would be a
      # fourth answer to a question those three already answer.

  - name: OpticalElement
    namespace: Otn
    description: Anything light passes through and loses power in.
    label: Optical element
    icon: mdi:blur-linear
    include_in_menu: false
    # No order_by and no human_friendly_id: both resolve against this generic's own
    # attributes, and it declares none. Every member kind carries its own order_by.
    attributes:
      - name: insertion_loss_mdb
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 60000
        optional: false
        description: Insertion loss in millidecibels, 0 to 60 dB. No Float kind exists.
        order_weight: 1500
      - name: insertion_loss_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if insertion_loss_mdb__value is not none %}{{ insertion_loss_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Insertion loss in dB. Read-only, derived from insertion_loss_mdb.
        order_weight: 1510
      - name: vendor
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1600
      - name: model
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1700

  # What an optical multiplex section is allowed to terminate on. A ROADM switches
  # channels and a passive mux filters them, but either one bounds a section, so a
  # fixed point-to-point DWDM system with no ROADM in it is still modellable. The
  # generic stays a marker plus the two inverses; a device's own fields live on its
  # kind.
  - name: OmsEndpoint
    namespace: Otn
    description: A device that can terminate an optical multiplex section.
    label: OMS endpoint
    icon: mdi:ray-start-end
    include_in_menu: false
    relationships:
      - name: sections_a
        peer: OtnOpticalMultiplexSection
        label: Sections (A end)
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__endpoint_a
        order_weight: 960
      - name: sections_b
        peer: OtnOpticalMultiplexSection
        label: Sections (B end)
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_oms__endpoint_b
        order_weight: 970

  - name: GenericDevice
    namespace: Otn
    description: Anything racked at a site.
    label: Device
    icon: mdi:server
    # Carries the Devices entry in the sidebar. The ten device kinds nest under it.
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: provisioning
            label: Provisioning
            color: "#ff9800"
          - name: active
            label: Active
            color: "#4caf50"
          - name: maintenance
            label: Maintenance
            color: "#ffc107"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
        optional: false
        order_weight: 1100
      - name: role
        kind: Dropdown
        choices:
          - name: core
            label: Core
            color: "#3f51b5"
          - name: edge
            label: Edge
            color: "#2196f3"
          - name: access
            label: Access
            color: "#00bcd4"
          - name: passive
            label: Passive
            color: "#9e9e9e"
        optional: false
        order_weight: 1200
    relationships:
      # Not a Parent: Parent would force optional: false, and a device has to be
      # creatable before its site record exists.
      - name: site
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_site__devices
        order_weight: 800
      # An OTN device names the optical role; DcimPhysicalDevice names the physical
      # asset. This edge joins the two records for one box rather than duplicating
      # it, and it is also the route to a rack elevation: the physical record carries
      # `position`, `rack_face` and a `location` that may be a LocationRack. Optional,
      # because a deployment with no Dcim inventory is equally valid.
      - name: dcim_device
        peer: DcimPhysicalDevice
        label: Physical device record
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_device__dcim_device
        order_weight: 940
      - name: ports
        peer: OtnGenericPort
        kind: Component
        cardinality: many
        optional: true
        identifier: otn_device__ports
        on_delete: cascade
        order_weight: 900

  - name: OpticalPort
    namespace: Otn
    description: Optical-specific port properties.
    label: Optical port
    icon: mdi:lightbulb-on-outline
    include_in_menu: false
    attributes:
      # Optional because a grey router port is not on the C-band grid.
      - name: center_frequency_mhz
        kind: Number
        parameters:
          min_value: 191350000
          max_value: 196100000
        optional: true
        description: ITU-T G.694.1 centre frequency in MHz. No Float kind exists.
        order_weight: 1600
      - name: center_frequency_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_frequency_mhz__value is not none %}{{ center_frequency_mhz__value / 1000000 }} THz{% endif %}
        optional: true
        description: Centre frequency in THz. Empty on a grey port, which has none.
        order_weight: 1610
      - name: tx_power_mdbm
        kind: Number
        parameters:
          min_value: -30000
          max_value: 30000
        optional: true
        description: Transmit power in milli-dBm, -30 to +30 dBm.
        order_weight: 1700
      - name: tx_power_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if tx_power_mdbm__value is not none %}{{ tx_power_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Transmit power in dBm. Read-only, derived from tx_power_mdbm.
        order_weight: 1710
      - name: rx_sensitivity_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 10000
        optional: true
        description: Receiver sensitivity in milli-dBm, -40 to +10 dBm.
        order_weight: 1800
      - name: rx_sensitivity_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if rx_sensitivity_mdbm__value is not none %}{{ rx_sensitivity_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Receiver sensitivity in dBm. Derived from rx_sensitivity_mdbm.
        order_weight: 1810
      # A Dropdown rather than an enum, so a connector carries a label, a colour and
      # a sentence. The list is declared once here, and every kind inheriting this
      # generic gets it.
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
      # Return loss is a polish property, not a connector property: an LC comes in
      # all three. Optional, so ports loaded before it existed stay valid.
      - name: polish
        kind: Dropdown
        choices:
          - name: UPC
            label: UPC
            description: Ultra physical contact. Blue housing, about 50 dB return loss.
            color: "#2196f3"
          - name: APC
            label: APC
            description: Angled physical contact. Green housing, about 65 dB return loss.
            color: "#4caf50"
          - name: PC
            label: PC
            description: Physical contact. The oldest polish, about 35 dB return loss.
            color: "#ff9800"
          - name: none
            label: None
            description: No polished endface, such as a fusion splice.
            color: "#9e9e9e"
        optional: true
        description: Endface polish. Mating an APC to a UPC costs about 0.5 dB and reflects.
        order_weight: 1910

  - name: CopperPort
    namespace: Otn
    description: Electrical port properties for G.703 tributaries.
    label: Copper port
    icon: mdi:cable-data
    include_in_menu: false
    attributes:
      # kbps, not Mbps: as integer Mbps, E1 at 2.048 and T1 at 1.544 both round to 2.
      - name: speed_kbps
        kind: Number
        default_value: 2048
        parameters:
          min_value: 64
          max_value: 400000000
        optional: false
        description: Line rate in kbps. E1 is 2048, T1 is 1544, STM-1 is 155520.
        order_weight: 1600
      - name: impedance_ohm
        kind: Number
        default_value: 120
        parameters:
          min_value: 50
          max_value: 600
        optional: false
        description: Nominal impedance in ohms. 120 for E1 pair, 75 for coax.
        order_weight: 1700
      - name: connector_type
        kind: Dropdown
        default_value: RJ48
        choices:
          - name: BNC
            label: BNC
            description: Coaxial bayonet connector, used for 75 ohm E1 and STM-1.
            color: "#ff9800"
          - name: RJ48
            label: RJ48
            description: Eight-position jack for 120 ohm balanced E1 and T1 pairs.
            color: "#2196f3"
          - name: RJ45
            label: RJ45
            description: Eight-position jack for Ethernet management and console.
            color: "#4caf50"
        optional: false
        order_weight: 1900

nodes:
  # Ports.
  - name: RouterPort
    namespace: Otn
    description: Grey optics on an IP router. Not on the C-band grid.
    label: Router port
    icon: mdi:ethernet
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort
    relationships:
      # The module fitted in this port, and the inverse of the `otn_port` added to
      # DcimGenericTransceiver below. Both ends are cardinality one, so a second
      # module in one port is refused at write time. Declared only on the three
      # concrete kinds that have a cage.
      - name: transceiver
        peer: DcimGenericTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        order_weight: 960

  - name: ClientPort
    namespace: Otn
    description: Transponder client side. Where grey light arrives.
    label: Client port
    icon: mdi:lan-connect
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort
    relationships:
      - name: transceiver
        peer: DcimGenericTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        order_weight: 960

  - name: LinePort
    namespace: Otn
    description: Transponder DWDM line side. Where coloured light leaves.
    label: Line port
    icon: mdi:transit-connection
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort
    relationships:
      # The wavelength this port terminates. The deletion boundary stops here: a
      # carrier is a spectrum allocation on a route, terminated at both of its ends,
      # so cascading from one port would delete the containers and the customer
      # services groomed into them.
      - name: carrier
        peer: OtnOpticalCarrier
        label: Wavelength this port terminates
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_carrier__line_ports
        order_weight: 850
      - name: transceiver
        peer: DcimGenericTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        order_weight: 960

  - name: RoadmAddDropPort
    namespace: Otn
    description: Local add and drop on a ROADM.
    label: ROADM add/drop port
    icon: mdi:call-split
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort

  - name: RoadmDegreePort
    namespace: Otn
    description: Line-facing degree on a ROADM. One per direction.
    label: ROADM degree port
    icon: mdi:compass-outline
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: direction
        kind: Dropdown
        choices:
          - name: north
            label: North
            color: "#2196f3"
          - name: south
            label: South
            color: "#4caf50"
          - name: east
            label: East
            color: "#ff9800"
          - name: west
            label: West
            color: "#9c27b0"
          - name: express
            label: Express
            description: Faces another degree rather than the outside world. Nothing adds or drops here.
            color: "#00bcd4"
          - name: local
            label: Local
            description: Faces add/drop equipment in the same building instead of a line route.
            color: "#9e9e9e"
        optional: true
        description: How operators label this degree. Until now the port name was the only place to say it.
        order_weight: 1500
      - name: wavelength_capacity
        kind: Number
        parameters:
          min_value: 1
          max_value: 96
        optional: true
        description: Nameplate wavelengths this degree is rated to pass, such as 40, 80 or 96. Not a count in use.
        order_weight: 1520

  - name: AmplifierPort
    namespace: Otn
    description: Amplifier input or output.
    label: Amplifier port
    icon: mdi:amplifier
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort

  # One multiplexer channel and the common side it shares. Neither declares an
  # insertion loss: that belongs to the device, so a per-port figure would double
  # count.
  - name: MuxClientPort
    namespace: Otn
    description: One channel of a multiplexer. The side facing the transponder or router that lights it.
    label: Mux client port
    icon: mdi:import
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort
    # A channel port should bind exactly one of these two edges. Infrahub has no
    # cross-relationship constraint, so both neither and both are writable.
    # Unenforced here.
    relationships:
      - name: dwdm_channel
        peer: OtnFrequencyGrid
        label: Dense channel this port carries
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_frequency_grid__mux_client_ports
        order_weight: 850
      - name: cwdm_channel
        peer: OtnCwdmChannel
        label: Coarse wavelength this port carries
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_cwdm_channel__mux_client_ports
        order_weight: 860

  - name: MuxLinePort
    namespace: Otn
    description: The common side of a multiplexer, where the whole band leaves.
    label: Mux line port
    icon: mdi:export
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnOpticalPort

  - name: TributaryPort
    namespace: Otn
    description: E1 or T1 G.703 electrical tributary. The only copper port here.
    label: Tributary port
    icon: mdi:cable-data
    include_in_menu: false
    inherit_from:
      - DcimEndpoint
      - OtnGenericPort
      - OtnCopperPort

  # The part catalog. The fitted unit is a DcimGenericTransceiver, extended below.
  - name: TransceiverType
    namespace: Otn
    description: A pluggable optic part number and what it can be made to do.
    label: Transceiver type
    icon: mdi:chip
    include_in_menu: true
    menu_placement: OtnGenericDevice
    human_friendly_id:
      - part_number__value
    order_by:
      - part_number__value
    display_label: part_number__value
    attributes:
      - name: part_number
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._/+-]+$"
        optional: false
        description: Vendor part number, such as QDD-400G-ZRP-S.
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1200
      - name: form_factor
        kind: Dropdown
        choices:
          - name: QSFP-DD
            label: QSFP-DD
            description: Eight-lane double-density cage. What a coherent 400G pluggable takes.
            color: "#2196f3"
          - name: QSFP28
            label: QSFP28
            description: Four-lane cage, 100G grey optics.
            color: "#4caf50"
          - name: OSFP
            label: OSFP
            description: Eight-lane cage with a larger thermal budget than QSFP-DD.
            color: "#9c27b0"
          - name: CFP2-DCO
            label: CFP2-DCO
            description: Digital coherent optic. The DSP is in the module.
            color: "#ff9800"
          - name: CFP2-ACO
            label: CFP2-ACO
            description: Analogue coherent optic. The DSP is on the host card.
            color: "#ffc107"
          - name: SFP28
            label: SFP28
            description: Single-lane 25G cage.
            color: "#00bcd4"
          - name: SFP+
            label: SFP+
            description: Single-lane 10G cage.
            color: "#9e9e9e"
        optional: false
        description: The cage this part fits. It decides which ports can hold it.
        order_weight: 1300
      # A fixed-wavelength optic can only sit on the channel it was bought for.
      - name: tunable
        kind: Boolean
        default_value: false
        optional: false
        description: Whether the laser can be tuned across the grid or is fixed at one wavelength.
        order_weight: 1400
    relationships:
      # Optional, so a part number can be recorded before the mode catalog is
      # populated. Nothing compares this list against the mode a carrier actually
      # runs, so a module can be fitted to a carrier it cannot support.
      # Unenforced here.
      - name: supported_modes
        peer: OtnOpticalMode
        label: Modes this part can run
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_optical_mode__transceiver_types
        order_weight: 900
      - name: manufacturer
        peer: OrganizationManufacturer
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_transceiver_type__manufacturer
        order_weight: 1100

  # Plant.

  - name: FiberType
    namespace: Otn
    description: Single-mode fiber family. Attenuation, dispersion and group index at 1550 nm.
    label: Fiber type
    icon: mdi:cable-data
    include_in_menu: true
    menu_placement: OtnFiberSpan
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 32
          regex: "^[A-Za-z0-9.-]+$"
        optional: false
        description: ITU-T designation, such as G.652.D.
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      # One coefficient per fibre family, measured at 1550 nm. That is right for the
      # dense grid and understates the loss on a coarse wavelength.
      - name: attenuation_coefficient_mdb_per_km
        kind: Number
        parameters:
          min_value: 150
          max_value: 400
        optional: false
        description: Attenuation at 1550 nm in millidecibels per kilometre. 0.20 dB/km is 200. Wrong for CWDM.
        order_weight: 1500
      - name: attenuation_coefficient_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if attenuation_coefficient_mdb_per_km__value is not none %}{{ attenuation_coefficient_mdb_per_km__value
            / 1000 }} dB/km{% endif %}
        optional: true
        description: Attenuation in dB/km. Read-only, derived from attenuation_coefficient_mdb_per_km.
        order_weight: 1510
      - name: dispersion_fs_per_nm_km
        kind: Number
        parameters:
          min_value: 0
          max_value: 30000
        optional: false
        description: Chromatic dispersion at 1550 nm in femtoseconds per nm per km. 17 ps/nm/km is 17000.
        order_weight: 1600
      - name: dispersion_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if dispersion_fs_per_nm_km__value is not none %}{{ dispersion_fs_per_nm_km__value
            / 1000 }} ps/nm/km{% endif %}
        optional: true
        description: Dispersion in ps/nm/km. Read-only, derived from dispersion_fs_per_nm_km.
        order_weight: 1610
      - name: group_index_milli
        kind: Number
        default_value: 1468
        parameters:
          min_value: 1400
          max_value: 1500
        optional: false
        description: Group index at 1550 nm in milli-units. 1.468 is 1468. Sets propagation delay.
        order_weight: 1700
    relationships:
      - name: spans
        peer: OtnFiberSpan
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_fiber_type__spans
        order_weight: 900

  - name: Conduit
