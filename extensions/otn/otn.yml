  - name: FiberSpan
    namespace: Otn
    description: One amplifier-to-amplifier fiber section. Lossy, but not racked and not a device.
    label: Fiber span
    icon: mdi:vector-line
    include_in_menu: true
    inherit_from:
      - OtnOpticalElement
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    # The inherited insertion_loss_mdb stays at 0 on a span. A span's real loss is
    # length x attenuation plus splices, connectors and aging margin.
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        parameters:
          max_length: 256
        optional: true
        order_weight: 1100
      # Not unique: a uniqueness constraint cannot reference an optional relationship,
      # and oms stays optional so a span is creatable before its section exists.
      - name: oms_sequence
        kind: Number
        parameters:
          min_value: 1
          max_value: 50
        optional: true
        description: Position of this span within its optical multiplex section, counting from the A end.
        order_weight: 1200
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: active
            label: Active
            color: "#4caf50"
          - name: standby
            label: Standby
            color: "#00bcd4"
          - name: maintenance
            label: Maintenance
            color: "#ffc107"
          - name: failed
            label: Failed
            color: "#ff5722"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
        optional: false
        description: Lifecycle state of the span. A planned span is designed but not yet spliced through.
        order_weight: 1300
      # The extension's first DateTime. A commissioning or provisioning date is intended state,
      # written once by a person; a measurement moves on its own and stays in the management system.
      - name: commissioned_date
        kind: DateTime
        optional: true
        description: When the span was accepted into service. A recorded fact, not a reading.
        order_weight: 1400
      - name: length_m
        kind: Number
        parameters:
          min_value: 0
          max_value: 500000
        optional: false
        description: Route length in metres, not straight-line distance. 500 km is the practical ceiling.
        order_weight: 1500
      - name: length_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if length_m__value is not none %}{{ length_m__value / 1000 }} km{% endif %}
        optional: true
        description: Route length in km. Read-only, derived from length_m.
        order_weight: 1510
      - name: splice_count
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 500
        optional: false
        description: Fusion splices along the span. Roughly one per drum of cable.
        order_weight: 1600
      - name: splice_loss_mdb
        kind: Number
        default_value: 50
        parameters:
          min_value: 0
          max_value: 1000
        optional: false
        description: Loss per splice in millidecibels. 0.05 dB is 50.
        order_weight: 1610
      - name: connector_count
        kind: Number
        default_value: 2
        parameters:
          min_value: 0
          max_value: 20
        optional: false
        description: Mated connector pairs on the span, normally one at each end.
        order_weight: 1700
      - name: connector_loss_mdb
        kind: Number
        default_value: 300
        parameters:
          min_value: 0
          max_value: 2000
        optional: false
        description: Loss per mated connector pair in millidecibels. 0.3 dB is 300.
        order_weight: 1710
      - name: aging_margin_mdb
        kind: Number
        default_value: 1500
        parameters:
          min_value: 0
          max_value: 5000
        optional: false
        description: Reserved margin for repairs and ageing, in millidecibels. 1.5 dB is 1500.
        order_weight: 1720
    relationships:
      - name: fiber_type
        peer: OtnFiberType
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_fiber_type__spans
        order_weight: 800
      - name: site_a
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_span__site_a
        order_weight: 810
      - name: site_b
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: false
        identifier: otn_span__site_b
        order_weight: 820
      - name: conduit
        peer: OtnConduit
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_conduit__spans
        order_weight: 830
      - name: oms
        peer: OtnOpticalMultiplexSection
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_oms__spans
        order_weight: 840
      # The inverse of OtnRamanPump.span, on the same identifier. A budget walks a
      # section to its spans, so without this side no pump is visible on that walk.
      - name: raman_pumps
        peer: OtnRamanPump
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_span__raman_pumps
        order_weight: 850
      # The ports at each end of the glass. Declared on the span alone: the inverse
      # would put the field on every port kind and most ports terminate no span.
      - name: terminating_ports
        peer: OtnGenericPort
        label: Ports at the ends of this span
        kind: Attribute
        cardinality: many
        optional: true
        identifier: otn_span__terminating_ports
        order_weight: 950

  - name: OpticalMultiplexSection
    namespace: Otn
    description: Groups the ordered spans and inline amplifiers between two OMS endpoints.
    label: Optical multiplex section
    icon: mdi:ray-start-end
    include_in_menu: true
