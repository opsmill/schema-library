---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
# Optical transport network. Ported from opsmill/infrahub-demo-otn at e98be9b.
# Devices here are optical roles; OtnGenericDevice.dcim_device links one to its
# DcimPhysicalDevice record. See the reference page for what is out of scope.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  # ---- from schemas/otn_base.yml ----
  # None of them inherits from another. Infrahub's GenericSchemaWrite has no
  # inherit_from key at all, so a generic taxonomy is composed by listing several
  # generics on a concrete node, never by stacking them.
  - name: GenericPort
    namespace: Otn
    description: Any port on any OTN device. The connection surface of the network.
    label: Port
    icon: mdi:ethernet
    include_in_menu: false
    human_friendly_id:
      - device__name__value
      - name__value
    order_by:
      - name__value
    display_label: "{{ device__name__value }} {{ name__value }}"
    uniqueness_constraints:
      - ["device", "name__value"]
    attributes:
      - name: name
        kind: Text
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._/-]+$"
        optional: false
        description: Port identifier as the vendor labels it, such as 1/1/1.
        order_weight: 1000
      - name: role
        kind: Dropdown
        default_value: spare
        choices:
          - name: client
            label: Client
            color: "#4caf50"
          - name: line
            label: Line
            color: "#2196f3"
          - name: add_drop
            label: Add/drop
            color: "#9c27b0"
          - name: degree
            label: Degree
            color: "#673ab7"
          - name: booster
            label: Booster
            color: "#ff9800"
          - name: preamp
            label: Pre-amplifier
            color: "#ffc107"
          - name: tributary
            label: Tributary
            color: "#795548"
          - name: spare
            label: Spare
            color: "#9e9e9e"
          - name: monitor
            label: Monitor
            description: A monitoring interface, not a traffic-carrying port.
            color: "#607d8b"
        optional: false
        order_weight: 1100
      - name: enabled
        kind: Boolean
        default_value: true
        optional: false
        order_weight: 1200
      - name: admin_state
        kind: Dropdown
        default_value: up
        choices:
          - name: up
            label: Up
            color: "#4caf50"
          - name: down
            label: Down
            color: "#f44336"
          - name: testing
            label: Testing
            color: "#ff9800"
        optional: false
        description: RFC 2863 ifAdminStatus. What the operator asked for.
        order_weight: 1300
      - name: oper_state
        kind: Dropdown
        default_value: down
        choices:
          - name: up
            label: Up
            color: "#4caf50"
          - name: down
            label: Down
            color: "#f44336"
          - name: testing
            label: Testing
            color: "#ff9800"
          - name: dormant
            label: Dormant
            color: "#2196f3"
          - name: unknown
            label: Unknown
            color: "#9e9e9e"
        optional: false
        description: RFC 2863 ifOperStatus subset. What the port actually does.
        order_weight: 1400
    relationships:
      - name: device
        peer: OtnGenericDevice
        kind: Parent
        cardinality: one
        optional: false
        identifier: otn_device__ports
        order_weight: 800
      # Declared once. The relationship is symmetric and self-referencing, so
      # both ends are the same edge; the explicit identifier is what stops
      # Infrahub deriving a different string per side and splitting it into two
      # phantom one-way links. Immutable after the first load: changing the
      # identifier would orphan every connection already recorded.
      - name: connected_to
        peer: OtnGenericPort
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_port__connected_to
        on_delete: no-action
        order_weight: 900

  - name: OpticalElement
    namespace: Otn
    description: Anything light passes through and loses power in.
    label: Optical element
    icon: mdi:blur-linear
    include_in_menu: false
    # No order_by and no human_friendly_id. `order_by: [name__value]` is
    # rejected at load with "OtnOpticalElement.order_by: attribute 'name' not
    # defined on this schema": the key resolves against the generic's own
    # attributes, not against what its members inherit, and this generic
    # declares none. So a hop's element is written by UUID and no object file
    # can name one. Every member kind carries its own order_by.
    attributes:
      - name: insertion_loss_mdb
        kind: Number
        default_value: 0
        parameters:
          min_value: 0
          max_value: 60000
        optional: false
        description: Insertion loss in millidecibels, 0 to 60 dB. No Float kind exists.
        order_weight: 1500
      - name: insertion_loss_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if insertion_loss_mdb__value is not none %}{{ insertion_loss_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Insertion loss in dB. Read-only, derived from insertion_loss_mdb.
        order_weight: 1510
      - name: vendor
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1600
      - name: model
        kind: Text
        parameters:
          max_length: 64
        optional: true
        order_weight: 1700
      # Adding a choice here is not enough. Every kind that overrides this
      # attribute restates the whole list, and the server accepts a restatement
      # that is one choice short without a word; the divergence surfaces only
      # when an object writes the missing value. The tenth choice, `odu_switch`,
      # cost nine blocks and the list now lives in eleven: this one, the nine
      # overrides in otn_devices.yml, and the span's in otn_plant.yml. The pinned
      # list in `tests/unit/test_schema_contract.py` is the only thing that will
      # tell you a block was missed.
      - name: element_class
        kind: Dropdown
        choices:
          - name: transponder
            label: Transponder
            color: "#2196f3"
          - name: roadm
            label: ROADM
            color: "#9c27b0"
          - name: amplifier
            label: Amplifier
            color: "#ff9800"
          - name: mux_demux
            label: Mux/demux
            color: "#00bcd4"
          - name: patch_panel
            label: Patch panel
            color: "#9e9e9e"
          - name: fiber_span
            label: Fiber span
            color: "#4caf50"
          - name: splitter
            label: Splitter
            color: "#8bc34a"
          - name: attenuator
            label: Attenuator
            color: "#795548"
          - name: raman_pump
            label: Raman pump
            color: "#e91e63"
          - name: odu_switch
            label: ODU switch
            color: "#673ab7"
        optional: false
        description: What the optical budget engine branches on.
        order_weight: 1800

  - name: GenericDevice
    namespace: Otn
    description: Anything racked at a site.
    label: Device
    icon: mdi:server
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        parameters:
          max_length: 64
          regex: "^[A-Za-z0-9._-]+$"
        optional: false
        order_weight: 1000
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: planned
            label: Planned
            color: "#2196f3"
          - name: provisioning
            label: Provisioning
            color: "#ff9800"
          - name: active
            label: Active
            color: "#4caf50"
          - name: maintenance
            label: Maintenance
            color: "#ffc107"
          - name: decommissioned
            label: Decommissioned
            color: "#9e9e9e"
        optional: false
        order_weight: 1100
      - name: role
        kind: Dropdown
        choices:
          - name: core
            label: Core
            color: "#3f51b5"
          - name: edge
            label: Edge
            color: "#2196f3"
          - name: access
            label: Access
            color: "#00bcd4"
          - name: passive
            label: Passive
            color: "#9e9e9e"
        optional: false
        order_weight: 1200
    relationships:
      # Not a Parent: Parent would force optional: false, and a device has to be
      # creatable before its site record exists.
      - name: site
        peer: LocationSite
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_site__devices
        on_delete: no-action
        order_weight: 800
      - name: ports
        peer: OtnGenericPort
        kind: Component
        cardinality: many
        optional: true
        identifier: otn_device__ports
        on_delete: cascade
        order_weight: 900

  - name: OpticalPort
    namespace: Otn
    description: Optical-specific port properties.
    label: Optical port
    icon: mdi:lightbulb-on-outline
    include_in_menu: false
    attributes:
      # Optional because a grey router port is not on the C-band grid. The
      # bounds are the two endpoints of the 96-channel 50 GHz grid in units.py,
      # asserted equal by tests/unit/test_schema_contract.py.
      - name: center_frequency_mhz
        kind: Number
        parameters:
          min_value: 191350000
          max_value: 196100000
        optional: true
        description: ITU-T G.694.1 centre frequency in MHz. No Float kind exists.
        order_weight: 1600
      - name: center_frequency_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if center_frequency_mhz__value is not none %}{{ center_frequency_mhz__value / 1000000 }} THz{% endif %}
        optional: true
        description: Centre frequency in THz. Empty on a grey port, which has none.
        order_weight: 1610
      - name: tx_power_mdbm
        kind: Number
        parameters:
          min_value: -30000
          max_value: 30000
        optional: true
        description: Transmit power in milli-dBm, -30 to +30 dBm.
        order_weight: 1700
      - name: tx_power_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if tx_power_mdbm__value is not none %}{{ tx_power_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Transmit power in dBm. Read-only, derived from tx_power_mdbm.
        order_weight: 1710
      - name: rx_sensitivity_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 10000
        optional: true
        description: Receiver sensitivity in milli-dBm, -40 to +10 dBm.
        order_weight: 1800
      - name: rx_sensitivity_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if rx_sensitivity_mdbm__value is not none %}{{ rx_sensitivity_mdbm__value / 1000 }} dBm{% endif %}
        optional: true
        description: Receiver sensitivity in dBm. Derived from rx_sensitivity_mdbm.
        order_weight: 1810
      # A Dropdown rather than an enum, so a connector carries a label, a colour
      # and a sentence. The six original names are unchanged, so no loaded value
      # is rewritten; MU, CS and splice are new.
      #
      # Changing the kind on this generic alone is refused with
      # "connector_type inherited from OtnOpticalPort must be the same kind
      # ["Dropdown", "Text"]", because the loaded schema has materialised the Text
      # attribute onto every optical port kind. All six kinds that inherit this
      # generic restate the list in otn_ports.yml, and a restatement one choice
      # short is accepted in silence.
      #
      # OtnCopperPort keeps its own connector_type as Text; no kind inherits both
      # port generics.
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
      # Return loss is a polish property, not a connector property: an LC comes
      # in all three. Null on every port loaded before this attribute existed,
      # which is what keeps the change non-destructive.
      - name: polish
        kind: Dropdown
        choices:
          - name: UPC
            label: UPC
            description: Ultra physical contact. Blue housing, about 50 dB return loss.
            color: "#2196f3"
          - name: APC
            label: APC
            description: Angled physical contact. Green housing, about 65 dB return loss.
            color: "#4caf50"
          - name: PC
            label: PC
            description: Physical contact. The oldest polish, about 35 dB return loss.
            color: "#ff9800"
          - name: none
            label: None
            description: No polished endface, such as a fusion splice.
            color: "#9e9e9e"
        optional: true
        description: Endface polish. Mating an APC to a UPC costs about 0.5 dB and reflects.
        order_weight: 1910

  - name: CopperPort
    namespace: Otn
    description: Electrical port properties for G.703 tributaries.
    label: Copper port
    icon: mdi:cable-data
    include_in_menu: false
    attributes:
      # kbps, not Mbps. E1 is 2.048 Mbps and T1 is 1.544 Mbps; as integer Mbps
      # both round to 2, which would make the two signals this generic exists to
      # carry indistinguishable.
      - name: speed_kbps
        kind: Number
        default_value: 2048
        parameters:
          min_value: 64
          max_value: 400000000
        optional: false
        description: Line rate in kbps. E1 is 2048, T1 is 1544, STM-1 is 155520.
        order_weight: 1600
      - name: impedance_ohm
        kind: Number
        default_value: 120
        parameters:
          min_value: 50
          max_value: 600
        optional: false
        description: Nominal impedance in ohms. 120 for E1 pair, 75 for coax.
        order_weight: 1700
      - name: connector_type
        kind: Text
        default_value: RJ48
        enum:
          - BNC
          - RJ48
          - RJ45
        optional: false
        order_weight: 1900

  # ---- from schemas/otn_ports.yml ----
  # Two flat generics. Generics cannot inherit generics in Infrahub, so the
  # concrete monitors multi-inherit both plus OtnGenericPort, which is the shape
  # OtnAmplifierPort already uses for OtnGenericPort and OtnOpticalPort.
  #
  # human_friendly_id and uniqueness_constraints are not declared here. Both come
  # from OtnGenericPort, and a constraint on a generic binds across every kind
  # that inherits it, so (device, name) stays unique across all five monitors
  # taken together.
  - name: Monitor
    namespace: Otn
    description: The one fact every monitoring interface carries, whatever it measures.
    label: Monitor
    icon: mdi:gauge
    include_in_menu: false
    attributes:
      # A reading with no timestamp is not a reading. This is a last known
      # value, not a telemetry feed; the age is what makes drift meaningful.
      - name: measured_at
        kind: DateTime
        optional: false
        description: When this reading was taken.
        order_weight: 1110

  - name: ChannelMonitor
    namespace: Otn
    description: What a device that sees a band of channels reports about that band.
    label: Channel monitor
    icon: mdi:chart-histogram
    include_in_menu: false
    # A ROADM degree and a multiplexer report the same two numbers, so the two
    # are declared once here rather than twice. The kinds stay distinct,
    # because a degree and a multiplexer are different equipment and a query
    # should be able to say which it means. It also leaves room for the two to
    # diverge without a migration on loaded data.
    #
    # This generic does not inherit OtnMonitor. Generics do not inherit
    # generics; the concrete kinds take both.
    attributes:
      - name: total_power_mdbm
        kind: Number
        parameters:
          min_value: -40000
          max_value: 30000
        optional: false
        description: Total power across all channels present, in millidecibel-milliwatts.
        order_weight: 1300
      - name: channel_count
        kind: Number
        parameters:
          min_value: 0
          max_value: 96
        optional: false
        description: How many channels the monitor currently sees.
        order_weight: 1310

nodes:
  # ---- from schemas/otn_ports.yml ----
  - name: RouterPort
    namespace: Otn
    description: Grey optics on an IP router. Not on the C-band grid.
    label: Router port
    icon: mdi:ethernet
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      # The module fitted in this port, and the inverse of OtnTransceiver.port.
      # Both ends are cardinality one, so the edge is one to one: the server
      # refuses the second write with "has 2 peers for
      # otn_optical_port__transceiver, maximum of 1 allowed". That is the
      # duplicate rule, carried by the schema rather than by a check.
      #
      # Declared on the three concrete kinds that have a cage and never on the
      # OtnOpticalPort generic, which would hand the field to all eight optical
      # port kinds including the five that hold no module.
      #
      # Optional on both sides, so a spare, an RMA and a decommissioned unit stay
      # modellable.
      - name: transceiver
        peer: OtnTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        on_delete: no-action
        order_weight: 960

  - name: ClientPort
    namespace: Otn
    description: Transponder client side. Where grey light arrives.
    label: Client port
    icon: mdi:lan-connect
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      # The one-to-one edge OtnRouterPort.transceiver documents, here on the kind
      # that takes a grey pluggable on the transponder side.
      - name: transceiver
        peer: OtnTransceiver
        label: Module fitted in this port
        kind: Attribute
        cardinality: one
        optional: true
        identifier: otn_optical_port__transceiver
        on_delete: no-action
        order_weight: 960

  - name: LinePort
    namespace: Otn
    description: Transponder DWDM line side. Where coloured light leaves.
    label: Line port
    icon: mdi:transit-connection
    include_in_menu: false
    inherit_from:
      - OtnGenericPort
      - OtnOpticalPort
    attributes:
      - name: connector_type
        kind: Dropdown
        choices:
          - name: LC
            label: LC
            description: Small-form duplex latch. What transponder and pluggable optics take.
            color: "#2196f3"
          - name: SC
            label: SC
            description: Push-pull square ferrule, common on older distribution frames.
            color: "#4caf50"
          - name: MPO-12
            label: MPO-12
            description: Twelve-fibre ribbon ferrule for parallel optics.
            color: "#9c27b0"
          - name: MPO-16
            label: MPO-16
            description: Sixteen-fibre ribbon ferrule for 400G parallel optics.
            color: "#673ab7"
          - name: FC
            label: FC
            description: Threaded ferrule. Still found on test sets and metro equipment.
            color: "#ff9800"
          - name: E2000
            label: E2000
            description: Shuttered push-pull connector, widespread on European carrier plant.
            color: "#00bcd4"
          - name: MU
            label: MU
            description: Miniature unibody connector, half the footprint of an SC.
            color: "#8bc34a"
          - name: CS
            label: CS
            description: Narrow-pitch duplex connector, used for QSFP-DD breakout.
            color: "#e91e63"
          - name: splice
            label: Splice
            description: Fusion splice rather than a mated pair. No connector loss and no polish.
            color: "#9e9e9e"
        optional: true
        order_weight: 1900
    relationships:
      # The wavelength this port terminates, and the deletion boundary.
      #
      # Deleting a transponder already deletes this port: OtnGenericDevice.ports
      # is kind: Component with on_delete: cascade, and a port has no meaning
      # apart from the device it sits in. The deletion stops here.
      #
      # A carrier is not a component of a line port. It is a spectrum allocation
      # on a route, holding a channel, a mode, its sections, its containers and
      # possibly ODU switches, and it exists in the plan whether or not a box is
      # currently lighting it. Cascading from this port would reach the carrier's
      # containers and the services groomed into them, so pulling one transponder
      # would destroy customer service records. It would also delete the
      # wavelength out from under the line port at the far end, which is still
      # installed: a carrier is terminated at both of its ends.
      #
      # Same policy as OtnService.diversity_group and OtnService.containers, for
      # the same reason those two state.
      #
      # Light has direction, and that is not an argument for cascade here. A line
      # port is a transceiver: every one of them carries both tx_power_mdbm and
      # rx_sensitivity_mdbm, so there is no single transmitting end to own the
      # wavelength. Cascade on a cardinality-one relationship fires from either
      # port, so it would give two owners where the intuition asked for one.
      # OtnOpticalCarrier holds no direction at all, deliberately: where this
      # model needs direction it makes two objects, the way an amplifier hut
      # does, and the budget engine evaluates a carrier both ways and takes the
      # worse. Direction lives on the plant and on the path traversal, never on
      # the wavelength.
      #
      # The model also already says "the light stopped" with status, which is
      # planned, active or decommissioned. A planned carrier has no light and
      # exists anyway. This kind is a spectrum allocation on a route, not the
      # photons on it, and deleting a box must not silently release spectrum
