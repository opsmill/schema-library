        parameters:
          min_value: 0
          max_value: 30000
        optional: false
        description: Attenuation the pad is set to, in millidecibels. 5.0 dB is 5000.
        order_weight: 1900
      - name: attenuation_display
        kind: Text
        read_only: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: >-
            {% if attenuation_mdb__value is not none %}{{ attenuation_mdb__value / 1000 }} dB{% endif %}
        optional: true
        description: Attenuation in dB. Read-only, derived from attenuation_mdb.
        order_weight: 1910

  - name: VariableAttenuator
    namespace: Otn
    description: A VOA. The same loss, dialled rather than fixed, within the range the hardware has.
    label: Variable attenuator
    icon: mdi:tune-variant
    include_in_menu: true
    menu_placement: OtnGenericDevice
    inherit_from:
      - OtnGenericDevice
      - OtnOpticalElement
    attributes:
