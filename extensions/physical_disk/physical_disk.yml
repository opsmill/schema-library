---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: DeviceWithPhysicalDisks
    namespace: Dcim
    description: Generic that hold relationship toward physical disks. To apply on device that can have physical disks.
    include_in_menu: false
    relationships:
      - name: physical_disks
        peer: DcimPhysicalDisk
        kind: Component

        cardinality: many
        optional: true
nodes:
  - name: PhysicalDisk
    namespace: Dcim
    description: Physical Disk
    label: Physical Disk
    icon: carbon:vmdk-disk
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 900
      - name: disk_type
        kind: Dropdown
        choices:
          - name: ssd
            label: SSD
            description: Solid State Drive
            color: "#a6c1ff"
          - name: nvme
            label: NVMe
            description: Non-Volatile Memory Express
            color: "#ffbf80"
          - name: hdd
            label: HDD
            description: Hard Disk Drive
            color: "#80c7a6"
          - name: hybrid
            label: Hybrid
            description: Hybrid Drive
            color: "#ffcc80"
        optional: true
        description: Specifies the type of disk
        order_weight: 950
      - name: status
        kind: Dropdown
        choices:
          - name: in_inventory
            label: In Inventory
            description: The disk is newly acquired and held in inventory.
            color: "#6c757d"
          - name: active
            label: Active
            description: The disk is currently in use within the infrastructure.
            color: "#28a745"
          - name: decommissioned
            label: Decommissioned
            description: The disk is retired from active use but still stored for potential reuse or auditing.
            color: "#17a2b8"
          - name: disposed
            label: Disposed
            description: The disk has been securely erased and disposed of.
            color: "#dc3545"
        description: Lifecycle status of the hardware component.
      - name: size
        kind: Number
        label: Size (GB)
        optional: false
        description: Disk capacity (in GB).
        order_weight: 1000
      - name: serial_number
        kind: Text
        unique: true
        optional: true
        description: Serial number of the disk
        order_weight: 1100
      - name: description
        kind: Text
        unique: false
        optional: true
        order_weight: 1500
    relationships:
      - name: device
        peer: DcimDeviceWithPhysicalDisks
        kind: Parent
        cardinality: one
        optional: false
        order_weight: 800
