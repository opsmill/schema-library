---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: InterfaceBundle
    namespace: Generic
    description: Generic holding the members of an interface bundle such as a LAG.
    label: Generic Interface Bundle
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        optional: false
        description: "Name of the interface"
        order_weight: 1000
      - name: bundle_number
        kind: Number
        optional: false
        description: "Bundle number for the aggregated interface"
        order_weight: 1250
    relationships:
      - name: bundle_members
        peer: InterfacePhysical
        label: "Member(s)"
        kind: Attribute
        cardinality: many
        identifier: interface__bundle
        optional: true
        description: "Physical Interfaces that are members of this aggregate"
        order_weight: 1800

nodes:
  - name: Lag
    namespace: Interface
    description: "LAG interface"
    label: LAG Interface
    include_in_menu: false
    inherit_from:
      - DcimInterface
      - InterfaceLayer2
      - InterfaceLayer3
      - InterfaceHasSubInterface
      - GenericInterfaceBundle
    attributes:
      - name: lacp_rate
        kind: Dropdown
        label: "LACP Rate"
        default_value: fast
        choices:
          - name: slow
            label: Slow
            color: "#E6E6FA" # lavender
          - name: fast
            label: Fast
            color: "#E6E6FA" # lavender
        optional: false
        description: "LACP rate for the aggregated interface"
        order_weight: 1850
      - name: lacp_mode
        kind: Dropdown
        label: LACP Mode
        default_value: active
        choices:
          - name: active
            label: Active
            color: "#E6E6FA" # lavender
          - name: passive
            label: Passive
            color: "#E6E6FA" # lavender
          - name: disabled
            label: Disabled
            color: "#E6E6FA" # lavender
        optional: false
        description: "LACP mode for the aggregated interface"
        order_weight: 1900
    relationships:
      # Redefine the relationship here to add the common_parent constraint
      - name: bundle_members
        peer: InterfacePhysical
        label: "Member(s)"
        kind: Attribute
        cardinality: many
        identifier: interface__bundle
        common_parent: device
        optional: true
        description: "Physical Interfaces that are members of this aggregate"
        order_weight: 1800

extensions:
  nodes:
    - kind: InterfacePhysical
      relationships:
        - name: bundle
          peer: GenericInterfaceBundle
          label: Interface Bundle
          kind: Attribute
          cardinality: one
          optional: true
          identifier: interface__bundle
          description: "Interface Bundle using this Physical Interface"
          order_weight: 1950
