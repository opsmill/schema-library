version: "1.0"

nodes:
  - name: PSUModule
    namespace: Dcim
    description: "Power Supply Unit (PSU) installed in a device."
    label: "PSU Module"
    icon: mdi:power-plug
    include_in_menu: false
    inherit_from:
      - DcimGenericModule
    attributes:
      - name: computed_name
        kind: Text
        read_only: true
        optional: false
        unique: true
        computed_attribute:
          kind: Jinja2
          jinja2_template: "{{ module_bay__computed_name__value }} ({{ module_type__name__value }})"
        description: "Name computed from the module bay and module type."
        order_weight: 1000
    relationships:
      - name: module_type
        peer: DcimPSUModuleType
        optional: false
        cardinality: one
        kind: Attribute
        order_weight: 950

  - name: PSUModuleType
    namespace: Dcim
    description: "PSU module type, defining common specifications such as wattage and hot-swap capability."
    label: "PSU Module Type"
    icon: mdi:database-cog
    include_in_menu: false
    inherit_from:
      - DcimGenericModuleType
    attributes:
      - name: wattage
        description: "Wattage in watts."
        kind: Number
        optional: true
        order_weight: 1300
      - name: hotswappable
        label: Hot-Swappable
        description: "Whether the PSU can be replaced without powering down the device."
        kind: Boolean
        optional: false
        default_value: false
        order_weight: 1350
