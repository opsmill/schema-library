---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: PolicyBGP
    namespace: Routing
    description: A routing policy for BGP.
    label: BGP Routing Policies
    icon: carbon:deployment-policy
    include_in_menu: true
    menu_placement: RoutingPolicy
    inherit_from:
      - "RoutingPolicy"
    # Add attributes here if this policy flavour needs more than the generic RoutingPolicy provides.

extensions:
  nodes:
    - kind: RoutingBGPPeerGroup
      attributes:
        - name: import_policies
          kind: Text
          state: absent
        - name: export_policies
          kind: Text
          state: absent
      relationships:
        - name: import_routing_policies
          peer: RoutingPolicyBGP
          label: Import Routing Policies
          kind: Generic
          cardinality: many
          identifier: bgppeergroup__import_policies
          optional: true
          description: "The routing-policies used by this instance for import."
          order_weight: 1750
        - name: export_routing_policies
          peer: RoutingPolicyBGP
          label: Export Routing Policies
          kind: Generic
          cardinality: many
          identifier: bgppeergroup__export_policies
          optional: true
          description: "The routing-policies used by this instance for export."
          order_weight: 1800
    - kind: RoutingBGPSession
      attributes:
        - name: import_policies
          kind: Text
          state: absent
        - name: export_policies
          kind: Text
          state: absent
      relationships:
        - name: import_routing_policies
          peer: RoutingPolicyBGP
          label: Import Routing Policies
          kind: Generic
          cardinality: many
          identifier: bgpsession__import_policies
          optional: true
          description: "The routing-policies used by this instance for import."
          order_weight: 1850
        - name: export_routing_policies
          peer: RoutingPolicyBGP
          label: Export Routing Policies
          kind: Generic
          cardinality: many
          identifier: bgpsession__export_policies
          optional: true
          description: "The routing-policies used by this instance for export."
          order_weight: 1900
