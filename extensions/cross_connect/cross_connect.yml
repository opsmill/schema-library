---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: CrossConnect
    namespace: Dcim
    description: Cross-connect between different endpoints within a datacenter.
    label: Cross-Connect
    icon: streamline:arrow-crossover-right-solid
    inherit_from:
      - DcimConnector
    human_friendly_id:
      - provider__name__value
      - identifier__value
    order_by:
      - provider__name__value
    display_label: "{{ identifier__value }} (Provider: {{ provider__name__value }})"
    uniqueness_constraints:
      - [provider, identifier__value]
    attributes:
      - name: identifier
        kind: Text
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      - name: status
        kind: Dropdown
        default_value: planned
        choices:
          - name: connected
            label: Connected
            description: "Fully operational and currently connected"
            color: "#00d25b"
          - name: planned
            label: Planned
            description: "In the process of being set up"
            color: "#2196f3"
          - name: reserved
            label: Reserved
            description: "Fully connected and reserved for a future use"
            color: "#4d90fe"
        optional: false
        order_weight: 1200
    relationships:
      - name: location
        peer: LocationHosting
        label: Location
        kind: Attribute
        cardinality: one
        optional: false
        order_weight: 1400
      - name: provider
        peer: OrganizationProvider
        kind: Attribute
        cardinality: one
        optional: false
        order_weight: 1300
