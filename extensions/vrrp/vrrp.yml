---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: VRRPGroup
    namespace: Network
    description: VRRP Group configuration
    label: VRRP Group
    icon: fluent:virtual-network-20-filled
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      # Could become a computed attribute from vrid + ip_addresses, as IpamCVLAN.name does.
      - name: name
        kind: Text
        label: Name
        unique: true
        optional: false
        description: Unique name of the entry
        order_weight: 1000
      - name: vrid
        kind: Number
        label: VRID
        parameters:
          min_value: 1
          max_value: 255
        optional: false
        description: Virtual Router ID (VRID, should be between 1 and 255)
        order_weight: 1100
      - name: password
        kind: HashedPassword
        label: Password
        optional: true
        description: VRRP Password/Key
        order_weight: 1400
    relationships:
      - name: ip_addresses
        peer: IpamIPAddress
        label: IP Addresses
        kind: Attribute
        cardinality: many
        optional: true
        on_delete: cascade
        description: VRRP IP (v4 or v6)
        order_weight: 1200
      - name: vrrp_interfaces
        peer: NetworkVRRPInterface
        label: VRRP Interfaces
        kind: Component
        cardinality: many
        on_delete: cascade
        optional: true
        order_weight: 1300

  - name: VRRPInterface
    namespace: Network
    description: VRRP Interface configuration
    label: VRRP Interface
    icon: carbon:interface-usage
    menu_placement: NetworkVRRPGroup
    order_by:
      - priority__value
    uniqueness_constraints:
      - [vrrp_group, interface]
    attributes:
      - name: priority
        kind: Number
        label: VRRP Priority
        default_value: 100
        parameters:
          min_value: 1
          max_value: 255
        optional: false
        description: VRRP Priority (Should be between 1 and 255)
        order_weight: 1100
    relationships:
      - name: vrrp_group
        peer: NetworkVRRPGroup
        label: VRRP Group
        kind: Attribute
        cardinality: one
        optional: false
        description: VRRP Group
        order_weight: 1200
      - name: interface
        peer: InterfaceLayer3
        label: Interface
        kind: Attribute
        cardinality: one
        optional: false
        description: Interface L3
        order_weight: 1300

extensions:
  nodes:
    - kind: InterfaceLayer3
      relationships:
        - name: vrrp
          peer: NetworkVRRPInterface
          label: VRRP
          kind: Component
          cardinality: one
          optional: true
          description: VRRP Interface Configuration
          order_weight: 1650
    - kind: IpamIPAddress
      relationships:
        - name: vrrp
          peer: NetworkVRRPGroup
          label: VRRP Group
          kind: Attribute
          cardinality: one
          optional: true
          description: Part of VRRP Group
          order_weight: 1700
