---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: Protocol
    namespace: Routing
    description: "Generic protocol model for routing protocols"
    label: "Routing Protocol"
    icon: "carbon:router"
    include_in_menu: true
    attributes:
      - name: description
        kind: Text
        unique: true
        optional: false
        description: "Description of the protocol"
        order_weight: 1100
      - name: status
        kind: Dropdown
        choices:
          - name: active
            label: Active
            description: "Configuration is active and operational."
            color: "#00d25b"
          - name: disabled
            label: Disabled
            description: "Configuration has been disabled."
            color: "#D3D3D3" # light grey
          - name: deleted
            label: Deleted
            description: "Configuration has been deleted."
            color: "#FAD7A0" # pastel orange
        optional: false
        description: "Status of the Protocol Configuration."
        order_weight: 1200
    relationships:
      - name: device
        peer: DcimDevice
        kind: Parent
        cardinality: one
        optional: false
        order_weight: 900
      - name: vrf
        peer: IpamVRF
        label: VRF
        kind: Attribute
        cardinality: one
        optional: false
        order_weight: 1050
