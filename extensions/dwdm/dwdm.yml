---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: GenericOadmInterface
    namespace: Dcim
    description: Generic interface of an optical add-drop multiplexer, front or rear.
    label: Optical Multiplexer Interfaces
    icon: mdi:ethernet
    include_in_menu: true
    menu_placement: DcimOpticalMultiplexer
    attributes:
      - name: name
        kind: Text
        optional: false
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      # NOTE: this choice list is duplicated in extensions/patch_panel and the two must be
      # kept in sync. Infrahub cannot share a choice list across extension files without a
      # shared generic in a common ancestor, which is a base-tier change.
      - name: connector_type
        kind: Dropdown
        choices:
          - name: fc
            label: FC
            description: "Standardized fiber optic connector used primarily in datacom and telecom applications."
          - name: lc
            label: LC
            description: "Compact fiber optic connector with a push-pull mechanism."
          - name: lc_pc
            label: LC/PC
            description: "Polished LC connector providing physical contact (PC)."
          - name: lc_upc
            label: LC/UPC
            description: "Ultra-Physical Contact (UPC) variant of the LC connector with enhanced polish."
          - name: lc_apc
            label: LC/APC
            description: "Angled Physical Contact (APC) version of the LC connector with a slanted fiber end-face."
          - name: lsh
            label: LSH
            description: "European fiber optic connector offering high durability."
          - name: lsh_pc
            label: LSH/PC
            description: "Physical Contact version of LSH with standard polish."
          - name: lsh_upc
            label: LSH/UPC
            description: "Ultra-Physical Contact variant of LSH, minimizing return loss with a superior polish."
          - name: lsh_apc
            label: LSH/APC
            description: "Angled Physical Contact version of LSH, designed to reduce back reflections."
          - name: lx_5
            label: LX.5
            description: "Miniaturized fiber optic connector similar to LC but with an additional shutter mechanism."
          - name: lx_5_pc
            label: LX.5/PC
            description: "Physical Contact version of LX.5."
          - name: lx_5_upc
            label: LX.5/UPC
            description: "Ultra-Physical Contact variant of LX.5."
          - name: lx_5_apc
            label: LX.5/APC
            description: "Angled Physical Contact version of LX.5."
          - name: mpo
            label: MPO
            description: "Multi-fiber Push-On connector typically used in data centers for high-speed applications."
          - name: mtrj
            label: MTRJ
            description: "Male-to-female fiber optic connector with two fibers."
          - name: sc
            label: SC
            description: "Square fiber optic connector with push-pull lock."
          - name: sc_pc
            label: SC/PC
            description: "Physical Contact SC connector with a polished end-face."
          - name: sc_upc
            label: SC/UPC
            description: "Ultra-Physical Contact variant of SC."
          - name: sc_apc
            label: SC/APC
            description: "Angled Physical Contact version of SC."
          - name: st
            label: ST
            description: "Bayonet-style fiber optic connector primarily used in industrial and military applications."
          - name: cs
            label: CS
            description: "Compact connector with a high-density duplex configuration."
          - name: sn
            label: SN
            description: "Small-form connector with dual fibers."
          - name: sma_905
            label: SMA 905
            description: "Stainless steel fiber optic connector."
          - name: sma_906
            label: SMA 906
            description: "Variant of SMA 905 with similar durability, frequently used in high-vibration settings."
          - name: urm_p2
            label: URM-P2
            description: "Specialized fiber optic connector for industrial and harsh environments."
          - name: urm_p4
            label: URM-P4
            description: "Similar to URM-P2 but designed for higher performance."
          - name: urm_p8
            label: URM-P8
            description: "Enhanced version of URM connectors with higher protection."
          - name: splice
            label: Splice
            description: "Permanent fiber connection method where two fiber ends are fused."
        optional: false
        order_weight: 1200
nodes:
  - name: OpticalMultiplexer
    namespace: Dcim
    description: >-
      An OADM (Optical Add Drop Multiplexer) supporting various WDM
      (Wavelength Division Multiplexing) technologies.
    label: Optical Multiplexer
    icon: mdi:transit-connection-variant
    include_in_menu: true
    inherit_from:
      - DcimPhysicalDevice
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        optional: false
        order_weight: 1000
      - name: wdm_type
        kind: Dropdown
        default_value: dwdm
        choices:
          - name: cwdm
            label: CWDM (Coarse Wavelength Division Multiplexing)
            description: Supports multiple wavelengths for communication up to 70km.
            color: "#0099cc"
          - name: dwdm
            label: DWDM (Dense Wavelength Division Multiplexing)
            description: Supports dense wavelengths and amplification for long-distance communication.
            color: "#9933cc"
        optional: false
        description: Type of WDM technology (e.g. CWDM, DWDM)
        order_weight: 1300
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
    relationships:
      - name: front_interfaces
        peer: DcimOadmFrontInterface
        kind: Component
        cardinality: many
        optional: true
        identifier: optical_multiplexer__front_interfaces
        order_weight: 1350
      - name: rear_interface
        peer: DcimOadmRearInterface
        kind: Component
        cardinality: one
        optional: true
        identifier: optical_multiplexer__rear_interface
        order_weight: 1450

  - name: OadmFrontInterface
    namespace: Dcim
    description: Client-side interface of an optical add-drop multiplexer, carrying a single channel.
    label: Optical Multiplexer Front Interfaces
    include_in_menu: true
    menu_placement: DcimGenericOadmInterface
    inherit_from:
      - DcimEndpoint
      - DcimGenericOadmInterface
    human_friendly_id:
      - optical_multiplexer__name__value
      - name__value
    order_by:
      - optical_multiplexer__name__value
      - name__value
    display_label: "{{ optical_multiplexer__name__value }} > {{ name__value }}"
    uniqueness_constraints:
      - [optical_multiplexer, name__value]
    relationships:
      - name: optical_multiplexer
        peer: DcimOpticalMultiplexer
        kind: Parent
        cardinality: one
        optional: false
        identifier: optical_multiplexer__front_interfaces
        order_weight: 900
      - name: channels
        peer: DcimWdmChannel
        kind: Attribute
        cardinality: many
        optional: true
        identifier: oadm_interface__channels
        order_weight: 1300

  - name: OadmRearInterface
    namespace: Dcim
    description: Line-side interface of an optical add-drop multiplexer, carrying the multiplexed signal.
    label: Optical Multiplexer Rear Interfaces
    include_in_menu: true
    menu_placement: DcimGenericOadmInterface
    inherit_from:
      - DcimEndpoint
      - DcimGenericOadmInterface
    human_friendly_id:
      - optical_multiplexer__name__value
      - name__value
    order_by:
      - optical_multiplexer__name__value
      - name__value
    display_label: "{{ optical_multiplexer__name__value }} > {{ name__value }}"
    uniqueness_constraints:
      - [optical_multiplexer, name__value]
    relationships:
      - name: optical_multiplexer
        peer: DcimOpticalMultiplexer
        kind: Parent
        cardinality: one
        optional: false
        identifier: optical_multiplexer__rear_interface
        order_weight: 900

  - name: WdmChannel
    namespace: Dcim
    description: A WDM channel with its wavelength and frequency.
    label: WDM Channel
    icon: game-icons:laser-warning
    include_in_menu: true
    human_friendly_id:
      - wdm_type__value
      - channel__value
    order_by:
      - wdm_type__value
      - channel__value
    display_label: "{{ wdm_type__value }} Channel {{ channel__value }}"
    uniqueness_constraints:
      # Combination must be unique
      - [frequency__value, wavelength__value, channel__value, wdm_type__value]
      # For a given type channel number must be unique
      - [channel__value, wdm_type__value]
      # TODO: Maybe add some further validations
    attributes:
      - name: channel
        kind: Number
        optional: false
        description: WDM channel number.
        order_weight: 1000
      - name: wdm_type
        kind: Dropdown
        default_value: dwdm
        choices:
          - name: cwdm
            label: CWDM (Coarse Wavelength Division Multiplexing)
            description: Supports multiple wavelengths for communication up to 70km.
            color: "#0099cc"
          - name: dwdm
            label: DWDM (Dense Wavelength Division Multiplexing)
            description: Supports dense wavelengths and amplification for long-distance communication.
            color: "#9933cc"
        optional: false
        description: Type of WDM technology (e.g. CWDM, DWDM)
        order_weight: 1100
      - name: wavelength
        kind: Text # Text until float possible in Number Kind
        label: Wavelength (nm)
        optional: false
        description: Wavelength of the channel in nm.
        order_weight: 1200
      - name: frequency
        kind: Text # Text until float possible in Number Kind
        label: Frequency (GHz)
        optional: false
        description: Frequency of the channel in GHz.
        order_weight: 1300

  - name: WdmSFP
    namespace: Dcim
    description: SFP with configuration for Wavelength Division Multiplexing.
    label: WDM SFP
    icon: mdi:laser-pointer
    include_in_menu: true
    menu_placement: DcimGenericSFP
    inherit_from:
      - DcimGenericSFP
    attributes:
      - name: wdm_type
        kind: Dropdown
        default_value: dwdm
        choices:
          - name: cwdm
            label: CWDM (Coarse Wavelength Division Multiplexing)
            description: Supports multiple wavelengths for communication up to 70km.
            color: "#0099cc"
          - name: dwdm
            label: DWDM (Dense Wavelength Division Multiplexing)
            description: Supports dense wavelengths and amplification for long-distance communication.
            color: "#9933cc"
        optional: false
        description: Type of WDM technology (e.g. CWDM, DWDM)
        order_weight: 1150
    relationships:
      - name: wdm_channel
        peer: DcimWdmChannel
        label: WDM Channel
        kind: Attribute
        cardinality: one
        optional: false
        identifier: wdm_sfp__channel
        order_weight: 1250
