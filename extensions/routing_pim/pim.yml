---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review — see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: PIM
    namespace: Routing
    description: "Protocol Independent Multicast (PIM) instance on a Virtual Router."
    label: "PIM"
    icon: "mdi:network-outline"
    include_in_menu: false
    inherit_from:
      - "RoutingProtocol"
    human_friendly_id:
      - "device__name__value"
      - "vrf__name__value"
    order_by:
      - vrf__name__value
      - device__name__value
    display_label: description__value
    uniqueness_constraints:
      - ["device", "vrf"]
    attributes:
      - name: dr_priority
        kind: Number
        default_value: 1
        optional: true
        description: "Designated Router priority."
        order_weight: 1250
      - name: import_policies
        kind: Text
        optional: true
        order_weight: 1300
      - name: export_policies
        kind: Text
        optional: true
        order_weight: 1350
    relationships:
      - name: rp_address
        peer: IpamIPAddress
        kind: Attribute
        cardinality: one
        optional: true
        description: "Rendezvous Point (RP) address for PIM."
      - name: pim_interfaces
        peer: RoutingPIMInterface
        label: PIM Interfaces
        kind: Component
        cardinality: many
        optional: true
        identifier: pim__piminterfaces

  - name: PIMInterface
    namespace: Routing
    description: "Interface configuration for PIM."
    label: "PIM Interface"
    icon: "mdi:ethernet"
    include_in_menu: false
    human_friendly_id:
      - "description__value"
    order_by:
      - description__value
    display_label: description__value
    uniqueness_constraints:
      - ["pim", "interface"]
    attributes:
      # Could be computed later on based on PIM Instance / Interface Name
      - name: description
        kind: Text
        unique: true
        optional: false
        description: "Description of the OSPF interface."
        order_weight: 1100
      - name: pim_mode
        kind: Dropdown
        choices:
          - name: sparse
            label: Sparse Mode
            description: "Sparse Mode for efficient multicast forwarding."
            color: "#E6E6FA" # lavender
          - name: dense
            label: Dense Mode
            description: "Dense Mode for heavy multicast traffic."
            color: "#E6E6FA" # lavender
          - name: bidirectional
            label: Bidirectional Mode
            description: "Bidirectional PIM for efficient traffic forwarding."
            color: "#E6E6FA" # lavender
        description: "PIM mode used for multicast routing on this interface."
        order_weight: 1150
      - name: hello_interval
        kind: Number
        default_value: 30
        optional: true
        description: "Interval for PIM hello messages (in seconds)."
        order_weight: 1300
      - name: dr_priority
        kind: Number
        default_value: 1
        optional: true
        description: "Designated Router priority on the interface."
        order_weight: 1250
    relationships:
      - name: pim
        peer: RoutingPIM
        label: PIM
        kind: Parent
        cardinality: one
        optional: false
        identifier: pim__piminterfaces
      - name: interface
        peer: InterfaceLayer3
        kind: Attribute
        cardinality: one
        optional: false
        order_weight: 1200
