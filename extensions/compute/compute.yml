---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: GenericUnit
    namespace: Compute
    description: A generic unit that can compute (e.g. server, vm ...).
    label: Compute
    include_in_menu: true

  - name: HostVirtualMachine
    namespace: Virtualization
    description: A generic unit that can host VM
    include_in_menu: false
    relationships:
      - name: virtual_machines
        peer: VirtualizationVirtualMachine
        kind: Component
        cardinality: many
        optional: true
        identifier: host__virtual_machine
        order_weight: 1450

nodes:
  - name: PhysicalServer
    namespace: Compute
    description: A physical server with fixed resources and specific hardware characteristics.
    label: Physical Server
    icon: mdi:server
    include_in_menu: true
    menu_placement: ComputeGenericUnit
    inherit_from:
      - ComputeGenericUnit
      - DcimGenericDevice
      - DcimPhysicalDevice
      # If you don't want to have VM running directly on your physical server you can comment out the following line
      - VirtualizationHostVirtualMachine
    attributes:
      - name: status
        kind: Dropdown
        default_value: active
        choices:
          - name: active
            label: Active
            description: Fully operational and currently in service.
            color: "#00d25b"
          - name: provisioning
            label: Provisioning
            description: In the process of being set up and configured.
            color: "#f0ad4e"
          - name: maintenance
            label: Maintenance
            description: Undergoing routine maintenance or repairs.
            color: "#ff9800"
          - name: drained
            label: Drained
            description: Temporarily taken out of service.
            color: "#9e9e9e"
        optional: false
        order_weight: 1200

  - name: VirtualMachine
    namespace: Virtualization
    description: A virtual machine hosted on a server or a cluster.
    label: Virtual Machine
    icon: carbon:virtual-machine
    include_in_menu: true
    menu_placement: ComputeGenericUnit
    inherit_from:
      - ComputeGenericUnit
      - DcimGenericDevice
    attributes:
      - name: role
        kind: Dropdown
        choices:
          - name: application
            label: Application
            color: "#7f7fff"
          - name: storage
            label: Storage
            color: "#bf7fbf"
        optional: true
        description: Role of the virtual machine.
        order_weight: 1300
      - name: vcpu
        kind: Number
        optional: true
        description: Number of CPU cores assigned to the VM.
        order_weight: 1400
      - name: memory
        kind: Number
        optional: true
        description: Amount of memory (in GB) assigned to the VM.
        order_weight: 1450
      - name: disk
        kind: Number
        optional: true
        description: Disk space (in GB) assigned to the VM.
        order_weight: 1500
    relationships:
      - name: host
        peer: VirtualizationHostVirtualMachine
        kind: Attribute
        cardinality: one
        optional: false
        identifier: host__virtual_machine
        order_weight: 1350
