---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# ---------------------------------------------------------------------------
# This schema is a starting point for building with Infrahub, not a finished production model.
# Adapting it for your environment typically requires architectural review, see
# docs.infrahub.app, or reach out to OpsMill for help.
# ---------------------------------------------------------------------------
version: "1.0"

generics:
  - name: Generic
    namespace: Organization
    description: An organization represents a legal entity, such as a company.
    label: Organization
    icon: mdi:domain
    include_in_menu: true
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
    relationships:
      - name: tags
        peer: BuiltinTag
        kind: Attribute
        cardinality: many
        optional: true
        order_weight: 2000

nodes:
  - name: Manufacturer
    namespace: Organization
    description: Device Manufacturer
    icon: mdi:domain
    include_in_menu: true
    menu_placement: OrganizationGeneric
    inherit_from:
      - OrganizationGeneric
    relationships:
      - name: device_types
        peer: DcimDeviceType
        kind: Attribute
        cardinality: many
        optional: true
        identifier: manufacturer__device_type
        order_weight: 1300
      - name: platforms
        peer: DcimPlatform
        kind: Attribute
        cardinality: many
        optional: true
        identifier: manufacturer__platform
        order_weight: 1400

  - name: Provider
    namespace: Organization
    description: Circuit or Location Provider
    icon: mdi:domain
    include_in_menu: true
    menu_placement: OrganizationGeneric
    inherit_from:
      - OrganizationGeneric
