# ---------------------------------------------------------------------------
# Mock data for base/dcim.yml.
# Depends on: base/organization.yml (manufacturer references).
#
# NOTE: DcimDevice is intentionally NOT populated here. DcimPhysicalDevice.location
# is a required relationship to LocationHosting, and base/location.yml only defines
# the abstract LocationGeneric/LocationHosting mixins -- there is no concrete node
# to attach a device to until a location extension is loaded. See
# objects/extensions/rack and objects/extensions/compute for device instances built
# on top of extensions/location_minimal.
# ---------------------------------------------------------------------------
