# ---------------------------------------------------------------------------
# Mock data for extensions/circuit.
# Self-sufficient: it creates every record it references, so it can be loaded
# on its own on top of base + any extension that provides a concrete
# LocationSite (extensions/location_minimal or extensions/location_site).
#
# DcimCircuitEndpoint.location is mandatory and its peer LocationHosting is a
# base generic that base itself never implements, so the endpoints need a Site
# to exist. The sites are created below with their name only, deliberately
# without a parent: extensions/location_site has no tier above Site, and
# extensions/location_minimal puts them under Americas -> United States -> Metro, so
# restating that tree here would make this file depend on location_minimal
# being loaded. Restating location_minimal's tree is not an
# option anyway, since re-upserting the hierarchy root fails with "Not
# supported to assign a value to parent for LocationRegion".
#
# ORDER: load this file BEFORE your location fixture. In the .metadata.yml
# resolver order that is what happens (circuit sorts ahead of
# location_minimal), and location_minimal's fuller definition then adopts NYC1
# and SJC1 into its hierarchy. Loading it the other way round leaves the two
# sites without a parent, because `infrahubctl object load` sends an explicit
# null for every optional cardinality-one relationship a document omits -- see
# the note at the top of objects/extensions/mlag/mlag.yml.
#
# NOTE: this file also creates the OrganizationProvider (from base) fixtures it
# needs. If base's own object file has already loaded the same records (Lumen,
# Colt), this upserts/matches them instead of duplicating -- see rule in AGENTS
# notes about repeating mandatory fields for an existing target.
# ---------------------------------------------------------------------------
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationSite
  data:
    - name: NYC1
      description: "Circuit hand-off site, New York metro."
    - name: SJC1
      description: "Circuit hand-off site, San Jose metro."

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationProvider
  data:
    - name: Lumen
      description: Lumen Technologies -- transit and dark fiber provider.
    - name: Colt
      description: Colt Technology Services -- transit and cross connects.

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCircuit
  data:
    - circuit_id: "LUMEN-00123"
      description: "NYC1 to SJC1 backbone link"
      commit_rate: 10000000
      circuit_type: point_to_point
      status: active
      provider: Lumen
      # DcimCircuit.endpoints is a Component (cardinality many) -- data is a
      # list. Each endpoint's `name` is a read_only computed attribute, so it
      # is never set here.
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            status: active
            description: "NYC1 hand-off"
            # location is cardinality one, peer LocationHosting (a Generic)
            # whose human_friendly_id is the single field name__value, so the
            # already-created site is referenced by that scalar.
            location: NYC1
          - side: z
            status: active
            description: "SJC1 hand-off"
            location: SJC1

    - circuit_id: "COLT-00456"
      description: "NYC1 internet access circuit"
      commit_rate: 1000000
      circuit_type: internet_access
      status: active
      provider: Colt
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            status: active
            description: "NYC1 hand-off"
            location: NYC1

    - circuit_id: "LUMEN-00789"
      description: "SJC1 dark fiber segment"
      circuit_type: dark_fiber
      status: provisioning
      provider: Lumen
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            status: provisioning
            description: "SJC1 hand-off"
            location: SJC1
