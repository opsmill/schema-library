# ---------------------------------------------------------------------------
# Mock data for extensions/compute.
# Depends on: base, extensions/location_minimal (LocationSite: SJC1).
# ---------------------------------------------------------------------------
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ComputePhysicalServer
  data:
    - name: sjc1-esx01
      description: ESXi hypervisor host.
      status: active
      device_type: PowerEdge R660
      rack_face: front
      # LocationSite inherits LocationHosting (a Generic) -- specify the concrete
      # kind so the reference is unambiguous.
      # `location` is cardinality one, so `data` is a single mapping, not a list.
      location:
        kind: LocationSite
        data:
          name: SJC1

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: VirtualizationVirtualMachine
  data:
    - name: sjc1-vm-web01
      description: Web front-end VM.
      role: application
      vcpu: 4
      memory: 16
      disk: 100
      # VirtualizationHostVirtualMachine is a Generic -- specify the concrete kind.
      # `host` is cardinality one, so `data` is a single mapping, not a list.
      # A nested kind+data block is validated as a full object spec, so it must
      # repeat all of the target's mandatory fields (name + location here), not
      # just enough to identify it -- the upsert then matches the server above.
      host:
        kind: ComputePhysicalServer
        data:
          name: sjc1-esx01
          location:
            kind: LocationSite
            data:
              name: SJC1
