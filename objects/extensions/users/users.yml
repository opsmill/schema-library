# ---------------------------------------------------------------------------
# Mock data for extensions/users.
# Depends on: base only (OrganizationProvider, a concrete OrganizationGeneric
# kind defined in base/organization.yml).
#
# UserGroup is created before UserAccount because UserAccount.user_group
# references it (cardinality one, concrete peer -> plain scalar HFID string).
#
# UserAccount.organization is cardinality one but its peer (OrganizationGeneric)
# is a Generic, so it must use a nested kind+data block where data is a single
# mapping (not a list) repeating all of the target's own mandatory fields
# (name). All three accounts point at the same organization, so this upserts
# the same OrganizationProvider record each time instead of duplicating it.
#
# ssh_key/password are obviously-fake placeholder values, not real secrets.
# ---------------------------------------------------------------------------
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: UserGroup
  data:
    - name: Administrators
      description: Full administrative access to all managed devices.
      idle_timeout: 900
      permissions: admin
    - name: Operators
      description: Day-to-day operational access for configuration changes.
      idle_timeout: 1800
      permissions: operator
    - name: Auditors
      description: Read-only access for compliance and auditing.
      idle_timeout: 3600
      permissions: read-only

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: UserAccount
  data:
    - name: jdoe
      full_name: Jane Doe
      password: "CHANGEME-placeholder-1!"
      mfa_enabled: true
      user_group: Administrators
      organization:
        kind: OrganizationProvider
        data:
          name: Acme Networks

    - name: bsmith
      full_name: Bob Smith
      ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEPLACEHOLDERKEYDONOTUSE bsmith@example.com"
      mfa_enabled: false
      user_group: Operators
      organization:
        kind: OrganizationProvider
        data:
          name: Acme Networks

    - name: agarcia
      full_name: Ana Garcia
      password: "CHANGEME-placeholder-2!"
      mfa_enabled: true
      user_group: Auditors
      organization:
        kind: OrganizationProvider
        data:
          name: Acme Networks
