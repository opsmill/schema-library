# ---------------------------------------------------------------------------
# Mock data for extensions/mlag.
# Depends on: base, extensions/lag (DcimDevice: nyc1-rtr01, in NYC1-RACK-01,
# with interfaces TenGigE0/0/0/1 and /2 bundled into InterfaceLag
# "Bundle-Ether1").
#
# A MlagDomain regroups exactly 2 devices (peers, min_count/max_count = 2)
# built over LAG interfaces used as peer-links. So we add a second device,
# nyc1-rtr02, in the same rack/site, with its own pair of physical interfaces
# bundled into its own "Bundle-Ether1" LAG -- mirroring nyc1-rtr01's peer-link
# LAG. Both LAGs then become the domain's peer_links.
#
# MlagInterface inherits GenericInterfaceBundle (bundle_members, cardinality
# many, peer InterfacePhysical) but NOT DcimInterface -- it has no single
# "device" of its own. Instead it is "spread across devices in the domain"
# by bundling physical interfaces that live on different peer devices. We
# add TenGigE0/0/0/3 and /4 on both devices to serve as those members.
#
# MlagInterface.mlag_domain is a Parent relationship (mandatory, cardinality
# one) paired with MlagDomain.mlag_interfaces (Component, cardinality many),
# so nesting the MlagInterface records under mlag_interfaces implies the
# mlag_domain link -- no need to set it explicitly, matching how
# extensions/rack nests InterfacePhysical under DcimDevice.interfaces.
#
# peer_links (peer InterfaceLag, concrete kind, cardinality many) and peers
# (peer DcimDevice, concrete kind, cardinality many) both use flat lists of
# human_friendly_id refs -- InterfaceLag's HFID is a 2-part
# [device__name__value, name__value] list, DcimDevice's HFID is just
# name__value.
# ---------------------------------------------------------------------------
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimDevice
  data:
    # Upsert against the existing nyc1-rtr01 (created by extensions/rack,
    # extended by extensions/lag) -- add the two physical interfaces that
    # will become MLAG interface members toward downstream access switches.
    - name: nyc1-rtr01
      device_type: ASR9001
      platform: Cisco IOS-XR
      location:
        kind: LocationRack
        data:
          name: NYC1-RACK-01
          site: NYC1
      interfaces:
        - kind: InterfacePhysical
          data:
            name: TenGigE0/0/0/3
            status: active
            role: core
        - kind: InterfacePhysical
          data:
            name: TenGigE0/0/0/4
            status: active
            role: core

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimDevice
  data:
    # Second peer of the MLAG domain -- same rack/site as nyc1-rtr01, with a
    # mirrored peer-link LAG and its own pair of MLAG-facing interfaces.
    - name: nyc1-rtr02
      status: active
      role: edge
      device_type: ASR9001
      platform: Cisco IOS-XR
      position: 41
      rack_face: front
      location:
        kind: LocationRack
        data:
          name: NYC1-RACK-01
          site: NYC1
      interfaces:
        - kind: InterfacePhysical
          data:
            name: TenGigE0/0/0/1
            status: active
            role: core
        - kind: InterfacePhysical
          data:
            name: TenGigE0/0/0/2
            status: active
            role: core
        - kind: InterfacePhysical
          data:
            name: TenGigE0/0/0/3
            status: active
            role: core
        - kind: InterfacePhysical
          data:
            name: TenGigE0/0/0/4
            status: active
            role: core
        - kind: InterfaceLag
          data:
            name: Bundle-Ether1
            description: MLAG peer-link toward nyc1-rtr01.
            status: active
            role: core
            bundle_number: 1
            lacp_mode: active
            lacp_rate: fast
            bundle_members:
              - ["nyc1-rtr02", "TenGigE0/0/0/1"]
              - ["nyc1-rtr02", "TenGigE0/0/0/2"]

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: MlagDomain
  data:
    - domain_id: "NYC1-MLAG-01"
      reload_delay: 300
      peers:
        - "nyc1-rtr01"
        - "nyc1-rtr02"
      peer_links:
        - ["nyc1-rtr01", "Bundle-Ether1"]
        - ["nyc1-rtr02", "Bundle-Ether1"]
      mlag_interfaces:
        kind: MlagInterface
        data:
          - name: Bundle-Ether100
            description: MLAG port-channel toward nyc1-acc-sw01.
            status: active
            role: router
            bundle_number: 100
            bundle_members:
              - ["nyc1-rtr01", "TenGigE0/0/0/3"]
              - ["nyc1-rtr02", "TenGigE0/0/0/3"]
          - name: Bundle-Ether101
            description: MLAG port-channel toward nyc1-acc-sw02.
            status: active
            role: router
            bundle_number: 101
            bundle_members:
              - ["nyc1-rtr01", "TenGigE0/0/0/4"]
              - ["nyc1-rtr02", "TenGigE0/0/0/4"]
