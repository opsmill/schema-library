      status: active
      role: passive
      vendor: Adtran
      model: FSP 3000
      split_type: even
      output_count: 2
      insertion_loss_mdb: 3500
      site: NYC1
      ports:
        - kind: OtnSplitterPort
          data:
            name: common
            leg: common
            role: line
            oper_state: up
            connector_type: LC
            polish: UPC
        - kind: OtnSplitterPort
          data:
            name: out-1
            leg: output
            role: line
            oper_state: up
            connector_type: LC
            polish: UPC
        - kind: OtnSplitterPort
          data:
            name: out-2
            leg: output
            role: line
            oper_state: up
            connector_type: LC
            polish: UPC

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnFiberSpan
  data:
    # A single 82 km span stands in for the NYC1 to SJC1 route, which in a real
    # network is many spans with amplifiers between them.
    - name: nyc1-sjc1-span-1
      description: Leased dark fiber between NYC1 and SJC1, north route.
      length_m: 82000
      insertion_loss_mdb: 15580
      splice_count: 20
      fiber_type: smf-g652d
      site_a: NYC1
      site_b: SJC1
      conduit: nyc1-sjc1-conduit-north
      oms_sequence: 1
      terminating_ports:
        - [nyc1-rdm01, degree-1]
        - [sjc1-rdm01, degree-1]
    # The diverse route the protect path takes. Longer, so its budget differs, and in
    # a different conduit, which is what makes the two paths genuinely diverse.
    - name: nyc1-sjc1-span-2
      description: Leased dark fiber between NYC1 and SJC1, south route.
      length_m: 104000
      insertion_loss_mdb: 19760
      splice_count: 26
      fiber_type: smf-g652d
      site_a: NYC1
      site_b: SJC1
      conduit: nyc1-sjc1-conduit-south
      oms_sequence: 1
      terminating_ports:
        - [nyc1-rdm01, degree-2]
        - [sjc1-rdm01, degree-2]
    # The passive CWDM tail. Its own span, because a span belongs to one section.
    - name: nyc1-sjc1-span-3
      description: Dark fiber carrying the coarse tail between NYC1 and SJC1.
      length_m: 41000
      insertion_loss_mdb: 8200
      splice_count: 9
      fiber_type: smf-g652d
      site_a: NYC1
      site_b: SJC1
      oms_sequence: 1
      terminating_ports:
        - [nyc1-cwdm01, cwdm-line-1]
        - [sjc1-cwdm01, cwdm-line-1]

---
# Three sections. Two ROADM to ROADM on the diverse routes, and one between the
# passive coarse pair, which is only expressible because a section terminates on
# any OtnOmsEndpoint rather than on a ROADM.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnOpticalMultiplexSection
  data:
    # `endpoint_a` and `endpoint_b` peer the OtnOmsEndpoint generic, which declares
    # no hfid, so each end names its concrete kind and upserts by its own fields.
    - name: nyc1-sjc1-oms-north
      description: North route section, amplified in the NYC1 to SJC1 direction.
      endpoint_a:
        kind: OtnRoadm
        data:
          name: nyc1-rdm01
          role: core
      endpoint_b:
        kind: OtnRoadm
        data:
          name: sjc1-rdm01
          role: core
      spans:
        - nyc1-sjc1-span-1
    - name: nyc1-sjc1-oms-south
      description: South route section, unamplified.
      endpoint_a:
        kind: OtnRoadm
        data:
          name: nyc1-rdm01
          role: core
      endpoint_b:
        kind: OtnRoadm
        data:
          name: sjc1-rdm01
          role: core
      spans:
        - nyc1-sjc1-span-2
    - name: nyc1-sjc1-oms-cwdm
      description: Coarse section between two passive multiplexers, no ROADM at either end.
      endpoint_a:
        kind: OtnMuxDemux
        data:
          name: nyc1-cwdm01
          role: passive
      endpoint_b:
        kind: OtnMuxDemux
        data:
          name: sjc1-cwdm01
          role: passive
      spans:
        - nyc1-sjc1-span-3

---
# The amplifier chain on the north section, in the A to B direction only. Position 1
# is the booster leaving NYC1 and position 2 the pre-amplifier arriving at SJC1, which
# is what oms_sequence orders. The return direction is left unamplified here.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnAmplifier
  data:
    - name: nyc1-amp01
      status: active
      role: core
      vendor: Ciena
      model: 6500 SLA
      amplifier_type: edfa
      stage: booster
      gain_mdb: 17000
      noise_figure_mdb: 5000
      max_total_output_power_mdbm: 23000
      site: NYC1
      oms_a2b: nyc1-sjc1-oms-north
      oms_sequence: 1
    - name: sjc1-amp01
      status: active
      role: core
      vendor: Ciena
      model: 6500 SLA
      amplifier_type: edfa
      stage: preamp
      gain_mdb: 21000
      noise_figure_mdb: 4500
      max_total_output_power_mdbm: 20000
      site: SJC1
      oms_a2b: nyc1-sjc1-oms-north
      oms_sequence: 2

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnDiversityGroup
  data:
    - name: dg-lumen-east
      description: Services that must not share plant with each other.

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnOpticalCarrier
  data:
    - name: nyc1-sjc1-ch16
      description: 400G wavelength on channel 16 between NYC1 and SJC1.
      status: active
      channel:
        kind: OtnFrequencyGrid
        data:
          center_frequency_mhz: 192100000
      line_ports:
        - [nyc1-txp01, line-1/0/0]
        - [sjc1-txp01, line-1/0/0]

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnService
  data:
    - name: SVC-NYC1-SJC1-0001
      description: 400G wavelength sold to Lumen between NYC1 and SJC1.
      rate_gbps: 400
      sla: gold
      status: active
      service_type: wavelength
      max_latency_ns: 500000
      endpoint_a: nyc1-txp01
      endpoint_z: sjc1-txp01
      customer: Lumen
      diversity_group: dg-lumen-east
      optical_path:
        kind: OtnOpticalPath
        data:
          - name: nyc1-sjc1-path-1
            description: Working route, north, carrying the wavelength from NYC1 to SJC1.
            segment_sequence: 1
            path_role: working
            carrier: nyc1-sjc1-ch16
            hops:
              kind: OtnPathHop
              data:
                # `element` peers with the OtnOpticalElement generic, which has
                # no hfid, so each hop names the concrete kind and upserts
                # against the object created above by its mandatory fields.
                # The ROADM cross-connect: the carrier is added, entering on the
                # add/drop port the transponder patches into and leaving by the
                # degree that faces SJC1.
                - name: nyc1-sjc1-hop-1
                  sequence: 1
                  action: add
                  element:
                    kind: OtnRoadm
                    data:
                      name: nyc1-rdm01
                      role: core
                  ingress_port: [nyc1-rdm01, add-drop-1/1]
                  egress_port: [nyc1-rdm01, degree-1]
                - name: nyc1-sjc1-hop-2
                  sequence: 2
                  action: through
                  element:
                    kind: OtnFiberSpan
                    data:
                      name: nyc1-sjc1-span-1
                      length_m: 82000
                      fiber_type: smf-g652d
                      site_a: NYC1
                      site_b: SJC1
                # The far end of the working route, where the carrier leaves the line
                # system. `drop` is the mirror of hop 1: same kind of port pair, other
                # direction of travel, which is the distinction `action` records.
                - name: nyc1-sjc1-hop-3
                  sequence: 3
                  action: drop
                  element:
                    kind: OtnRoadm
                    data:
                      name: sjc1-rdm01
                      role: core
                  ingress_port: [sjc1-rdm01, degree-1]
                  egress_port: [sjc1-rdm01, add-drop-1/1]
          # The protect route, south. It shares the service and the segment position
          # with the working path and differs only in path_role, which is the third
          # term of the uniqueness constraint that lets both exist.
          - name: nyc1-sjc1-path-2
            description: Protect route, south, over the diverse conduit.
            segment_sequence: 1
            path_role: protect
            carrier: nyc1-sjc1-ch16
            hops:
              kind: OtnPathHop
              data:
                - name: nyc1-sjc1-protect-hop-1
                  sequence: 1
                  action: add
                  element:
                    kind: OtnRoadm
                    data:
                      name: nyc1-rdm01
                      role: core
                  ingress_port: [nyc1-rdm01, add-drop-1/1]
                  egress_port: [nyc1-rdm01, degree-2]
                - name: nyc1-sjc1-protect-hop-2
                  sequence: 2
                  action: through
                  element:
                    kind: OtnFiberSpan
                    data:
                      name: nyc1-sjc1-span-2
                      length_m: 104000
                      fiber_type: smf-g652d
                      site_a: NYC1
                      site_b: SJC1
                - name: nyc1-sjc1-protect-hop-3
                  sequence: 3
                  action: drop
                  element:
                    kind: OtnRoadm
                    data:
                      name: sjc1-rdm01
                      role: core
                  ingress_port: [sjc1-rdm01, degree-2]
                  egress_port: [sjc1-rdm01, add-drop-1/1]

---
# The intra-site jumper from the transponder line port into the ROADM add/drop
# port. Every OTN port kind inherits DcimEndpoint, so extensions/cable records
# this run. `connected_endpoints` peers the DcimEndpoint generic, which has no
# hfid, so each end names its concrete kind and upserts against the port
# created above by device plus name.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCable
  data:
    - label: nyc1-txp01-line-1/0/0--nyc1-rdm01-add-drop-1/1
      status: connected
      cable_type: smf_os2
      length: 3
      connected_endpoints:
        - kind: OtnLinePort
          data:
            name: line-1/0/0
            device: nyc1-txp01
        - kind: OtnRoadmAddDropPort
          data:
            name: add-drop-1/1
            device: nyc1-rdm01
