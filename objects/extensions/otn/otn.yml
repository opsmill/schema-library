# ---------------------------------------------------------------------------
# Mock data for extensions/otn.
# Depends on: base (OrganizationManufacturer: Cisco, OrganizationProvider: Lumen
# and Colt), extensions/location_minimal (LocationSite: NYC1, SJC1),
# extensions/transceiver (DcimStandardTransceiver, which records the fitted
# pluggable). LocationRack and DcimDeviceType are created here rather than
# declared as a dependency, which is what the other extensions' object files do.
#
# Two sites, three spans in two conduits, and one protected wavelength beside a
# passive coarse tail. Enough to walk the model from a service down to the ports
# it lands on and back up from a port to the ROADM switching it, not a
# representative network.
#
# The line system is Ciena and the transponders sit on it, with a passive coarse
# pair from Adtran and a Cisco grey client pluggable. Real platform names, at
# platform granularity rather than invented card codes.
#
# References use each kind's human_friendly_id: a device by name, a port by
# device plus name. OtnFrequencyGrid is referenced with a nested kind/data
# block instead, because its hfid is a Number, the centre frequency in MHz.
# ---------------------------------------------------------------------------
---
# The optical vendors this sample uses. base ships Cisco only, which stays on the
# grey client pluggable, where a third-party optic is ordinary.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OrganizationManufacturer
  data:
    - name: Ciena
      description: Ciena Corporation.
    - name: Adtran
      description: Adtran Holdings, Inc., which now carries the ADVA FSP line.

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnFacility
  data:
    # Facility names are lower case with hyphens.
    - name: nyc1-gpu-cluster
      description: GPU training cluster handing 400G client traffic to the NYC1 PoP.
      site: NYC1

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnFiberType
  data:
    - name: smf-g652d
      description: ITU-T G.652.D standard single mode fiber.
      attenuation_coefficient_mdb_per_km: 190
      dispersion_fs_per_nm_km: 17000

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnFrequencyGrid
  data:
    # ITU-T G.694.1, 192.1 THz. On the 50 GHz plan this extension models, that is
    # channel 16, which `channel_number` derives rather than storing.
    - center_frequency_mhz: 192100000

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnTransceiverType
  data:
    - part_number: QDD-400G-DR4
      manufacturer: Cisco
      description: 400G QSFP-DD grey client optic, 500 m over parallel single mode fiber.
      form_factor: QSFP-DD
      tunable: false

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnTransponder
  data:
    - name: nyc1-txp01
      status: active
      role: edge
      vendor: Ciena
      model: Waveserver 5
      site: NYC1
      ports:
        - kind: OtnClientPort
          data:
            name: client-1/0/0
            role: client
            oper_state: up
            connector_type: MPO-12
            polish: APC
        - kind: OtnLinePort
          data:
            name: line-1/0/0
            role: line
            oper_state: up
            connector_type: LC
            polish: UPC
            center_frequency_mhz: 192100000
            tx_power_mdbm: 1000
            rx_sensitivity_mdbm: -25000

    # The far end of the wavelength. OtnService.endpoint_z is mandatory, so the
    # SJC1 end of the span needs a device of its own.
    - name: sjc1-txp01
      status: active
      role: edge
      vendor: Ciena
      model: Waveserver 5
      site: SJC1
      ports:
        - kind: OtnLinePort
          data:
            name: line-1/0/0
            role: line
            oper_state: up
            connector_type: LC
            polish: UPC
            center_frequency_mhz: 192100000
            tx_power_mdbm: 1000
            rx_sensitivity_mdbm: -25000

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimStandardTransceiver
  data:
    # The fitted module. This loads after the transponder above, because
    # DcimGenericTransceiver declares no hfid, so nothing can reference it by name:
    # the transceiver has to claim its port rather than the port claiming it.
    - serial_number: TRX-NYC1-0001
      transceiver_type: dr4
      form_factor: qsfp_dd
      status: plugged
      manufacturer: Cisco
      otn_type: QDD-400G-DR4
      # `otn_port` peers the OtnOpticalPort generic, which has no hfid, so the port
      # names its concrete kind and upserts by its uniqueness fields.
      otn_port:
        kind: OtnClientPort
        data:
          name: client-1/0/0
          role: client
          device: nyc1-txp01

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnRoadm
  data:
    - name: nyc1-rdm01
      status: active
      role: core
      vendor: Ciena
      model: 6500-T12
      insertion_loss_mdb: 5500
      site: NYC1
      # The physical asset for the same box. `dcim_device` peers the
      # DcimPhysicalDevice generic, which declares no hfid, so the record names its
      # concrete kind. It is the route to a rack elevation and to a device type, which
      # this extension reaches on the Dcim side rather than modelling natively:
      # `position` and `rack_face` sit on the record and its `location` is a
      # LocationRack. The name is shared with the OTN device on purpose, since both
      # records describe one box.
      dcim_device:
        kind: DcimDevice
        data:
          name: nyc1-rdm01
          position: 14
          rack_face: front
          device_type:
            kind: DcimDeviceType
            data:
              name: 6500-T12
              manufacturer: Ciena
          location:
            kind: LocationRack
            data:
              name: NYC1-RACK-01
              site:
                kind: LocationSite
                data:
                  name: NYC1
      ports:
        - kind: OtnRoadmAddDropPort
          data:
            name: add-drop-1/1
            role: add_drop
            oper_state: up
            connector_type: LC
            polish: UPC
        - kind: OtnRoadmDegreePort
          data:
            name: degree-1
            role: degree
            oper_state: up
            connector_type: LC
            polish: UPC
            direction: west
        - kind: OtnRoadmDegreePort
          data:
            name: degree-2
            role: degree
            oper_state: up
            connector_type: LC
            polish: UPC
            direction: south

---
apiVersion: infrahub.app/v1
