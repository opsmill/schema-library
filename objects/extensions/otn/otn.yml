apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnMuxDemux
  data:
    - name: nyc1-cwdm01
      status: active
      role: passive
      vendor: Adtran
      model: FSP 3000
      insertion_loss_mdb: 2800
      plan: cwdm
      mux_role: mux_demux
      technology: thin_film_filter
      channel_capacity: 8
      site: NYC1
      cwdm_channels:
        kind: OtnCwdmChannel
        data:
          - center_wavelength_nm: 1471
          - center_wavelength_nm: 1491
      ports:
        - kind: OtnMuxClientPort
          data:
            name: cwdm-client-1471
            role: client
            oper_state: up
            connector_type: LC
            polish: UPC
            cwdm_channel:
              kind: OtnCwdmChannel
              data:
                center_wavelength_nm: 1471
        - kind: OtnMuxLinePort
          data:
            name: cwdm-line-1
            role: line
            oper_state: up
            connector_type: LC
            polish: UPC
    - name: sjc1-cwdm01
      status: active
      role: passive
      vendor: Adtran
      model: FSP 3000
      insertion_loss_mdb: 2800
      plan: cwdm
      mux_role: mux_demux
      technology: thin_film_filter
      channel_capacity: 8
      site: SJC1
      cwdm_channels:
        kind: OtnCwdmChannel
        data:
          - center_wavelength_nm: 1471
          - center_wavelength_nm: 1491
      ports:
        - kind: OtnMuxClientPort
          data:
            name: cwdm-client-1471
            role: client
            oper_state: up
            connector_type: LC
            polish: UPC
            cwdm_channel:
              kind: OtnCwdmChannel
              data:
                center_wavelength_nm: 1471
        - kind: OtnMuxLinePort
          data:
            name: cwdm-line-1
            role: line
            oper_state: up
            connector_type: LC
            polish: UPC

---
# The coupler that feeds the working and the protect leg. The scheme it serves,
