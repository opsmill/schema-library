---
# Two conduits on separate routes. Diversity is a property of the plant, so the
# protect path earns its name by riding a span in the other one.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnConduit
  data:
    - name: nyc1-sjc1-conduit-north
      description: Northern duct route between NYC1 and SJC1.
      owner: Lumen
    - name: nyc1-sjc1-conduit-south
      description: Southern duct route between NYC1 and SJC1.
      owner: Colt

---
# The far-end ROADM. Without it the wavelength had nowhere to be dropped, and a
# section had only one end that could terminate it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnRoadm
  data:
    - name: sjc1-rdm01
      status: active
      role: core
      vendor: Ciena
      model: 6500-T12
      insertion_loss_mdb: 5500
      technology: wss_lcos
      channel_capacity: 96
      colorless: true
      directionless: true
      contentionless: false
      site: SJC1
      # The physical asset for the same box. `dcim_device` peers the
      # DcimPhysicalDevice generic, which declares no hfid, so the record names its
      # concrete kind. It is the route to a rack elevation and to a device type, which
      # this extension reaches on the Dcim side rather than modelling natively:
      # `position` and `rack_face` sit on the record and its `location` is a
      # LocationRack. The name is shared with the OTN device on purpose, since both
      # records describe one box.
      dcim_device:
        kind: DcimDevice
        data:
          name: sjc1-rdm01
          position: 14
          rack_face: front
          device_type:
            kind: DcimDeviceType
            data:
              name: 6500-T12
              manufacturer: Ciena
          location:
            kind: LocationRack
            data:
              name: SJC1-RACK-01
              site:
                kind: LocationSite
                data:
                  name: SJC1
      ports:
        - kind: OtnRoadmAddDropPort
          data:
            name: add-drop-1/1
            role: add_drop
            oper_state: up
            connector_type: LC
            polish: UPC
        - kind: OtnRoadmDegreePort
          data:
            name: degree-1
            role: degree
            oper_state: up
            connector_type: LC
            polish: UPC
            direction: east
        - kind: OtnRoadmDegreePort
          data:
            name: degree-2
            role: degree
            oper_state: up
            connector_type: LC
            polish: UPC
            direction: north

---
# A fixed coarse pair, with no ROADM at either end. The section between these two
