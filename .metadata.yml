---
# yamllint disable rule:line-length
base/dcim:
  description: 'Base DCIM schema: device types, platforms, devices, and physical and
    virtual interfaces, plus the endpoint and connector generics that cables, circuits
    and cross-connects build on.'
  name: DCIM
base/ipam:
  description: 'Base IPAM schema: IP prefixes and IP addresses, plus the scope generics
    a prefix or a VLAN group can be attached to.'
  name: IPAM
base/location:
  description: 'Base Location schema: the generic every location tier inherits from,
    and the hosting generic that lets devices and other objects be placed at a location.
    Concrete tiers such as Site come from the location extensions.'
  name: Location
base/organization:
  description: 'Base Organization schema: the generic organization plus Manufacturer
    and Provider nodes.'
  name: Organization
experimental/azure:
  attribution: '[Rowan Coleman](https://www.linkedin.com/in/rowan-coleman-6a147156/)'
  dependencies:
    - base
  description: This schema extension introduces cloud support for Microsoft Azure.
  name: Azure
experimental/circuit_service:
  dependencies:
    - extensions/circuit
  description: |
    This schema extension contains model coming on top of circuit to capture a single service shared across multiple circuits.
    For example you have a MPLS network supported by a provider connecting multiple locations:

    - One single CircuitService would be needed to store MPLS related information (e.g. service id, provider ...)
    - On each site we would create a circuit connecting on one side our device and the CircuitService on the other side
  name: Circuit Service
experimental/firewall_policer:
  dependencies:
    - base
  description: This schema extension contains models for traffic policers and the
    classes and rules that reference them, so you can describe rate limiting alongside
    the interfaces it is applied to.
  name: Firewall Policer
experimental/infiniband:
  dependencies:
    - base
    - extensions/compute
  description: 'This schema extension models the hardware of an InfiniBand fabric:
    switches with their configuration profile (AAA, role, split-ready, SSH and CLI
    settings), switch and management interfaces with lane width, split and speed options,
    rail-optimized scalable units (RSU) and the fabric that groups them. It does not
    model the InfiniBand protocol itself (subnet manager, partitions, routing).'
  name: InfiniBand Fabric Hardware
experimental/location_extended:
  dependencies:
    - base
  description: This schema extension is the most detailed when it comes to location,
    you'll find all the layers you can think of. It defines its own hierarchical Location.Rack,
    incompatible with the flat one extensions/rack defines, so load one or the other,
    not both.
  name: Location Extended
experimental/modules_linecards:
  dependencies:
    - base
    - extensions/device_module
  description: This schema extension allows you to capture Linecard related information
    like the version. You can insert the Linecard into a Dcim Physical Device and
    leverage the Linecard type model. The Linecard can accept PIC to help configure
    PORT information like breakout-capabilities and configurations.
  name: Modules Linecards
experimental/modules_routing_engine:
  dependencies:
    - base
    - extensions/device_module
  description: This schema extension allows you to capture Routing Engine related
    information like the version. You can insert the Routing Engine into a Dcim Physical
    Device and leverage the Routing Engine type model.
  name: Modules Routing Engine
experimental/qos:
  dependencies:
    - base
  description: This schema extension contains models for Quality of Service (QoS)
  name: QoS
experimental/security:
  dependencies:
    - base
  description: This schema extension contains models for implementing detailed security.
  name: Security
experimental/topology:
  dependencies:
    - base
    - extensions/vlan
  description: A schema for defining and managing network topology, strategies, and
    services.
  name: Topology
experimental/vlan-translation:
  dependencies:
    - base
  description: This schema extension is based on Juniper VLAN MAP, and not yet test
    out for other vendors.
  name: VLAN Translation
extensions/cable:
  dependencies:
    - base
  description: This schema extension contains a basic Cable model allowing you to
    connect two endpoints.
  name: Cable
extensions/circuit:
  dependencies:
    - base
  description: This schema extension adds Circuit and Circuit Endpoint nodes and links
    them to your infrastructure. A circuit could be a fiber connecting two sites,
    with one endpoint on each site.
  name: Circuit
extensions/circuit_contract:
  dependencies:
    - base
    - extensions/circuit
  description: This schema extension adds a Circuit Contract node to capture the service
    agreement behind a circuit with its provider.
  name: Circuit Contract
extensions/cluster:
  dependencies:
    - base
    - extensions/compute
  description: This schema extension contains the foundations to capture clusters.
    With this one in place you can unlock various cluster flavours (a hosting cluster
    able to host VMs, a firewall cluster built with specific appliances ...).
  name: Cluster
extensions/compute:
  dependencies:
    - base
  description: This schema extension captures physical servers and virtual machines,
    with a generic compute unit both inherit from and a generic for anything able
    to host VMs. Pair it with extensions/hosting_cluster to group compute units into
    clusters.
  name: Compute
extensions/cross_connect:
  dependencies:
    - base
  description: 'This schema extension adds a Cross-Connect node. Think of it as a
    cable operated by a provider: attach it to a location, then connect endpoints
    to it (e.g. the rear interface of a patch panel or a circuit endpoint).'
  name: Cross-Connect
extensions/device_module:
  dependencies:
    - base
  description: |
    This schema extension lets you capture module bays on a DcimPhysicalDevice and the modules installed into them (e.g. fan trays, line cards). A device can have any number of module bays, and each bay can optionally hold one module.

    It ships a ready-to-use Module and Module Type pair, plus the generic Module and Module Type you can build your own flavours on: see extensions/device_module_psu, or the experimental modules_linecards and modules_routing_engine extensions.
  name: Device Module
extensions/device_module_psu:
  dependencies:
    - base
    - extensions/device_module
  description: This schema extension adds a PSU (Power Supply Unit) flavour on top
    of the generic Module and Module Type from extensions/device_module, so you can
    track power supplies installed in a device's module bays with PSU-specific attributes
    such as wattage and hot-swap capability.
  name: PSU Module
extensions/hosting_cluster:
  dependencies:
    - base
    - extensions/cluster
    - extensions/compute
  description: A generic cluster built from compute units (e.g. servers) that can
    host virtual machines.
  name: Hosting Cluster
extensions/interface_breakout:
  dependencies:
    - base
  description: This schema extension introduces relationships to support breakout
    interfaces, enabling you to document the breakout of a physical interface into
    smaller physical interfaces.
  name: Interface Breakout
extensions/ipam_aggregate:
  dependencies:
    - base
  description: This schema extension captures the top-level IPv4 and IPv6 blocks assigned
    by a Regional Internet Registry (RIR). It adds an Aggregate node for the block
    and an RIR node for the registry or private entity that manages the address space.
  name: IPAM Aggregate
extensions/lag:
  dependencies:
    - base
  description: This schema extension includes models for Link Aggregation Groups (LAGs),
    enabling you to link physical interfaces as building blocks of your LAG interface.
    It can be used in standard networking environments as well as in compute scenarios,
    such as capturing bond interfaces.
  name: LAG
extensions/location_minimal:
  dependencies:
    - base
  description: This schema extension provides a self-contained Region -> Country ->
    Metro -> Site hierarchy for storing location data, with the Site carrying facility,
    physical address, timezone and status. Its Site node is the same as the one in
    extensions/location_site, so the two can be loaded together. A location name is
    unique across every tier, so a single-country deployment should enter the hierarchy
    at Country, with Region as the national node, rather than repeating a country
    under several regions.
  name: Location Minimal
extensions/location_site:
  dependencies:
    - base
  description: This schema extension introduces a Site node with facility, physical
    address, timezone and status, for deployments that want a flat list of sites without
    a hierarchy. It is the same Site node as in extensions/location_minimal, which
    adds Region, Country and Metro tiers above it.
  name: Location Site
extensions/mlag:
  dependencies:
    - base
    - extensions/lag
  description: |
    This schema extension contains the foundations to capture Multi-Chassis Link Aggregation Groups (MLAG). It comes on top of the LAG extension.

    In this implementation, a MLAG interface is essentially a LAG interface but linked to a MLAG domain (instead of a device). The MLAG domain regroups devices together (usually 2) and is built over LAG interfaces used as peer-link between the devices. MLAG interfaces defined at the MLAG domain level are then spread across all devices in the domain.

    This is a deliberately minimal implementation of MLAG, meant to blend with models you already have. For example, in a data center fabric you might already have a LeafGroup or similar concept: have it inherit from GenericMlagDomain and add the relationships and attributes you need.

    Not covered yet: the layer 3 overlay for MLAG interfaces (loopback, peer address ...) and surfacing MLAG interfaces on each device in the domain.
  name: MLAG
extensions/otn:
  dependencies:
    - base
    - extensions/location_site
    - extensions/transceiver
  description: |
    Optical transport network schemas covering the physical plant, the wavelength catalog, optical devices and their ports, pluggable optics, carriers and end-to-end services.
  name: OTN
  not_covered:
    - Cabling between optical devices. No OTN port is a DcimEndpoint, so extensions/cable
      cannot terminate on optical gear. Fiber is modelled as OtnFiberSpan and OtnConduit
      instead.
    - Validation of what a schema cannot express, such as which port kind may hold
      a pluggable, or whether a mux client port binds exactly one channel. This extension
      ships no checks; the schema comments mark each such rule.
    - Rack elevations, device types and platforms for optical gear. Model the physical
      asset as a DcimPhysicalDevice and link it with OtnGenericDevice.dcim_device.
    - Optical performance monitoring. The schema carries ratings and settings, such
      as a port's transmit power or a mode's required OSNR, but nothing that is measured,
      such as live power, OSNR, pre-FEC BER or an error counter. Those change continuously
      and belong in the network management system or a time series store.
    - Optical path budgets. OtnOpticalPath records which elements the light crosses
      and in what order, not the loss, OSNR margin or latency of that route. Compute
      those in a planning tool such as GNPy.
  use_cases:
    - Recording the ITU-T G.694.1 dense grid and G.694.2 coarse plan as separate kinds,
      so a carrier pointed at the wrong plan is refused when written.
    - Tracking pluggable optics as inventory, with the part number in this extension's
      catalog, the serial on the library's transceiver kinds from extensions/transceiver,
      and which optical port each unit is fitted in.
    - Modelling the outside plant, including fiber types, conduits, spans and the
      optical multiplex sections built over them.
    - Provisioning a wavelength end to end, as a service with an optical path and
      its hops through the elements the light crosses.
extensions/patch_panel:
  dependencies:
    - base
    - extensions/device_module
  description: |
    This schema extension allows you to capture patch panel related information like rear and front interfaces and the mapping between them. You can insert the patch panel into a rack and leverage the device type model. Cassettes and other inserts are tracked as regular device modules in module bays, through extensions/device_module.

    The front and rear interfaces accept all sorts of connectors, so you can plug cables, circuits and cross-connects into them.
  name: Patch Panel
extensions/peering_ixp:
  dependencies:
    - base
    - extensions/routing_bgp
    - extensions/routing_bgp_community
    - extensions/routing_policies_bgp
  description: This schema extension adds an Internet Exchange (IXP) node and an IXP
    Connection node linking your devices to an exchange, and ties IXP connections
    to the BGP sessions established over them.
  name: Internet Exchange
extensions/physical_disk:
  dependencies:
    - base
  description: |
    Simple schema allowing you to capture physical disk information for inventory and lifecycle management.

    This extension works with any kind of device: apply the DcimDeviceWithPhysicalDisks generic to a model to enable disk tracking. You might also link disks to a location, for instance to capture spares.
  name: Physical Disk
extensions/qinq:
  dependencies:
    - base
    - extensions/vlan
  description: This schema extension adds the Service VLAN and Customer VLAN nodes
    needed to model QinQ on top of the VLAN extension.
  name: QinQ
extensions/rack:
  dependencies:
    - base
    - extensions/location_site
  description: This schema extension introduces a Rack node representing a physical
    equipment rack installed at a site. Racks are placed at a LocationSite, which
    comes from extensions/location_site or extensions/location_minimal, and can host
    devices and other equipment. experimental/location_extended defines its own Rack
    node, so do not load both.
  name: Rack
extensions/routing:
  dependencies:
    - base
    - extensions/vrf
  description: This schema extension contains the Routing Protocol generic that every
    protocol extension builds on. The idea is one protocol instance per IpamVRF and
    DcimDevice pair.
  name: Routing
extensions/routing_aggregate:
  dependencies:
    - base
    - extensions/routing
  description: 'This schema extension adds an Aggregate Route node: a summary route,
    with its destination prefix and discard flag, announced by a routing protocol
    instance.'
  name: Routing Aggregate
extensions/routing_bgp:
  dependencies:
    - base
    - extensions/routing
  description: This schema extension adds Autonomous System, BGP Peer Group and BGP
    Session nodes, and links autonomous systems to devices and organizations.
  name: Routing BGP
extensions/routing_bgp_community:
  dependencies:
    - base
    - extensions/routing_policies
  description: This schema extension adds a BGP Community node to reference from routing
    policies.
  name: Routing BGP Community
extensions/routing_bgp_rr:
  dependencies:
    - base
    - extensions/routing_bgp
  description: This schema extension adds a Route Reflector Cluster node on top of
    the BGP extension and links it to BGP peer groups.
  name: Routing BGP Route Reflector
extensions/routing_ospf:
  dependencies:
    - base
    - extensions/routing
  description: This schema extension adds OSPF and OSPF Interface nodes to model an
    OSPF instance per device and VRF and the interfaces it runs on.
  name: Routing OSPF
extensions/routing_pim:
  dependencies:
    - base
    - extensions/routing
  description: This schema extension adds PIM (Protocol Independent Multicast) and
    PIM Interface nodes to model a PIM instance per device and VRF and the interfaces
    it runs on.
  name: Routing PIM
extensions/routing_policies:
  dependencies:
    - base
  description: This schema extension contains the Routing Policy generic. Each routing
    protocol extension subclasses it with its own policy flavour.
  name: Routing Policies
extensions/routing_policies_aggregate:
  dependencies:
    - base
    - extensions/routing_policies
    - extensions/routing_aggregate
  description: This schema extension adds an Aggregate Routing Policy node, a flavour
    of the Routing Policy generic, and replaces the free-text import and export policies
    on Aggregate Route with relationships to it.
  name: Routing Policies Aggregate
extensions/routing_policies_bgp:
  dependencies:
    - base
    - extensions/routing_policies
    - extensions/routing_bgp
  description: This schema extension adds a BGP Routing Policy node, a flavour of
    the Routing Policy generic, and replaces the free-text import and export policies
    on BGP Peer Group and BGP Session with relationships to it.
  name: Routing Policies BGP
extensions/routing_policies_ospf:
  dependencies:
    - base
    - extensions/routing_policies
    - extensions/routing_ospf
  description: This schema extension adds an OSPF Routing Policy node, a flavour of
    the Routing Policy generic, and replaces the free-text import and export policies
    on OSPF with relationships to it.
  name: Routing Policies OSPF
extensions/routing_policies_pim:
  dependencies:
    - base
    - extensions/routing_policies
    - extensions/routing_pim
  description: This schema extension adds a PIM Routing Policy node, a flavour of
    the Routing Policy generic, and replaces the free-text import and export policies
    on PIM with relationships to it.
  name: Routing Policies PIM
extensions/snmp:
  dependencies:
    - base
  description: This schema extension contains models for SNMP Communities and SNMP
    Clients. A community links to the devices it is configured on; any further wiring,
    to a tenant for instance, is left to you.
  name: SNMP
extensions/tenancy:
  dependencies:
    - base
  description: This schema extension introduces a Tenant node that can own devices,
    IP prefixes and addresses, and hosting locations. See the comment at the bottom
    of tenancy.yml for an example of how to extend tenancy onto optional extension
    nodes such as DcimCircuit.
  name: Tenancy
extensions/transceiver:
  dependencies:
    - base
  description: |
    This schema extension models pluggable transceivers across form factors (SFP, SFP+, QSFP, QSFP28, QSFP-DD, OSFP, CFP, XFP and more), with a Standard Transceiver and a Bidirectional Transceiver flavour built on a shared generic. A transceiver is either plugged into a physical interface or stored as a spare at a location, and can be linked to its manufacturer.

    Limitations: there is no validation between type, form factor, protocol and distance; any transceiver can be plugged into any physical interface; and nothing prevents a transceiver from being linked to both an interface and a spare location.
  name: Transceiver
extensions/vlan:
  dependencies:
    - base
  description: This schema extension adds VLAN and VLAN Group nodes, with a generic
    VLAN to build on, and links VLANs to prefixes and layer 2 interfaces.
  name: VLAN
extensions/vrf:
  dependencies:
    - base
  description: This schema extension adds VRF and Route Target nodes and links prefixes
    and IP addresses to a VRF.
  name: VRF
extensions/vrrp:
  dependencies:
    - base
  description: This schema extension adds VRRP Group and VRRP Interface nodes, linking
    a virtual IP address to the layer 3 interfaces that take part in the group.
  name: VRRP
